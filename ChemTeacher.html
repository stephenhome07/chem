      )}
    </div>
  );
}


function ExamMakeupView({ activeStudents, examMaps, examScores, setExamScores, currentCohort }) {
  const examIds = useMemo(
    () => Object.keys(examMaps || {}).filter(id => examVisibleForCohort(examMaps[id], currentCohort)).sort(),
    [examMaps, currentCohort]
  );
  const [selectedExam, setSelectedExam] = useState(examIds[0] || "");
  const [makeup, setMakeup] = useState({});
  const [focus, setFocus] = useState("");
  const [filter, setFilter] = useState("active"); // active | done | all
  const [loading, setLoading] = useState(false);
  const [saving, setSaving] = useState(false);
  const [mkMc, setMkMc] = useState(10);
  const [mkLq, setMkLq] = useState(0);
  const [mkLevel, setMkLevel] = useState("淺");
  const [promptTopicIds, setPromptTopicIds] = useState([]);

  useEffect(() => {
    if (examIds.length && !examIds.includes(selectedExam)) setSelectedExam(examIds[0] || "");
  }, [examIds]);

  const map = examMaps[selectedExam];
  const qList = map?.questions || [];
  const activeIdsKey = useMemo(() => activeStudents.map(s => s.id).join(","), [activeStudents]);

  useEffect(() => {
    if (!selectedExam || !activeStudents.length) return;
    let cancelled = false;
    (async () => {
      setLoading(true);
      try {
        const part = await loadExamScoresForExam(activeStudents.map(s => s.id), selectedExam);
        let mk = {};
        try { mk = await loadExamMakeup(selectedExam); } catch (e) {}
        if (cancelled) return;
        if (part.__meta) delete part.__meta;
        setExamScores(prev => {
          const next = { ...prev };
          Object.keys(part).forEach(sid => {
            next[sid] = { ...(next[sid] || {}), ...(part[sid] || {}) };
          });
          return next;
        });
        setMakeup(mk || {});
        setFocus("");
      } catch (e) { console.warn(e); }
      if (!cancelled) setLoading(false);
    })();
    return () => { cancelled = true; };
  }, [selectedExam, activeIdsKey]);

  useEffect(() => {
    if (!focus || !makeup[focus]) { setPromptTopicIds([]); return; }
    const topics = makeup[focus].topics || {};
    const pending = Object.keys(topics).filter(tid => !topics[tid]?.done)
      .sort((a, b) => String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: "base" }));
    setPromptTopicIds(pending.length ? [pending[0]] : []);
  }, [focus]);

  const calcStudent = (sid) => {
    if (!map) return null;
    const rec = examScores[sid]?.[selectedExam] || {};
    let mcScore = 0, mcMax = 0, lqScore = 0, lqMax = 0, any = false;
    qList.forEach(q => {
      const max = q.max || 1;
      if (q.type === "MC") mcMax += max; else lqMax += max;
      const raw = rec[q.id];
      if (raw === undefined || raw === null || String(raw).trim() === "") return;
      any = true;
      const sc = quizQuestionScore(q, raw);
      if (sc == null) return;
      if (q.type === "MC") mcScore += sc; else lqScore += sc;
    });
    if (!any) return null;
    const totalMax = mcMax + lqMax;
    const total = mcScore + lqScore;
    // weighted like exam input: MC 35 LQ 65 if both exist
    let weighted = totalMax > 0 ? (total / totalMax) * 100 : 0;
    if (mcMax > 0 && lqMax > 0) {
      weighted = ((mcScore / mcMax) * 0.35 + (lqScore / lqMax) * 0.65) * 100;
    }
    return { total, max: totalMax, weighted, mcScore, mcMax, lqScore, lqMax };
  };

  const persist = async (nextMap) => {
    setSaving(true);
    try {
      await saveExamMakeup(selectedExam, nextMap);
      setMakeup(nextMap);
    } catch (e) { alert(e.message); }
    setSaving(false);
  };

  const buildWeakTopicsForStudent = (sid) => {
    const topics = {};
    const rec = examScores[sid]?.[selectedExam] || {};
    const topicBag = {};
    qList.forEach(q => {
      if (!q.topicId) return;
      const raw = rec[q.id];
      if (raw === undefined || raw === null || String(raw).trim() === "") return;
      const sc = quizQuestionScore(q, raw);
      if (sc == null) return;
      if (!topicBag[q.topicId]) topicBag[q.topicId] = { score: 0, max: 0, desc: q.topicDesc || "", qs: [] };
      topicBag[q.topicId].score += sc;
      topicBag[q.topicId].max += (q.max || 1);
      topicBag[q.topicId].desc = q.topicDesc || topicBag[q.topicId].desc;
      topicBag[q.topicId].qs.push(q.id);
    });
    Object.entries(topicBag).forEach(([tid, v]) => {
      const pct = v.max > 0 ? (v.score / v.max) * 100 : 0;
      if (pct < 60) {
        topics[tid] = { done: false, label: v.desc || tid, pct: Math.round(pct), qs: v.qs };
      }
    });
    return topics;
  };

  /** 本卷所有學習點（含得分率）；缺席／未答視為 null */
  const examTopicPoolForStudent = (sid) => {
    const rec = examScores[sid]?.[selectedExam] || {};
    const topicBag = {};
    qList.forEach(q => {
      if (!q.topicId) return;
      if (!topicBag[q.topicId]) topicBag[q.topicId] = { score: 0, max: 0, answered: 0, desc: q.topicDesc || "", qs: [] };
      topicBag[q.topicId].desc = q.topicDesc || topicBag[q.topicId].desc;
      topicBag[q.topicId].qs.push(q.id);
      topicBag[q.topicId].max += (q.max || 1);
      const raw = rec[q.id];
      if (raw === undefined || raw === null || String(raw).trim() === "") return;
      const sc = quizQuestionScore(q, raw);
      if (sc == null) return;
      topicBag[q.topicId].score += sc;
      topicBag[q.topicId].answered++;
    });
    return Object.entries(topicBag).map(([tid, v]) => {
      const pct = v.answered > 0 && v.max > 0 ? Math.round((v.score / v.max) * 100) : null;
      return { tid, label: v.desc || tid, pct, qs: v.qs, weak: pct == null || pct < 60 };
    }).sort((a, b) => String(a.tid).localeCompare(String(b.tid), undefined, { numeric: true, sensitivity: "base" }));
  };

  const addStudent = (sid, category) => {
    if (!sid || makeup[sid]) return;
    const st = calcStudent(sid);
    const entry = {
      category: category || (!st ? "ABSENT" : (st.weighted < 50 ? "FAIL" : "LOW")),
      remark: "",
      sessionNote: "",
      topics: buildWeakTopicsForStudent(sid),
      status: "PENDING",
      updatedAt: new Date().toISOString()
    };
    const next = { ...makeup, [sid]: entry };
    persist(next);
    setFocus(sid);
  };

  const addSuggested = () => {
    const next = { ...makeup };
    activeStudents.forEach(s => {
      const st = calcStudent(s.id);
      if (!st || st.weighted < 50) {
        if (!next[s.id]) {
          next[s.id] = {
            category: !st ? "ABSENT" : "FAIL",
            remark: "",
            sessionNote: "",
            topics: buildWeakTopicsForStudent(s.id),
            status: "PENDING",
            updatedAt: new Date().toISOString()
          };
        }
      }
    });
    persist(next);
  };

  const removeStudent = (sid) => {
    if (!confirm("從補考名單移除？進度會刪除。")) return;
    const next = { ...makeup };
    delete next[sid];
    persist(next);
    if (focus === sid) setFocus("");
  };

  const listIds = Object.keys(makeup).filter(sid => {
    const m = makeup[sid] || {};
    const topics = m.topics || {};
    const ids = Object.keys(topics);
    const done = ids.length > 0 && ids.every(id => topics[id]?.done);
    if (filter === "active") return !done;
    if (filter === "done") return done;
    return true;
  }).sort((a, b) => {
    const prog = (sid) => {
      const t = makeup[sid]?.topics || {};
      const ids = Object.keys(t);
      if (!ids.length) return 0;
      return ids.filter(id => t[id]?.done).length / ids.length;
    };
    return prog(a) - prog(b);
  });

  const sortTopicIds = (ids) => {
    return [...ids].sort((a, b) => String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: "base" }));
  };

  const buildPrompt = (sid) => {
    const m = makeup[sid] || {};
    const s = activeStudents.find(x => x.id === sid);
    const name = s ? `${s.class}-${s.num} ${s.name}` : sid;
    const topics = m.topics || {};
    let chosen = (promptTopicIds.length ? promptTopicIds : Object.keys(topics).filter(tid => !topics[tid]?.done))
      .filter(tid => topics[tid]);
    chosen = sortTopicIds(chosen);
    const lines = chosen.length
      ? chosen.map(tid => {
          const tp = topics[tid];
          return `- [${tid}] ${tp.label || ""}（考試得分率約 ${tp.pct != null ? tp.pct + "%" : "—"}；狀態：${tp.done ? "已完成" : "待補"}）`;
        }).join("\n")
      : "- （尚未指定課題：請按考試範圍與學生程度出由淺入深的鞏固練習）";
    const syllabus = getSyllabusTableText(chosen);
    return `【身份】你是香港 DSE 化學科老師，正在為學生進行【分日補底／補考練習】。

【學生】${name}
【考試】${map?.title || selectedExam}
【今次只處理以下課題】（按 topicId 排序；其餘日後再補，不要一次出完全部）
${lines}

【課程大綱參考】
${syllabus}

【基本設定】
- 語言：繁體中文
- 難度：${mkLevel}
- MC：${mkMc} 題；LQ：${mkLq} 題
- ★ 必須用 AI **Canvas（畫布）** 做成【互動式小測驗】：逐題顯示、學生作答後再給對錯與簡短解說

【要求】
1. 緊貼上述 topicId 與失分點，由淺入深，適合能力一般、時間有限的學生。
2. MC 附 4 選項；答錯指出迷思。
3. 不要一次公開全部答案。
4. 開頭用一句話說明這是今日補底練習，語氣鼓勵、簡短。
5. 每題標明 topicId。`;
  };

  if (!examIds.length) {
    return <div className="p-8 text-slate-400">此群組尚無考試。請先在「考試內容設定」建立。</div>;
  }

  const focusM = focus ? makeup[focus] : null;
  const focusS = focus ? activeStudents.find(x => x.id === focus) : null;
  const focusTopics = focusM?.topics || {};
  const focusIds = Object.keys(focusTopics);
  const focusDone = focusIds.filter(id => focusTopics[id]?.done).length;
  const focusPct = focusIds.length ? Math.round((focusDone / focusIds.length) * 100) : 0;
  const focusComplete = focusIds.length > 0 && focusDone === focusIds.length;

  return (
    <div className="space-y-4">
      <div className="flex flex-wrap justify-between gap-3 items-start">
        <div>
          <h2 className="font-bold text-xl text-purple-800">補考專區</h2>
          <p className="text-sm text-slate-500">適合放學／Lunch 分日補底：加入低分同學 → 按弱點出題 → 完成課題剔低 → 全部完成即 OK。</p>
        </div>
        <select className="border-2 rounded-xl px-3 py-2 text-sm font-bold min-w-[220px]" value={selectedExam}
          onChange={e => { setSelectedExam(e.target.value); setFocus(""); }}>
          {examIds.map(id => <option key={id} value={id}>{id} — {examMaps[id]?.title || id}</option>)}
        </select>
      </div>

      {loading && <div className="text-xs text-slate-400">載入考試成績與補考名單…</div>}
      {saving && <div className="text-xs text-purple-600">儲存中…</div>}

      <div className="flex flex-wrap gap-2 items-center">
        <select className="border rounded-lg px-2 py-2 text-sm" defaultValue=""
          onChange={e => { const v = e.target.value; e.target.value = ""; if (v) addStudent(v); }}>
          <option value="">＋ 手動加入學生…</option>
          {activeStudents.filter(s => !makeup[s.id]).map(s => {
            const st = calcStudent(s.id);
            return (
              <option key={s.id} value={s.id}>
                {s.class}-{s.num} {s.name}{st ? `（${Math.round(st.weighted)}%）` : "（無測）"}
              </option>
            );
          })}
        </select>
        <button className="bg-amber-500 hover:bg-amber-600 text-white font-bold text-sm px-4 py-2 rounded-xl" onClick={addSuggested}>
          ＋ 加入建議名單（無測 + &lt;50%）
        </button>
        <div className="ml-auto flex gap-1">
          {[["active","進行中"],["done","已完成"],["all","全部"]].map(([k,lab]) => (
            <button key={k} onClick={() => setFilter(k)}
              className={`text-xs font-bold px-3 py-1.5 rounded-full border ${filter===k?"bg-purple-600 text-white border-purple-700":"bg-white text-slate-600"}`}>
              {lab}
            </button>
          ))}
        </div>
      </div>

      <div className="grid lg:grid-cols-5 gap-4">
        <div className="lg:col-span-2 bg-white rounded-2xl border p-3 max-h-[70vh] overflow-auto space-y-2">
          <div className="text-sm font-bold text-slate-600 px-1">補考名單（{listIds.length}）</div>
          {!listIds.length && <p className="text-xs text-slate-400 p-3">尚未有學生。可手動加入或一鍵建議名單。</p>}
          {listIds.map(sid => {
            const s = activeStudents.find(x => x.id === sid);
            const m = makeup[sid] || {};
            const topics = m.topics || {};
            const ids = Object.keys(topics);
            const doneN = ids.filter(id => topics[id]?.done).length;
            const pct = ids.length ? Math.round((doneN / ids.length) * 100) : 0;
            const complete = ids.length > 0 && doneN === ids.length;
            return (
              <button key={sid} type="button" onClick={() => setFocus(sid)}
                className={`w-full text-left rounded-xl border p-3 ${focus===sid?"border-purple-400 bg-purple-50 ring-1 ring-purple-200":"border-slate-100 hover:bg-slate-50"}`}>
                <div className="flex justify-between gap-2">
                  <span className="font-bold text-sm">{s ? `${s.class}-${s.num} ${s.name}` : sid}</span>
                  <span className={`text-[10px] font-black px-1.5 py-0.5 rounded ${complete?"bg-emerald-100 text-emerald-700":"bg-amber-100 text-amber-800"}`}>
                    {complete ? "已完成" : "進行中"}
                  </span>
                </div>
                <div className="mt-1 flex items-center gap-2">
                  <div className="flex-1 h-2 rounded-full bg-slate-100 overflow-hidden">
                    <div className={`h-full ${complete?"bg-emerald-500":"bg-purple-500"}`} style={{width: pct+"%"}} />
                  </div>
                  <span className="text-[11px] font-bold">{doneN}/{ids.length}</span>
                </div>
                {(m.sessionNote || m.remark) && (
                  <div className="text-[11px] text-slate-500 mt-1 truncate">📝 {m.sessionNote || m.remark}</div>
                )}
                <div className="text-[10px] text-slate-400 mt-0.5">
                  {m.category==="FAIL"?"不合格":m.category==="ABSENT"?"無測／缺席":m.category==="LOW"?"低分":"手動"}
                </div>
              </button>
            );
          })}
        </div>

        <div className="lg:col-span-3 bg-white rounded-2xl border p-4 space-y-4">
          {!focus || !focusM ? (
            <p className="text-slate-400 text-center p-10">在左側選一位學生開始今日補底</p>
          ) : (
            <>
              <div className="flex flex-wrap justify-between gap-2 items-start">
                <div>
                  <div className="font-black text-lg text-purple-900">
                    {focusS ? `${focusS.class}-${focusS.num} ${focusS.name}` : focus}
                  </div>
                  <div className="text-xs text-slate-500">
                    進度 {focusDone}/{focusIds.length}（{focusPct}%）
                    {focusComplete && <span className="ml-2 text-emerald-600 font-bold">✓ 全部課題已完成</span>}
                  </div>
                </div>
                <button className="text-rose-600 text-xs font-bold" onClick={() => removeStudent(focus)}>移出名單</button>
              </div>

              <div className="grid sm:grid-cols-2 gap-2">
                <label className="text-xs font-bold">約見／備註（例如 Lunch、放學、只做 Q1-2）
                  <input className="mt-1 w-full border rounded-lg px-2 py-1.5 text-sm"
                    value={focusM.sessionNote || ""}
                    onChange={e => {
                      const next = { ...makeup, [focus]: { ...focusM, sessionNote: e.target.value, updatedAt: new Date().toISOString() } };
                      setMakeup(next);
                    }}
                    onBlur={() => persist(makeup)}
                    placeholder="今日約 Lunch；上次做到 2.3.3" />
                </label>
                <label className="text-xs font-bold">其他備註
                  <input className="mt-1 w-full border rounded-lg px-2 py-1.5 text-sm"
                    value={focusM.remark || ""}
                    onChange={e => {
                      const next = { ...makeup, [focus]: { ...focusM, remark: e.target.value } };
                      setMakeup(next);
                    }}
                    onBlur={() => persist(makeup)} />
                </label>
              </div>

              <div>
                <div className="font-bold text-sm text-slate-700 mb-1">本卷學習點（納入補底名單）</div>
                <p className="text-[11px] text-slate-500 mb-2">&lt;60% 預設已勾；≥60% 可自行勾選加入。右側剔「今日已完成」。</p>
                {(() => {
                  const pool = examTopicPoolForStudent(focus);
                  const weak = pool.filter(x => x.weak);
                  const strong = pool.filter(x => !x.weak);
                  const toggleInclude = (item) => {
                    const nextTopics = { ...focusTopics };
                    if (nextTopics[item.tid]) {
                      delete nextTopics[item.tid];
                    } else {
                      nextTopics[item.tid] = {
                        done: false,
                        label: item.label,
                        pct: item.pct,
                        qs: item.qs
                      };
                    }
                    const ids = Object.keys(nextTopics);
                    const allDone = ids.length > 0 && ids.every(id => nextTopics[id].done);
                    persist({
                      ...makeup,
                      [focus]: {
                        ...focusM,
                        topics: nextTopics,
                        status: allDone ? "DONE" : "PENDING",
                        updatedAt: new Date().toISOString()
                      }
                    });
                  };
                  const markDone = (tid) => {
                    if (!focusTopics[tid]) return;
                    const nextTopics = {
                      ...focusTopics,
                      [tid]: { ...focusTopics[tid], done: !focusTopics[tid].done }
                    };
                    const ids = Object.keys(nextTopics);
                    const allDone = ids.length > 0 && ids.every(id => nextTopics[id].done);
                    persist({
                      ...makeup,
                      [focus]: {
                        ...focusM,
                        topics: nextTopics,
                        status: allDone ? "DONE" : "PENDING",
                        updatedAt: new Date().toISOString()
                      }
                    });
                  };
                  const row = (item, zone) => {
                    const included = !!focusTopics[item.tid];
                    const done = included && focusTopics[item.tid]?.done;
                    return (
                      <div key={item.tid} className={`flex items-center gap-2 border rounded-xl p-2 ${done?"bg-emerald-50 border-emerald-200":included?"bg-white border-purple-200":"bg-slate-50 border-slate-100"}`}>
                        <label className="flex items-center gap-2 flex-1 min-w-0 cursor-pointer">
                          <input type="checkbox" checked={included} onChange={() => toggleInclude(item)} />
                          <div className="min-w-0">
                            <div className="text-sm font-bold">
                              <span className="mono text-purple-700">{item.tid}</span>{" "}
                              <span className="text-slate-700">{item.label}</span>
                            </div>
                            <div className="text-[11px] text-slate-500">
                              {item.pct == null ? "未答／無分" : `得分率 ${item.pct}%`}
                              {included ? (done ? " · 今日已完成" : " · 待補") : ""}
                            </div>
                          </div>
                        </label>
                        {included && (
                          <button type="button"
                            className={`text-[11px] font-bold px-2 py-1 rounded-lg border ${done?"bg-emerald-600 text-white border-emerald-700":"bg-white text-slate-600 border-slate-200"}`}
                            onClick={() => markDone(item.tid)}>
                            {done ? "已完成" : "標完成"}
                          </button>
                        )}
                      </div>
                    );
                  };
                  return (
                    <div className="space-y-3 max-h-64 overflow-auto">
                      <div>
                        <div className="text-xs font-black text-rose-700 mb-1">弱項 &lt; 60%（預設納入）· {weak.length}</div>
                        <div className="space-y-1.5">{weak.length ? weak.map(i => row(i, "weak")) : <p className="text-xs text-slate-400">無</p>}</div>
                      </div>
                      <div>
                        <div className="text-xs font-black text-emerald-700 mb-1">≥ 60%（可手動勾選加入）· {strong.length}</div>
                        <div className="space-y-1.5">{strong.length ? strong.map(i => row(i, "strong")) : <p className="text-xs text-slate-400">無</p>}</div>
                      </div>
                      {!pool.length && <p className="text-xs text-slate-400">此卷題目未設 topicId。</p>}
                    </div>
                  );
                })()}
              </div>

              <div className="rounded-xl border-2 border-purple-200 bg-purple-50 p-4 space-y-3">
                <div className="font-bold text-purple-900 text-sm">今次補底 · 出題 Prompt（topicId 按順序；未勾則用未完成課題）</div>
                <p className="text-[11px] text-purple-800">時間有限可只選 1–2 個 topic；未選也可複製（會提示）。</p>
                <div className="flex flex-wrap gap-1.5">
                  {sortTopicIds(focusIds).map(tid => {
                    const on = promptTopicIds.includes(tid);
                    return (
                      <button key={tid} type="button"
                        onClick={() => setPromptTopicIds(prev => prev.includes(tid) ? prev.filter(x => x !== tid) : [...prev, tid])}
                        className={`text-[11px] font-bold px-2 py-1 rounded-lg border ${on?"bg-purple-600 text-white border-purple-700":"bg-white text-slate-600 border-slate-200"} ${focusTopics[tid]?.done?"opacity-50":""}`}>
                        {tid}{focusTopics[tid]?.done?" ✓":""}
                      </button>
                    );
                  })}
                </div>
                <div className="grid grid-cols-3 gap-2">
                  <label className="text-xs font-bold">難度
                    <select className="mt-0.5 w-full border rounded px-1 py-1" value={mkLevel} onChange={e=>setMkLevel(e.target.value)}>
                      <option value="淺">淺</option><option value="中">中</option><option value="深">深</option>
                    </select>
                  </label>
                  <label className="text-xs font-bold">MC
                    <input type="number" className="mt-0.5 w-full border rounded px-1 py-1" value={mkMc} onChange={e=>setMkMc(parseInt(e.target.value)||0)} />
                  </label>
                  <label className="text-xs font-bold">LQ
                    <input type="number" className="mt-0.5 w-full border rounded px-1 py-1" value={mkLq} onChange={e=>setMkLq(parseInt(e.target.value)||0)} />
                  </label>
                </div>
                <button className="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2.5 rounded-xl text-sm"
                  onClick={() => {
                    const topics = focusTopics || {};
                    const chosen = promptTopicIds.length
                      ? promptTopicIds
                      : Object.keys(topics).filter(tid => !topics[tid]?.done);
                    if (!chosen.length) {
                      if (!confirm("尚未勾選課題，也沒有「未完成」課題。\n仍要複製通用補底 Prompt？")) return;
                    }
                    navigator.clipboard.writeText(buildPrompt(focus)).then(()=>alert("已複製今次補底 Prompt" + (chosen.length ? `（${chosen.length} 課題）` : "（未指定課題）"))).catch(()=>alert("失敗"));
                  }}>
                  複製 Canvas 互動補底 Prompt
                </button>
              </div>
            </>
          )}
        </div>
      </div>
    </div>
  );
}


function ExamSummaryView({ activeStudents, examMaps, currentCohort }) {
  const available = useMemo(
    () => Object.keys(examMaps || {}).filter(id => examVisibleForCohort(examMaps[id], currentCohort)).sort(),
    [examMaps, currentCohort]
  );
  const [included, setIncluded] = useState({});
  const [scores, setScores] = useState({});
  const [loading, setLoading] = useState(false);

  useEffect(() => {
    setIncluded(prev => {
      const next = {};
      available.forEach(id => { next[id] = prev[id] !== undefined ? prev[id] : true; });
      return next;
    });
  }, [available.join("|")]);

  const selectedIds = useMemo(() => available.filter(id => included[id]), [available, included]);

  useEffect(() => {
    if (!activeStudents.length || !selectedIds.length) {
      setScores({});
      return;
    }
    let cancelled = false;
    (async () => {
      setLoading(true);
      try {
        const merged = {};
        activeStudents.forEach(s => { merged[s.id] = {}; });
        for (const eid of selectedIds) {
          const part = await loadExamScoresForExam(activeStudents.map(s => s.id), eid);
          if (part.__meta) delete part.__meta;
          Object.keys(part).forEach(sid => {
            if (!merged[sid]) merged[sid] = {};
            Object.assign(merged[sid], part[sid] || {});
          });
        }
        if (!cancelled) setScores(merged);
      } catch (e) { console.warn(e); }
      if (!cancelled) setLoading(false);
    })();
    return () => { cancelled = true; };
  }, [selectedIds.join("|"), activeStudents.map(s => s.id).join(",")]);

  const examMeta = useMemo(() => {
    const m = {};
    available.forEach(id => {
      const qs = examMaps[id]?.questions || [];
      let totalMax = 0, mcMax = 0, lqMax = 0;
      qs.forEach(q => {
        const max = q.max || 0;
        totalMax += max;
        if (q.type === "MC") mcMax += max; else lqMax += max;
      });
      m[id] = { totalMax, mcMax, lqMax, questions: qs };
    });
    return m;
  }, [available, examMaps]);

  const scoreOf = (sid, eid) => {
    const rec = scores[sid]?.[eid];
    const meta = examMeta[eid];
    if (!rec || !meta) return null;
    let any = false, total = 0, mcScore = 0, lqScore = 0;
    meta.questions.forEach(q => {
      const raw = rec[q.id];
      if (raw === undefined || raw === null || String(raw).trim() === "") return;
      any = true;
      const sc = quizQuestionScore(q, raw);
      if (sc == null) return;
      total += sc;
      if (q.type === "MC") mcScore += sc; else lqScore += sc;
    });
    if (!any) return null;
    let weighted = 0;
    if (meta.mcMax > 0 && meta.lqMax > 0) weighted = (mcScore / meta.mcMax) * 35 + (lqScore / meta.lqMax) * 65;
    else if (meta.mcMax > 0) weighted = (mcScore / meta.mcMax) * 100;
    else if (meta.lqMax > 0) weighted = (lqScore / meta.lqMax) * 100;
    return { total, max: meta.totalMax, weighted };
  };

  const rows = useMemo(() => {
    return activeStudents.map(s => {
      const qs = {};
      let sumW = 0, n = 0;
      selectedIds.forEach(eid => {
        const sc = scoreOf(s.id, eid);
        qs[eid] = sc;
        if (sc) { sumW += sc.weighted; n++; }
      });
      return { ...s, examScores: qs, average: n > 0 ? sumW / n : null };
    });
  }, [activeStudents, selectedIds, scores, examMeta]);

  const exportExcel = () => {
    const header = ["班別", "號", "姓名", "學生ID",
      ...selectedIds.map(id => id + "分數"),
      ...selectedIds.map(id => id + "加權"),
      "平均加權"];
    const maxRow = ["", "", "滿分", "",
      ...selectedIds.map(id => examMeta[id]?.totalMax || 0),
      ...selectedIds.map(() => "100"),
      "100"];
    const body = rows.map(s => {
      const scoreCols = selectedIds.map(id => s.examScores[id] == null ? "" : s.examScores[id].total);
      const wCols = selectedIds.map(id => s.examScores[id] == null ? "" : s.examScores[id].weighted.toFixed(1));
      return [s.class, s.num, s.name, s.id, ...scoreCols, ...wCols, s.average == null ? "" : s.average.toFixed(1)];
    });
    const csv = [header, maxRow, ...body].map(r => r.map(c => {
      const x = String(c ?? "");
      return /[",\n]/.test(x) ? `"${x.replace(/"/g, '""')}"` : x;
    }).join(",")).join("\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "exam_summary.csv";
    a.click();
  };

  const cellCls = (sc) => {
    if (!sc) return "";
    if (sc.weighted < 40) return "bg-rose-50 text-rose-700";
    if (sc.weighted < 60) return "bg-amber-50 text-amber-800";
    return "";
  };

  return (
    <div className="bg-white rounded-2xl border p-4 space-y-3">
      <div className="flex flex-wrap items-center justify-between gap-2">
        <div>
          <h2 className="font-bold text-lg">考試分數表</h2>
          <p className="text-xs text-slate-500">勾選要顯示的考試；顯示卷面分／加權（高中 MC35%+LQ65%；初中卷面）。懶載入僅讀勾選卷。</p>
        </div>
        <div className="flex gap-2 items-center">
          {loading && <span className="text-xs text-slate-400">載入中…</span>}
          <button className="text-sm font-bold px-4 py-2 rounded-lg bg-emerald-600 text-white" onClick={exportExcel}>匯出 Excel (CSV)</button>
        </div>
      </div>
      <div className="flex flex-wrap gap-2">
        {available.map(id => (
          <label key={id} className={`text-sm font-bold flex items-center gap-1.5 border-2 rounded-lg px-3 py-1.5 cursor-pointer ${included[id]?"border-purple-400 bg-purple-50":"border-slate-200"}`}>
            <input type="checkbox" checked={!!included[id]} onChange={() => setIncluded(p => ({ ...p, [id]: !p[id] }))} />
            {id}
            <span className="text-xs font-normal text-slate-400">/{examMeta[id]?.totalMax}</span>
          </label>
        ))}
        {!available.length && <span className="text-slate-400 text-sm">此群組尚無考試藍圖</span>}
      </div>
      <div className="overflow-auto max-h-[70vh]">
        <table className="min-w-full text-sm">
          <thead className="sticky top-0 bg-slate-50">
            <tr>
              <th className="text-left px-2 py-2">班</th>
              <th className="text-left px-2 py-2">號</th>
              <th className="text-left px-2 py-2">姓名</th>
              {selectedIds.map(id => (
                <th key={id} className="text-center px-2 py-2 text-xs">
                  {id}
                  <div className="text-[10px] font-normal text-slate-400">卷面 / 加權</div>
                </th>
              ))}
              <th className="text-center px-2 py-2 text-xs">平均加權</th>
            </tr>
          </thead>
          <tbody>
            {rows.map(s => (
              <tr key={s.id} className="border-t">
                <td className="px-2 py-1">{s.class}</td>
                <td className="px-2 py-1">{s.num}</td>
                <td className="px-2 py-1 font-semibold">{s.name}</td>
                {selectedIds.map(id => {
                  const sc = s.examScores[id];
                  return (
                    <td key={id} className={`px-2 py-1 text-center font-bold ${cellCls(sc)}`}>
                      {sc == null ? "—" : (
                        <span>
                          {sc.total}/{sc.max}
                          <span className="block text-[10px] font-semibold text-purple-700">{sc.weighted.toFixed(1)}</span>
                        </span>
                      )}
                    </td>
                  );
                })}
                <td className={`px-2 py-1 text-center font-bold ${s.average != null && s.average < 40 ? "text-rose-600" : s.average != null && s.average < 60 ? "text-amber-600" : "text-slate-800"}`}>
                  {s.average == null ? "—" : s.average.toFixed(1)}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function ExamSettingsView({ students, examMaps, setExamMaps, currentCohort }) {
  const cohorts = useMemo(() => Array.from(new Set(students.map(s => s.cohort).filter(Boolean))).sort(), [students]);
  const [selectedCohort, setSelectedCohort] = useState(currentCohort && currentCohort !== "所有學生" ? currentCohort : (cohorts[0] || ""));
  const [examId, setExamId] = useState("");
  const [examTitle, setExamTitle] = useState("");
  const [pasteData, setPasteData] = useState("");
  const [editingOriginalId, setEditingOriginalId] = useState(null);
  const [assignCohort, setAssignCohort] = useState("");
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    if (currentCohort && currentCohort !== "所有學生") setSelectedCohort(currentCohort);
  }, [currentCohort]);

  const listIds = useMemo(() => Object.keys(examMaps || {}).sort(), [examMaps]);

  const parseLines = (text) => {
    return text.trim().split("\n").map(line => {
      const clean = line.trim(); if (!clean) return null;
      let cols = clean.split("\t").map(c => c.trim());
      // 支援 9 欄整表：考試編號 標題 題號 題型 滿分 難度 topicId 描述 答案
      if (cols.length >= 8 && cols[0] && cols[2] && (cols[1] || "").length > 0) {
        // 可能是整表列
        const maybeType = (cols[3] || "").toUpperCase();
        if (maybeType === "MC" || maybeType === "LQ") {
          return {
            examIdFromRow: cols[0],
            titleFromRow: cols[1],
            id: cols[2],
            type: maybeType,
            max: parseFloat(cols[4]) || 1,
            level: (cols[5] || "中").trim(),
            topicId: (cols[6] || "").trim(),
            topicDesc: (cols[7] || "").trim(),
            ans: (cols[8] || "").trim().toUpperCase()
          };
        }
      }
      if (cols.length < 6) {
        const multi = clean.split(/\s{2,}/).map(c => c.trim()).filter(Boolean);
        if (multi.length >= 6) cols = multi;
      }
      let maxScore = parseFloat(cols[2]); if (isNaN(maxScore) || maxScore <= 0) maxScore = 1;
      const type = (cols[1] || "MC").toUpperCase();
      return {
        id: (cols[0] || "").trim(),
        type,
        max: maxScore,
        level: (cols[3] || "中").trim(),
        topicId: (cols[4] || "").trim(),
        topicDesc: (cols[5] || "").trim(),
        ans: (cols[6] || "").trim().toUpperCase()
      };
    }).filter(q => q && q.id && !String(q.id).includes("題目") && !String(q.id).includes("編號") && !String(q.id).includes("考試"));
  };

  const loadEdit = (id) => {
    const m = examMaps[id];
    if (!m) return;
    setEditingOriginalId(id);
    setExamId(id);
    setExamTitle(m.title || "");
    setAssignCohort(m.cohort || "");
    let text = "";
    (m.questions || []).forEach(q => {
      text += `${q.id}\t${q.type}\t${q.max}\t${q.level || "中"}\t${q.topicId || ""}\t${q.topicDesc || ""}\t${q.ans || ""}\n`;
    });
    setPasteData(text);
  };

  const handleSave = async () => {
    if (!examId.trim() || !examTitle.trim()) return alert("請填寫考試編號與標題");
    const parsed = parseLines(pasteData);
    if (!parsed.length) return alert("無法解析題目");
    // 若貼上含考試編號的 9 欄，只取題目欄
    const questions = parsed.map(q => ({
      id: q.id,
      type: q.type,
      max: q.max,
      level: q.level,
      topicId: q.topicId,
      topicDesc: q.topicDesc,
      ans: q.ans || ""
    }));
    let cohortVal = assignCohort;
    if (cohortVal === "所有學生") cohortVal = "";
    setBusy(true);
    try {
      const newId = examId.trim();
      const oldId = editingOriginalId;
      const data = { title: examTitle.trim(), questions, cohort: cohortVal || "" };
      await saveExamMap(newId, data);
      const next = { ...examMaps, [newId]: { ...data, _id: newId } };
      if (oldId && oldId !== newId) {
        await deleteExamMap(oldId);
        delete next[oldId];
        // 遷移成績 exams 子集合
        const stuSnap = await db.collection("students").get();
        for (const d of stuSnap.docs) {
          const ref = db.collection("scores").doc(d.id).collection("exams").doc(oldId);
          const snap = await ref.get();
          if (snap.exists) {
            await db.collection("scores").doc(d.id).collection("exams").doc(newId).set(snap.data(), { merge: true });
            await ref.delete();
          }
        }
      }
      setExamMaps(next);
      setEditingOriginalId(newId);
      alert("已儲存考試藍圖" + (data.cohort ? `（群組：${data.cohort}）` : "（所有群組通用）"));
    } catch (e) { alert(e.message); }
    setBusy(false);
  };

  const handleDelete = async (id) => {
    if (!confirm(`確定刪除考試藍圖「${id}」？`)) return;
    setBusy(true);
    try {
      await deleteExamMap(id);
      const next = { ...examMaps };
      delete next[id];
      setExamMaps(next);
      if (editingOriginalId === id) {
        setEditingOriginalId(null); setExamId(""); setExamTitle(""); setPasteData(""); setAssignCohort("");
      }
    } catch (e) { alert(e.message); }
    setBusy(false);
  };

  const saveCohortOnly = async (id, cohort) => {
    const m = examMaps[id];
    if (!m) return;
    const c = cohort === "所有學生" ? "" : cohort;
    try {
      await saveExamMap(id, { ...m, cohort: c });
      setExamMaps(prev => ({ ...prev, [id]: { ...m, cohort: c } }));
    } catch (e) { alert(e.message); }
  };

  const buildExamCsvPrompt = () => {
    const syllabus = getSyllabusTableText();
    return `【身份】你是香港 DSE 化學科老師／出題助手。

【任務】我會上傳一份考試卷（PDF／Word／圖片）。請為每一小題產出 Tab 分隔列。

【課程大綱參考】（topicId 必須從下列課題編號選用）
${syllabus}

【輸出欄位】
考試編號 [Tab] 考試標題 [Tab] 題目ID [Tab] 題型 [Tab] 滿分 [Tab] 難度 [Tab] 課題編號 [Tab] 題目描述 [Tab] 正確答案

            <div className="text-sm text-slate-500 flex items-end pb-2">新建建議選「{selectedCohort || "—"}」</div>
          </div>
          <label className="text-sm font-bold text-slate-600 block">題目（Tab：題號 題型 滿分 難度 topicId 描述 [答案]）
            <textarea className="mt-1 w-full border-2 rounded-xl p-3 text-sm mono h-52" value={pasteData} onChange={e=>setPasteData(e.target.value)}
              placeholder={"MC1\tMC\t1\t中\t2.6.1\t計算功\tA\nLQ1a\tLQ\t2\t淺\t2.6.2\t計算勢能\t"} />
          </label>
          <div className="flex flex-wrap gap-2">

            </button>
            <button className="border-2 font-bold px-5 py-2.5 rounded-xl text-sm" onClick={() => {

        <p className="text-sm text-violet-800">上傳試卷後生成含 <b>topicId</b> 的 Tab 表格（已附課程大綱）。</p>
        <button className="bg-violet-600 hover:bg-violet-700 text-white font-black px-6 py-3 rounded-xl text-base"
          onClick={() => navigator.clipboard.writeText(buildExamCsvPrompt()).then(()=>alert("已複製")).catch(()=>alert("失敗"))}>

function PastpaperInputAnalysisView({ activeStudents, pastpaperMaps, pastpaperScores, setPastpaperScores }) {
  const paperIds = useMemo(() => Object.keys(pastpaperMaps || {}).sort().reverse(), [pastpaperMaps]);
  const [selectedPaper, setSelectedPaper] = useState(paperIds[0] || "");
  const [selectedStudentId, setSelectedStudentId] = useState("");
  const [saveStatus, setSaveStatus] = useState("idle");
  const [loading, setLoading] = useState(false);
  const [loadInfo, setLoadInfo] = useState("");
  const inputRefs = useRef({});
  const timer = useRef(null);

  const [heatSel, setHeatSel] = useState([]);
  const [aiMc, setAiMc] = useState(5);
  const [aiLq, setAiLq] = useState(2);
  const [aiLevel, setAiLevel] = useState("中");
  const [aiExtra, setAiExtra] = useState({ practice: true, ppt: false, notes: false, explainImg: false });

  useEffect(() => {
    if (paperIds.length && !paperIds.includes(selectedPaper)) setSelectedPaper(paperIds[0] || "");
  }, [paperIds]);

  useEffect(() => {
    if (!selectedPaper || !activeStudents.length) return;
    let cancelled = false;
    (async () => {
      setLoading(true);
      setLoadInfo("");
      try {
        const part = await loadPastpaperScoresForPaper(activeStudents.map(s => s.id), selectedPaper);
        if (cancelled) return;
        const meta = part.__meta || {};
        delete part.__meta;
        setPastpaperScores(prev => {
          const next = { ...prev };
          Object.keys(part).forEach(sid => {
            next[sid] = { ...(next[sid] || {}), ...(part[sid] || {}) };
          });
          if ((meta.errors || 0) === 0) {
            activeStudents.forEach(s => {
              if (!part[s.id] || !part[s.id][selectedPaper]) {
                if (next[s.id] && next[s.id][selectedPaper]) {
                  const copy = { ...next[s.id] };
                  delete copy[selectedPaper];
                  next[s.id] = copy;
                }
              }
            });
          }
          return next;
        });
        setLoadInfo(`讀取 ${meta.found || 0}/${meta.tried || 0} 人有此卷成績` + (meta.errors ? `（${meta.errors} 次失敗）` : ""));
      } catch (e) {
        setLoadInfo("讀取失敗：" + (e.message || String(e)));
      }
      if (!cancelled) setLoading(false);
    })();
    return () => { cancelled = true; };
  }, [selectedPaper, activeStudents.map(s => s.id).join(",")]);

  useEffect(() => { setHeatSel([]); }, [selectedPaper]);

  const map = pastpaperMaps[selectedPaper];
  const qList = map?.questions || [];

  const calcStudent = (sid) => {
    if (!map) return null;
    const rec = pastpaperScores[sid]?.[selectedPaper] || {};
    let mcScore = 0, mcMax = 0, lqScore = 0, lqMax = 0, any = false, totalMax = 0;
    qList.forEach(q => {
      const max = q.max || 1;
      totalMax += max;
      if (q.type === "MC") mcMax += max; else lqMax += max;
      const raw = rec[q.id];
      if (raw === undefined || raw === null || String(raw).trim() === "") return;
      any = true;
      if (q.type === "MC") {
        if (q.ans) {
          const corrects = q.ans.toString().split(",").map(a => a.trim().toUpperCase());
          if (corrects.includes(String(raw).trim().toUpperCase())) mcScore += max;
        }
      } else {
        const n = parseFloat(raw);
        lqScore += isNaN(n) ? 0 : n;
      }
    });
    if (!any) return null;
    const total = mcScore + lqScore;
    const pct = totalMax > 0 ? total / totalMax : 0;
    const grade = estimateDseLevel(pct);
    return { mcScore, mcMax, lqScore, lqMax, total, max: totalMax, pct, grade };
  };

  const focusNext = (fromQid) => {
    const idx = qList.findIndex(q => q.id === fromQid);
    if (idx < 0 || idx >= qList.length - 1) return;
    const nextId = qList[idx + 1].id;
    setTimeout(() => {
      const el = inputRefs.current[nextId] || document.querySelector('[data-pp-qid="'+nextId+'"]');
      if (el) { el.focus(); if (el.select) el.select(); }
    }, 40);
  };

  const scheduleSave = (sid, paperId, record) => {
    setSaveStatus("saving");
    if (timer.current) clearTimeout(timer.current);
    timer.current = setTimeout(async () => {
      try {
        await savePastpaperScore(sid, paperId, record);
        setSaveStatus("saved");
        setTimeout(() => setSaveStatus(s => s === "saved" ? "idle" : s), 1500);
      } catch (e) { setSaveStatus("idle"); alert(e.message); }
    }, 800);
  };

  const setQVal = (qid, raw, q) => {
    if (!selectedStudentId || !selectedPaper) return;
    let stored = raw;
    if (raw === "" || raw === null || raw === undefined) stored = "";
    else if (q.type === "MC") {
      let v = String(raw).toUpperCase().trim();
      if (v === "1") v = q.ans ? q.ans.split(",")[0].trim().toUpperCase() : "A";
      else if (v === "0") v = "X";
      else v = v.replace(/[^A-DX]/g, "").slice(0, 1);
      stored = v;
    } else {
      if (raw === "") stored = "";
      else {
        const n = parseFloat(raw);
        if (isNaN(n)) return;
        stored = Math.min(n, q.max || n);
      }
    }
    const month = new Date().toISOString().substring(0, 7);
    setPastpaperScores(prev => {
      const prevRec = { ...(prev[selectedStudentId]?.[selectedPaper] || {}) };
      const nextRec = { ...prevRec, [qid]: stored, _submitMonth: month };
      scheduleSave(selectedStudentId, selectedPaper, nextRec);
      return {
        ...prev,
        [selectedStudentId]: {
          ...(prev[selectedStudentId] || {}),
          [selectedPaper]: nextRec
        }
      };
    });
    if (stored !== "" && stored !== null) focusNext(qid);
  };

  // Analysis
  const qStats = useMemo(() => {
    if (!map) return [];
    return qList.map(q => {
      let earned = 0, attempts = 0;
      activeStudents.forEach(s => {
        const rec = pastpaperScores[s.id]?.[selectedPaper];
        if (!rec) return;
        const raw = rec[q.id];
        if (raw === undefined || raw === null || String(raw).trim() === "") return;
        attempts++;
        const sc = quizQuestionScore(q, raw);
        if (sc != null) earned += sc;
      });
      const passRate = attempts > 0 && q.max > 0 ? earned / (attempts * q.max) : null;
      let heat = "bg-slate-50 text-slate-400 border-slate-200";
      if (passRate != null) {
        if (passRate < 0.4) heat = "bg-red-500 text-white border-red-600";
        else if (passRate < 0.6) heat = "bg-orange-300 text-orange-900 border-orange-400";
        else if (passRate < 0.8) heat = "bg-emerald-300 text-emerald-900 border-emerald-400";
        else heat = "bg-emerald-500 text-white border-emerald-600";
      }
      return { ...q, attempts, passRate, pct: passRate == null ? null : passRate * 100, heat };
    });
  }, [map, qList, activeStudents, pastpaperScores, selectedPaper]);

  const macro = useMemo(() => {
    const bag = {};
    qStats.forEach(q => {
      const d = domainFromTopicId(q.topicId);
      if (!bag[d]) bag[d] = { domain: d, score: 0, max: 0, n: 0 };
      if (q.passRate == null) return;
      bag[d].score += q.passRate * (q.max || 1) * q.attempts;
      bag[d].max += (q.max || 1) * q.attempts;
      bag[d].n++;
    });
    return Object.values(bag).map(x => ({
      ...x,
      pct: x.max > 0 ? (x.score / x.max) * 100 : null
    })).sort((a, b) => (a.pct ?? 999) - (b.pct ?? 999));
  }, [qStats]);

  const micro = useMemo(() => {
    const bag = {};
    qStats.forEach(q => {
      const tid = q.topicId || "（無）";
      if (!bag[tid]) bag[tid] = { topicId: tid, score: 0, max: 0, descs: new Set(), qTips: [] };
      // 收集題目詳情（無論有無作答統計都可 hover 看）
      bag[tid].qTips.push({
        id: q.id,
        desc: q.topicDesc || q.desc || "",
        type: q.type,
        pct: q.pct,
        attempts: q.attempts
      });
      if (q.passRate == null) return;
      bag[tid].score += q.passRate * (q.max || 1) * q.attempts;
      bag[tid].max += (q.max || 1) * q.attempts;
      if (q.topicDesc) bag[tid].descs.add(q.topicDesc);
    });
    return Object.values(bag).map(x => ({
      ...x,
      pct: x.max > 0 ? (x.score / x.max) * 100 : null,
      descs: Array.from(x.descs),
      name: syllabusLabel(x.topicId),
      syDesc: syllabusDesc(x.topicId)
    })).sort((a, b) => (a.pct ?? 999) - (b.pct ?? 999));
  }, [qStats]);

  const ranking = useMemo(() => {
    return activeStudents.map(s => {
      const st = calcStudent(s.id);
      return st ? { s, ...st } : null;
    }).filter(Boolean).sort((a, b) => b.pct - a.pct);
  }, [activeStudents, pastpaperScores, selectedPaper, map]);

  const buildHeatPrompt = () => {
    const qs = qStats.filter(q => heatSel.includes(q.id));
    if (!qs.length) return "";
    const lines = qs.map(q => formatWeakItem(q, `全班得分率 ${q.pct == null ? "—" : Math.round(q.pct) + "%"}`)).join("\n");
    const topicIds = qs.map(q => q.topicId).filter(Boolean);
    const syllabus = getSyllabusTableText(topicIds);
    const tasks = [];
    if (aiExtra.practice) tasks.push(`A. 針對性練習：${aiMc} MC + ${aiLq} LQ，難度「${aiLevel}」。每題標明 topicId。`);
    if (aiExtra.explainImg) tasks.push(`B. 解說圖描述（每弱項）。`);
    if (aiExtra.ppt) tasks.push(`C. PPT 大綱 8–12 頁。`);
    if (aiExtra.notes) tasks.push(`D. 溫習筆記。`);
    if (!tasks.length) tasks.push(`A. 練習 ${aiMc} MC + ${aiLq} LQ。`);
    return `【身份】你是香港 DSE 化學科老師。

【任務】全班剛完成歷屆試題「${map?.title || selectedPaper}」。請針對下列盲點出教材／練習。

【錯題／弱項】（含 topicId 與描述）
${lines}

【課程大綱參考】
${syllabus}

【產出】
${tasks.map((x,i)=>`${i+1}. ${x}`).join("\n")}

【其他】繁體中文；對應 topicId；直接給內容。`;
  };

  if (!paperIds.length) {
    return <div className="p-8 text-slate-400">尚未有 Pastpaper 題庫。請到「Pastpaper 題庫設定」用 JSON 匯入。</div>;
  }
  if (!map) return <div className="p-8 text-slate-400">找不到試卷資料</div>;

  const rec = selectedStudentId ? (pastpaperScores[selectedStudentId]?.[selectedPaper] || {}) : {};
  const cur = selectedStudentId ? calcStudent(selectedStudentId) : null;

  return (
    <div className="space-y-4">
      {/* 輸入區 */}
      <div className="grid lg:grid-cols-5 gap-4">
        <div className="lg:col-span-2 bg-white rounded-2xl border p-4 space-y-3">
          <select className="w-full border rounded-lg px-2 py-2 text-sm font-bold" value={selectedPaper}
            onChange={e => { setSelectedPaper(e.target.value); setSelectedStudentId(""); }}>
            {paperIds.map(id => <option key={id} value={id}>{id} — {pastpaperMaps[id].title || id}</option>)}
          </select>
          {(() => {
            const enteredN = activeStudents.filter(s => calcStudent(s.id)).length;
            const totalN = activeStudents.length;
            return (
              <div className="flex flex-wrap items-center gap-2 text-xs">
                <span className="font-black px-2 py-1 rounded-lg bg-indigo-100 text-indigo-800 border border-indigo-200">
                  已入分 {enteredN} / {totalN} 人
                </span>
                <span className="text-slate-400">其餘可於學生端自行入分</span>
              </div>
            );
          })()}
          {loading && <div className="text-[11px] text-slate-400">載入成績中…</div>}
          {!!loadInfo && <div className="text-[11px] text-slate-500">{loadInfo}</div>}
          <div className="max-h-[58vh] overflow-auto space-y-1">
            {activeStudents.map(s => {
              const st = calcStudent(s.id);
              return (
                <button key={s.id} onClick={() => setSelectedStudentId(s.id)}
                  className={`w-full text-left px-3 py-2 rounded-xl border text-sm ${selectedStudentId===s.id?"border-indigo-400 bg-indigo-50 ring-1 ring-indigo-200":"border-slate-100 hover:bg-slate-50"}`}>
                  <div className="flex justify-between items-center gap-2">
                    <span className="font-semibold"><b>{s.class}-{s.num}</b> {s.name}</span>
                    {!st && <span className="text-[10px] text-slate-400">未入分</span>}
                    {st && (
                      <span className="flex items-center gap-1.5">
                        <span className="text-xs font-black text-slate-700">{st.total}/{st.max}</span>
                        <span className={`text-[10px] font-black px-1.5 py-0.5 rounded border ${st.grade.color}`}>{st.grade.level}</span>
                      </span>
                    )}
                  </div>
                  {st && (
                    <div className="mt-1 flex flex-wrap gap-1 text-[10px] font-bold">
                      {st.mcMax > 0 && <span className="px-1.5 py-0.5 rounded bg-indigo-50 text-indigo-700">MC {st.mcScore}/{st.mcMax}</span>}
                      {st.lqMax > 0 && <span className="px-1.5 py-0.5 rounded bg-fuchsia-50 text-fuchsia-700">LQ {st.lqScore}/{st.lqMax}</span>}
                      <span className="px-1.5 py-0.5 rounded bg-slate-50 text-slate-600">{Math.round(st.pct*100)}%</span>
                    </div>
                  )}
                </button>
              );
            })}
          </div>
        </div>
        <div className="lg:col-span-3 bg-white rounded-2xl border p-4">
          {!selectedStudentId ? (
            <p className="text-slate-400 p-8 text-center">選擇學生輸入歷屆試題成績（0 分有效；MC 可按 1=對／0=錯）</p>
          ) : (
            <div className="space-y-3">
              <div className="flex flex-wrap justify-between items-center gap-2">
                <div className="font-bold">{activeStudents.find(x=>x.id===selectedStudentId)?.name} · {selectedPaper}</div>
                <div className="flex items-center gap-2">
                  {cur && (
                    <>
                      <span className="text-sm font-bold">{cur.total}/{cur.max}</span>
                      <span className={`text-xs font-black px-2 py-1 rounded border ${cur.grade.color}`}>預測 {cur.grade.level}</span>
                    </>
                  )}
                  <span className="text-xs text-slate-400">{saveStatus==="saving"?"儲存中…":saveStatus==="saved"?"已存":""}</span>
                </div>
              </div>
              <p className="text-[11px] text-slate-500">等級為校內模擬（參考公開試表現分佈粗略門檻），非正式評級。</p>
              <div className="space-y-2 max-h-[55vh] overflow-auto">
                {qList.map(q => {
                  const raw = rec[q.id];
                  const has = raw !== undefined && raw !== null && String(raw).trim() !== "";
                  let scoreColor = "border-slate-200 bg-white";
                  if (has) {
                    if (q.type === "MC") {
                      const ok = q.ans && q.ans.toString().split(",").map(a=>a.trim().toUpperCase()).includes(String(raw).trim().toUpperCase());
                      scoreColor = ok ? "border-emerald-400 bg-emerald-50 text-emerald-800" : "border-rose-400 bg-rose-50 text-rose-700";
                    } else {
                      const n = parseFloat(raw);
                      if (!isNaN(n) && n <= 0) scoreColor = "border-rose-400 bg-rose-50 text-rose-700";
                      else if (!isNaN(n) && n >= (q.max||0)) scoreColor = "border-emerald-400 bg-emerald-50 text-emerald-800";
                      else scoreColor = "border-amber-400 bg-amber-50 text-amber-800";
                    }
                  }
                  return (
                    <div key={q.id} className="border rounded-xl p-2 flex gap-2 items-center">
                      <div className="w-28 shrink-0">
                        <div className="text-xs font-bold mono truncate" title={q.id}>{q.id.split("-").slice(-2).join("-")}</div>
                        <div className="text-[10px] text-slate-400">{q.type}</div>
                      </div>
                      <div className="flex-1 text-xs text-slate-600 truncate" title={q.topicDesc}>{q.topicId} {q.topicDesc}</div>
                      <div className="flex items-center gap-1">
                        {q.type === "MC" ? (
                          <input data-pp-qid={q.id} ref={el=>{if(el)inputRefs.current[q.id]=el;}}
                            className={`w-14 border-2 rounded px-1 py-1 text-center font-bold uppercase ${scoreColor}`}
                            maxLength={1} value={raw ?? ""}
                            onChange={e=>setQVal(q.id, e.target.value, q)}
                            onKeyDown={e=>{ if(e.key==="Enter"||e.key==="Tab"){ e.preventDefault(); focusNext(q.id);} }}
                          />
                        ) : (
                          <input data-pp-qid={q.id} ref={el=>{if(el)inputRefs.current[q.id]=el;}} type="number"
                            className={`w-16 border-2 rounded px-1 py-1 text-center font-bold ${scoreColor}`}
                            value={raw ?? ""}
                            onChange={e=>setQVal(q.id, e.target.value, q)}
                            onKeyDown={e=>{ if(e.key==="Enter"||e.key==="Tab"){ e.preventDefault(); focusNext(q.id);} }}
                          />
                        )}
                        {q.type !== "MC" && <span className="text-[11px] font-bold text-slate-400">/{q.max}</span>}
                        {q.type==="MC" && q.ans && <span className="text-[10px] text-slate-500 font-bold">{q.ans}</span>}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      </div>

      {/* Macro / Micro */}
      <div className="grid lg:grid-cols-5 gap-4">
        <div className="lg:col-span-2 bg-white rounded-2xl border p-4">
          <h3 className="font-bold text-sky-700 mb-2">該卷涵蓋大領域表現 (Macro)</h3>
          {!macro.length ? <p className="text-slate-400 text-sm">尚無數據</p> : (
            <div className="space-y-2">
              {macro.map(d => (
                <div key={d.domain} className="flex items-center gap-2 text-sm">
                  <span className="w-36 font-bold shrink-0 text-xs sm:text-sm">{d.domain}</span>
                  <div className="flex-1 h-3 rounded-full bg-slate-100 overflow-hidden">
                    <div className={`h-full ${d.pct!=null&&d.pct<40?"bg-rose-500":d.pct<60?"bg-amber-400":"bg-emerald-500"}`} style={{width: (d.pct||0)+"%"}} />
                  </div>
                  <span className="w-12 text-right font-bold text-xs">{d.pct==null?"—":Math.round(d.pct)+"%"}</span>
                </div>
              ))}
            </div>
          )}
        </div>
        <div className="lg:col-span-3 bg-white rounded-2xl border p-4 max-h-[32rem] overflow-auto">
          <h3 className="font-bold text-pink-700 text-base mb-1">各子課題表現剖析 (Micro)</h3>
          <p className="text-xs text-slate-500 mb-2">滑鼠移到課題上可看相關題目詳情；下方為大綱／題目描述。</p>
          {!micro.length ? <p className="text-slate-400 text-sm">尚無數據</p> : (
            <div className="space-y-3">
              {micro.slice(0, 30).map(row => {
                const tip = [
                  row.name ? `大綱：${row.name}` : "",
                  row.syDesc ? `要求：${row.syDesc}` : "",
                  (row.qTips || []).map(q => `${q.id} (${q.type}${q.pct!=null?" "+Math.round(q.pct)+"%":""}) ${q.desc || ""}`).join("\n")
                ].filter(Boolean).join("\n");
                return (
                  <div key={row.topicId} className="group relative border border-slate-100 rounded-xl p-2 hover:border-pink-200 hover:bg-pink-50/40 transition" title={tip}>
                    <div className="flex items-center gap-2 text-sm">
                      <span className="mono font-black text-pink-800 shrink-0">{row.topicId}</span>
                      <div className="flex-1 h-3 rounded-full bg-slate-100 overflow-hidden">
                        <div className={`h-full ${row.pct!=null&&row.pct<40?"bg-rose-500":row.pct<60?"bg-amber-400":"bg-emerald-500"}`} style={{width: (row.pct||0)+"%"}} />
                      </div>
                      <span className="w-12 text-right font-bold">{row.pct==null?"—":Math.round(row.pct)+"%"}</span>
                    </div>
                    <div className="mt-1 text-sm text-slate-800 font-semibold leading-snug">
                      {row.name || (row.descs && row.descs[0]) || "（大綱未載入／無描述）"}
                    </div>
                    {(row.syDesc || (row.descs && row.descs.length)) && (
                      <div className="text-xs text-slate-500 leading-snug mt-0.5">
                        {row.syDesc || row.descs.join("；")}
                      </div>
                    )}
                    {/* hover 詳細面板 */}
                    <div className="hidden group-hover:block absolute z-20 left-0 right-0 top-full mt-1 bg-white border border-pink-200 shadow-lg rounded-xl p-3 text-[11px] text-slate-700 max-h-48 overflow-auto">
                      <div className="font-bold text-pink-800 mb-1">{row.topicId} {row.name}</div>
                      {row.syDesc && <div className="mb-2 text-slate-600">{row.syDesc}</div>}
                      <div className="font-semibold text-slate-500 mb-1">相關題目</div>
                      <ul className="space-y-1">
                        {(row.qTips || []).map(q => (
                          <li key={q.id} className="border-t border-slate-100 pt-1">
                            <span className="mono font-bold">{q.id}</span>
                            <span className="text-slate-400 ml-1">{q.type}</span>
                            {q.pct != null && <span className="ml-1 font-bold text-pink-700">{Math.round(q.pct)}%</span>}
                            <div className="text-slate-600">{q.desc || "—"}</div>
                          </li>
                        ))}
                      </ul>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>

      {/* Heatmap + ranking */}
      <div className="grid lg:grid-cols-5 gap-4">
        <div className="lg:col-span-3 bg-white rounded-2xl border p-4 space-y-3">
          <h3 className="font-bold text-pink-700">全班錯題熱力分佈 (Error Heatmap)</h3>
          <p className="text-xs text-slate-500">點選弱項方塊多選 → 下方生成 Prompt（練習／PPT／筆記）。紅＝難、綠＝易。</p>
          <div className="flex flex-wrap gap-1.5">
            {qStats.map(q => {
              const on = heatSel.includes(q.id);
              return (
                <button key={q.id} type="button" onClick={() => setHeatSel(prev => prev.includes(q.id) ? prev.filter(x=>x!==q.id) : [...prev, q.id])}
                  className={`text-[10px] font-bold px-2 py-1.5 rounded-lg border ${q.heat} ${on?"ring-2 ring-offset-1 ring-pink-500":""}`}
                  title={`${q.id}\n${q.topicDesc||""}\n${q.pct==null?"—":Math.round(q.pct)+"%"}`}>
                  {q.id.split("-").pop()}
                  <span className="block opacity-80">{q.pct==null?"—":Math.round(q.pct)+"%"}</span>
                </button>
              );
            })}
          </div>
          <div className="rounded-xl border-2 border-pink-200 bg-pink-50 p-4 space-y-3">
            <div className="font-bold text-pink-900 text-sm">已選 {heatSel.length} 題 · AI Prompt</div>
            <div className="flex flex-wrap gap-2">
              <button className="text-xs font-bold px-2 py-1 bg-white border rounded" onClick={()=>setHeatSel(qStats.filter(q=>q.pct!=null&&q.pct<60).map(q=>q.id))}>全選弱項(&lt;60%)</button>
              <button className="text-xs font-bold px-2 py-1 bg-white border rounded" onClick={()=>setHeatSel([])}>清空</button>
            </div>
            <div className="grid grid-cols-3 gap-2">
              <label className="text-xs font-bold">難度
                <select className="mt-0.5 w-full border rounded px-1 py-1" value={aiLevel} onChange={e=>setAiLevel(e.target.value)}>
                  <option value="淺">淺</option><option value="中">中</option><option value="深">深</option>
                </select>
              </label>
              <label className="text-xs font-bold">MC
                <input type="number" className="mt-0.5 w-full border rounded px-1 py-1" value={aiMc} onChange={e=>setAiMc(parseInt(e.target.value)||0)} />
              </label>
              <label className="text-xs font-bold">LQ
                <input type="number" className="mt-0.5 w-full border rounded px-1 py-1" value={aiLq} onChange={e=>setAiLq(parseInt(e.target.value)||0)} />
              </label>
            </div>
            <div className="flex flex-wrap gap-2">
              {[["practice","練習"],["explainImg","解說圖"],["ppt","PPT"],["notes","筆記"]].map(([k,lab])=>(
                <label key={k} className={`text-xs font-bold px-2 py-1 rounded border cursor-pointer ${aiExtra[k]?"border-pink-500 bg-white":"border-slate-200"}`}>
                  <input type="checkbox" className="mr-1" checked={!!aiExtra[k]} onChange={e=>setAiExtra(x=>({...x,[k]:e.target.checked}))} />{lab}
                </label>
              ))}
            </div>
            <button disabled={!heatSel.length} className="bg-pink-600 disabled:opacity-40 text-white font-bold text-sm px-4 py-2 rounded-lg"
              onClick={() => navigator.clipboard.writeText(buildHeatPrompt()).then(()=>alert("已複製")).catch(()=>alert("失敗"))}>
              複製錯題 Prompt（含描述 + Topic ID）
            </button>
          </div>
        </div>
        <div className="lg:col-span-2 bg-white rounded-2xl border p-4">
          <h3 className="font-bold text-indigo-700 mb-2">該卷排行 · 模擬等級</h3>
          <div className="max-h-96 overflow-auto space-y-1">
            {ranking.map((r, i) => (
              <div key={r.s.id} className="flex items-center gap-2 text-sm border-b py-1.5">
                <span className="w-6 text-slate-400 font-bold text-xs">{i+1}</span>
                <span className="flex-1 font-semibold truncate">{r.s.class}-{r.s.num} {r.s.name}</span>
                <span className="font-bold text-xs">{r.total}/{r.max}</span>
                <span className={`text-[10px] font-black px-1.5 py-0.5 rounded border ${r.grade.color}`}>{r.grade.level}</span>
              </div>
            ))}
            {!ranking.length && <p className="text-slate-400 text-sm">尚無入分</p>}
          </div>
          <p className="text-[10px] text-slate-400 mt-2">等級門檻為校內模擬參考（約：5**≥85%、5≥67%、4≥55%、3≥40%、2≥30%），非正式公開試評級。</p>
        </div>
      </div>
    </div>
  );
}


function PastpaperPersonalAnalysisView({ activeStudents, pastpaperMaps }) {
  const [selectedStudentId, setSelectedStudentId] = useState("");
  const [scores, setScores] = useState({}); // paperId -> record
  const [loading, setLoading] = useState(false);
  const [selectedPapers, setSelectedPapers] = useState([]);
  const [selectedTopics, setSelectedTopics] = useState([]);
  const [aiLang, setAiLang] = useState("繁體中文");
  const [aiMcCount, setAiMcCount] = useState(8);
  const [aiLqCount, setAiLqCount] = useState(2);
  const [aiExtra, setAiExtra] = useState({ practice: true, notes: false, ppt: false, explainImg: false });
  const chartRef = useRef(null);
  const chartInstance = useRef(null);

  useEffect(() => {
    if (!selectedStudentId) { setScores({}); setSelectedPapers([]); return; }
    let cancelled = false;
    (async () => {
      setLoading(true);
      try {
        const data = await loadAllPastpaperScoresForStudent(selectedStudentId);
        if (cancelled) return;
        setScores(data);
        const taken = Object.keys(data).filter(pid => {
          const rec = data[pid] || {};
          return Object.keys(rec).some(k => k !== "updatedAt" && k !== "_submitMonth" && k !== "_id" && k !== "value" && rec[k] !== "" && rec[k] != null);
        }).sort();
        setSelectedPapers(taken);
        setSelectedTopics([]);
      } catch (e) { console.warn(e); }
      if (!cancelled) setLoading(false);
    })();
    return () => { cancelled = true; };
  }, [selectedStudentId]);

  const allPapersTaken = useMemo(() => {
    return Object.keys(scores).filter(pid => {
      const rec = scores[pid] || {};
      return Object.keys(rec).some(k => k !== "updatedAt" && k !== "_submitMonth" && k !== "_id" && k !== "value" && rec[k] !== "" && rec[k] != null);
    }).sort();
  }, [scores]);

  const hasAnsweredQ = (paperId, qId) => {
    const val = scores?.[paperId]?.[qId];
    return val !== undefined && val !== null && val !== "";
  };

  const getStudentQScore = (paperId, q) => {
    const val = scores?.[paperId]?.[q.id];
    if (val === undefined || val === null || val === "") return 0;
    if (q.type === "MC") {
      if (!q.ans) return 0;
      const corrects = q.ans.toString().split(",").map(a => a.trim().toUpperCase());
      const ans = String(val).toUpperCase().trim().replace(/[^A-D]/g, "");
      return corrects.includes(ans) ? (q.max || 1) : 0;
    }
    const n = parseFloat(val);
    return isNaN(n) ? 0 : n;
  };

  const studentAnalysis = useMemo(() => {
    if (!selectedStudentId || !selectedPapers.length) {
      return { topics: [], domainStats: {} };
    }
    const topicStats = {};
    const domainStats = {
      "1": { name: "地球與化學", max: 0, earned: 0 },
      "2": { name: "微觀世界 I", max: 0, earned: 0 },
      "3": { name: "金屬", max: 0, earned: 0 },
      "4": { name: "酸與鹼", max: 0, earned: 0 },
      "5": { name: "化石燃料", max: 0, earned: 0 },
      "6": { name: "微觀世界 II", max: 0, earned: 0 },
      "7": { name: "氧化還原", max: 0, earned: 0 },
      "8": { name: "能量", max: 0, earned: 0 },
      "9": { name: "反應速率", max: 0, earned: 0 },
      "10": { name: "化學平衡", max: 0, earned: 0 },
      "11": { name: "碳化合物", max: 0, earned: 0 },
      "12": { name: "化學規律", max: 0, earned: 0 },
      "13": { name: "工業化學", max: 0, earned: 0 },
      "14": { name: "材料化學", max: 0, earned: 0 },
      "15": { name: "分析化學", max: 0, earned: 0 }
    };

    selectedPapers.forEach(paperId => {
      const map = pastpaperMaps[paperId];
      if (!map || !map.questions) return;
      map.questions.forEach(q => {
        if (!hasAnsweredQ(paperId, q.id)) return;
        const score = getStudentQScore(paperId, q);
        const tid = q.topicId || "（無）";
        if (!topicStats[tid]) {
          const info = SYLLABUS_TOPICS?.[tid];
          topicStats[tid] = {
            topicId: tid,
            topicName: (info && typeof info === "object") ? (info.topic || info.name || "未定義") : (info || "未定義"),
            syllabusDesc: (info && typeof info === "object") ? (info.desc || "") : "",
            totalMax: 0, totalEarned: 0, yearlyStats: {}, errorDescList: new Set()
          };
        }
        if (!topicStats[tid].yearlyStats[paperId]) topicStats[tid].yearlyStats[paperId] = { max: 0, earned: 0 };
        topicStats[tid].totalMax += q.max || 1;
        topicStats[tid].totalEarned += score;
        topicStats[tid].yearlyStats[paperId].max += q.max || 1;
        topicStats[tid].yearlyStats[paperId].earned += score;
        if (score < (q.max || 1) && q.topicDesc) {
          topicStats[tid].errorDescList.add(typeof q.topicDesc === "object" ? (q.topicDesc.topic || q.topicDesc.desc || "") : q.topicDesc);
        }
        let domainKey = "";
        if (String(tid).startsWith("E3")) domainKey = "E3";
        else if (String(tid).startsWith("E4")) domainKey = "E4";
        else domainKey = String(tid).charAt(0);
        if (domainStats[domainKey]) {
          domainStats[domainKey].max += q.max || 1;
          domainStats[domainKey].earned += score;
        }
      });
    });

    const topics = Object.values(topicStats)
      .map(t => ({
        ...t,
        overallPct: t.totalMax > 0 ? t.totalEarned / t.totalMax : 0,
        errorDescArray: Array.from(t.errorDescList)
      }))
      .filter(t => t.totalMax > 0 && t.overallPct <= 0.6)
      .sort((a, b) => a.overallPct - b.overallPct);

    return { topics, domainStats };
  }, [selectedStudentId, selectedPapers, scores, pastpaperMaps]);

  // 所選卷目綜合得分率 → 模擬等級
  const gradeEstimate = useMemo(() => {
    if (!selectedStudentId || !selectedPapers.length) return null;
    let earned = 0, max = 0, papers = 0;
    selectedPapers.forEach(paperId => {
      const map = pastpaperMaps[paperId];
      if (!map || !map.questions) return;
      let paperAny = false;
      map.questions.forEach(q => {
        if (!hasAnsweredQ(paperId, q.id)) return;
        paperAny = true;
        max += q.max || 1;
        earned += getStudentQScore(paperId, q);
      });
      if (paperAny) papers++;
    });
    if (max <= 0) return null;
    const pct = earned / max;
    const grade = estimateDseLevel(pct);
    return { earned, max, pct, grade, papers };
  }, [selectedStudentId, selectedPapers, scores, pastpaperMaps]);

  // Radar chart
  useEffect(() => {
    if (!selectedStudentId || !selectedPapers.length || !chartRef.current) return;
    const ds = studentAnalysis.domainStats || {};
    const labels = [];
    const dataPoints = [];
    Object.keys(ds).forEach(key => {
      if (ds[key].max > 0) {
        labels.push(ds[key].name);
        dataPoints.push(Math.round((ds[key].earned / ds[key].max) * 100));
      }
    });
    if (typeof Chart === "undefined") return;
    if (chartInstance.current) chartInstance.current.destroy();
    if (!labels.length) return;
    chartInstance.current = new Chart(chartRef.current.getContext("2d"), {
      type: "radar",
      data: {
        labels,
        datasets: [{
          label: "綜合掌握度 (%)",
          data: dataPoints,
          backgroundColor: "rgba(79, 70, 229, 0.2)",
          borderColor: "rgba(79, 70, 229, 0.8)",
          pointBackgroundColor: "rgba(79, 70, 229, 1)",
          borderWidth: 2
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          r: {
            min: 0, max: 100,
            ticks: { stepSize: 20, display: false },
            pointLabels: { font: { size: 10, weight: "bold" }, color: "#475569" }
          }
        },
        plugins: { legend: { display: false } }
      }
    });
    return () => { if (chartInstance.current) chartInstance.current.destroy(); };
  }, [studentAnalysis, selectedStudentId, selectedPapers]);

  const studentName = activeStudents.find(s => s.id === selectedStudentId)?.name || "該學生";

  const generatedPrompt = useMemo(() => {
    if (!selectedStudentId || !selectedTopics.length || !studentAnalysis.topics.length) {
      return "👈 請先從下方勾選至少一個弱點課題。";
    }
    const targetTopics = studentAnalysis.topics.filter(t => selectedTopics.includes(t.topicId));
    const weakTopicsText = targetTopics.map(t =>
      `- 課題 [${t.topicId} ${t.topicName}]:\n  已選卷平均得分率: ${(t.overallPct * 100).toFixed(0)}%\n  官方學習要求: ${t.syllabusDesc || "—"}\n  具體錯因: ${t.errorDescArray.join("; ") || "綜合概念薄弱"}`
    ).join("\n\n");
    const syllabus = getSyllabusTableText(targetTopics.map(t => t.topicId));
    return `【身份】你是香港 DSE 化學科權威專家。

【任務】學生【${studentName}】在近幾年 Pastpaper 操練中，下列課題得分率 ≤60%。請針對錯因度身訂造強效補底卷。

【基本設定】
- 語言: ${aiLang}
- MC：${aiMcCount} 題；LQ：${aiLqCount} 題

【學生重災區課題與具體錯因】
${weakTopicsText}

【課程大綱參考】
${syllabus}

【生成要求】
1. 針對「具體錯因」設計針對性題目，釐清最常混淆觀念。
2. MC 附 4 選項與【陷阱破解分析】；LQ 附【DSE 評分標準】與【解題思路】。
3. 開頭給【${studentName}】一段簡短有力鼓勵。
4. 每題標明 topicId。
${aiExtra.practice ? "" : "5. （可不生成練習題，改以下列產出為主）"}
${aiExtra.notes ? "\n【另請產出】溫習筆記：條列重點、公式、常見陷阱。" : ""}
${aiExtra.ppt ? "\n【另請產出】PPT 大綱 8–12 頁（每頁標題+要點）。" : ""}
${aiExtra.explainImg ? "\n【另請產出】解說圖描述：可用於 AI 繪圖的場景說明（每弱項 1 段）。" : ""}`;
  }, [aiLang, aiMcCount, aiLqCount, selectedTopics, selectedStudentId, studentAnalysis, studentName, aiExtra]);

  const togglePaper = (pid) => setSelectedPapers(prev => prev.includes(pid) ? prev.filter(p => p !== pid) : [...prev, pid]);
  const toggleAllPapers = () => {
    if (selectedPapers.length === allPapersTaken.length) setSelectedPapers([]);
    else setSelectedPapers([...allPapersTaken]);
  };

  return (
    <div className="space-y-4">
      <div className="flex flex-wrap justify-between items-center gap-3">
        <div>
          <h2 className="font-bold text-xl text-indigo-800">個人 Pastpaper 分析</h2>
          <p className="text-sm text-slate-500">跨年弱點追蹤與補底（可篩選年份／卷目）</p>
        </div>
        <select className="border-2 rounded-lg px-3 py-2 text-sm font-bold min-w-[200px]" value={selectedStudentId}
          onChange={e => setSelectedStudentId(e.target.value)}>
          <option value="">-- 請選擇分析對象 --</option>
          {activeStudents.map(s => <option key={s.id} value={s.id}>{s.class}({s.num}) {s.name}</option>)}
        </select>
      </div>

      {!selectedStudentId && (
        <div className="bg-white border border-dashed rounded-2xl p-16 text-center text-slate-400">請選擇一位學生，展開歷年 DSE 化學數據圖譜</div>
      )}
      {selectedStudentId && loading && <div className="text-sm text-slate-400">載入該生全部 Pastpaper 成績…</div>}
      {selectedStudentId && !loading && allPapersTaken.length === 0 && (
        <div className="bg-white border border-dashed rounded-2xl p-16 text-center text-slate-400">該學生目前尚未有任何 Pastpaper 成績紀錄</div>
      )}

      {selectedStudentId && !loading && allPapersTaken.length > 0 && (
        <div className="space-y-4">
          <div className="grid lg:grid-cols-3 gap-4">
            <div className="lg:col-span-2 bg-white rounded-2xl border p-4">
              <div className="flex justify-between items-center mb-3">
                <h3 className="font-bold text-sm text-slate-800">分析範圍篩選 (年份/卷目)</h3>
                <button className="text-xs text-indigo-600 font-bold underline" onClick={toggleAllPapers}>
                  {selectedPapers.length === allPapersTaken.length ? "取消全選" : "全選所有試卷"}
                </button>
              </div>
              <div className="flex flex-wrap gap-2 max-h-40 overflow-auto">
                {allPapersTaken.map(pid => {
                  const on = selectedPapers.includes(pid);
                  return (
                    <button key={pid} type="button" onClick={() => togglePaper(pid)}
                      className={`px-3 py-1.5 rounded-lg text-xs font-bold border ${on ? "bg-indigo-50 border-indigo-300 text-indigo-700" : "bg-white border-slate-200 text-slate-400"}`}>
