function QuizStudentAnalysisView({ activeStudents, quizMaps, currentCohort }) {
  const [sid, setSid] = useState(activeStudents[0]?.id || "");
  const [scores, setScores] = useState({});
  const [loading, setLoading] = useState(false);
  const chartRef = useRef(null);
  const chartInst = useRef(null);
  const [aiMc, setAiMc] = useState(10);
  const [aiLq, setAiLq] = useState(2);
  const [aiLevel, setAiLevel] = useState("中");
  const [aiExtra, setAiExtra] = useState({ practice: true, explainImg: false, ppt: false, notes: false });
  const [selectedQuizzes, setSelectedQuizzes] = useState([]);
  const [taughtSet, setTaughtSet] = useState(new Set()); // 全班已有人作答的小測

  const cohortQuizIds = useMemo(
    () => Object.keys(quizMaps || {}).filter(id => quizVisibleForCohort(quizMaps[id], currentCohort)).sort(),
    [quizMaps, currentCohort]
  );

  useEffect(() => {
    if (activeStudents.length && !activeStudents.find(s => s.id === sid)) setSid(activeStudents[0].id);
  }, [activeStudents]);

  // 掃描本群組：哪些小測「至少一人有真正作答」
  useEffect(() => {
    let cancelled = false;
    (async () => {
      if (!activeStudents.length || !cohortQuizIds.length) {
        if (!cancelled) setTaughtSet(new Set());
        return;
      }
      setLoading(true);
      try {
        const has = await findQuizzesWithClassScores(activeStudents.map(s => s.id), cohortQuizIds, quizMaps);
        if (!cancelled) setTaughtSet(has);
      } catch (e) { console.warn(e); if (!cancelled) setTaughtSet(new Set()); }
      if (!cancelled) setLoading(false);
    })();
    return () => { cancelled = true; };
  }, [cohortQuizIds.join("|"), activeStudents.map(s => s.id).join(","), currentCohort]);

  useEffect(() => {
    if (!sid) return;
    let cancelled = false;
    (async () => {
      const data = await loadAllQuizScoresForStudent(sid);
      if (!cancelled) setScores(data || {});
    })();
    return () => { cancelled = true; };
  }, [sid]);

  // 個人分析：只顯示「此生有真正作答」的小測（未測／未教不進圖表、一覽、Prompt）
  // 全班已教列表 taughtSet 另用於提示
  const visibleQuizzes = useMemo(() => {
    return cohortQuizIds.filter(id => quizRecordHasScore(scores[id], quizMaps[id]));
  }, [cohortQuizIds, scores, quizMaps]);

  // 預設勾選全部有分卷
  useEffect(() => {
    setSelectedQuizzes(visibleQuizzes.slice());
  }, [visibleQuizzes.join("|"), sid]);

  const rows = useMemo(() => {
    return visibleQuizzes.map(qid => {
      const map = quizMaps[qid];
      const rec = scores[qid];
      if (!map) return null;
      let total = 0, max = 0, any = false;
      (map.questions || []).forEach(q => {
        max += (q.max || 0);
        if (!rec) return;
        const raw = rec[q.id];
        if (raw === undefined || raw === null || String(raw).trim() === "") return;
        any = true;
        const sc = quizQuestionScore(q, raw);
        if (sc != null) total += sc;
      });
      const pct = any && max > 0 ? (total / max) * 100 : null;
      return { qid, title: map.title || qid, total: any ? total : null, max, pct };
    }).filter(Boolean);
  }, [visibleQuizzes, quizMaps, scores]);

  // 課題熱力：依 topicId 彙總（所選小測）
  const topicStats = useMemo(() => {
    const bag = {};
    const qids = selectedQuizzes.length ? selectedQuizzes : visibleQuizzes;
    qids.forEach(qid => {
      const map = quizMaps[qid];
      const rec = scores[qid];
      if (!map || !rec) return;
      (map.questions || []).forEach(q => {
        const tid = q.topicId || "（無 topicId）";
        if (!bag[tid]) bag[tid] = { topicId: tid, score: 0, max: 0, attempts: 0, descs: new Set() };
        const raw = rec[q.id];
        if (raw === undefined || raw === null || String(raw).trim() === "") return;
        const sc = quizQuestionScore(q, raw);
        if (sc == null) return;
        bag[tid].score += sc;
        bag[tid].max += (q.max || 1);
        bag[tid].attempts += 1;
        if (q.topicDesc || q.desc) bag[tid].descs.add(q.topicDesc || q.desc);
      });
    });
    return Object.values(bag).map(t => ({
      ...t,
      pct: t.max > 0 ? (t.score / t.max) * 100 : null,
      descs: Array.from(t.descs)
    })).sort((a, b) => (a.pct ?? 999) - (b.pct ?? 999));
  }, [selectedQuizzes, visibleQuizzes, quizMaps, scores]);

  const weakItems = useMemo(() => {
    const items = [];
    const qids = selectedQuizzes.length ? selectedQuizzes : visibleQuizzes;
    qids.forEach(qid => {
      const map = quizMaps[qid];
      const rec = scores[qid];
      if (!map || !rec) return;
      (map.questions || []).forEach(q => {
        const raw = rec[q.id];
        if (raw === undefined || raw === null || String(raw).trim() === "") return;
        const sc = quizQuestionScore(q, raw);
        const max = q.max || 1;
        if (sc != null && sc < max * 0.5) items.push({ ...q, quizId: qid, score: sc, max });
      });
    });
    return items;
  }, [selectedQuizzes, visibleQuizzes, quizMaps, scores]);

  // 圖表：各小測得分率（每柱顯示該卷自己的 %，不再畫總體平均線）
  useEffect(() => {
    if (!chartRef.current || typeof Chart === "undefined") return;
    if (chartInst.current) { try { chartInst.current.destroy(); } catch(e) {} chartInst.current = null; }
    const labels = rows.map(r => r.qid);
    const dataPct = rows.map(r => r.pct == null ? 0 : Math.round(r.pct * 10) / 10);
    const dataScore = rows.map(r => r.total == null ? 0 : r.total);
    const dataMax = rows.map(r => r.max || 0);
    chartInst.current = new Chart(chartRef.current, {
      type: "bar",
      data: {
        labels,
        datasets: [
          {
            label: "該卷得分率 %",
            data: dataPct,
            yAxisID: "y",
            backgroundColor: rows.map(r => r.pct == null ? "#e2e8f0" : r.pct < 40 ? "#f87171" : r.pct < 60 ? "#fbbf24" : "#34d399"),
            borderRadius: 6,
            order: 2,
          },
          {
            label: "得分",
            data: dataScore,
            type: "line",
            yAxisID: "y1",
            borderColor: "#6366f1",
            backgroundColor: "#6366f1",
            tension: 0.2,
            order: 1,
          },
          {
            label: "滿分",
            data: dataMax,
            type: "line",
            yAxisID: "y1",
            borderColor: "#94a3b8",
            borderDash: [4, 4],
            pointRadius: 0,
            order: 0,
          },
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: "top" },
          tooltip: {
            callbacks: {
              afterBody: (items) => {
                const i = items[0]?.dataIndex;
                if (i == null || !rows[i]) return "";
                const r = rows[i];
                return r.total == null ? "未作答" : `分數 ${r.total}/${r.max}`;
              }
            }
          }
        },
        scales: {
          y: { min: 0, max: 100, position: "left", title: { display: true, text: "得分率 %" } },
          y1: { min: 0, position: "right", grid: { drawOnChartArea: false }, title: { display: true, text: "分數" } }
        }
      }
    });
    return () => { if (chartInst.current) { try { chartInst.current.destroy(); } catch(e) {} } };
  }, [rows]);

  const student = activeStudents.find(s => s.id === sid);

  const heatColor = (pct) => {
    if (pct == null) return "bg-slate-100 text-slate-400";

      <div className="grid lg:grid-cols-5 gap-4">

function QuizSummaryView({ activeStudents, quizMaps, currentCohort }) {
  const cohortQuizIds = useMemo(
    () => Object.keys(quizMaps || {}).filter(id => quizVisibleForCohort(quizMaps[id], currentCohort)).sort(),
    [quizMaps, currentCohort]
  );
  const [taughtList, setTaughtList] = useState([]); // 有人作答的小測 id 列表
  const [included, setIncluded] = useState({});
  const [scores, setScores] = useState({}); // sid -> { quizId -> record }
  const [loading, setLoading] = useState(false);
  const [scanDone, setScanDone] = useState(false);

  // 先掃描本群組哪些小測有人作答 → 只這些出現在 checkbox
  useEffect(() => {
    let cancelled = false;
    (async () => {
      setScanDone(false);
      if (!activeStudents.length || !cohortQuizIds.length) {
        if (!cancelled) { setTaughtList([]); setScanDone(true); }
        return;
      }
      setLoading(true);
      try {
        const has = await findQuizzesWithClassScores(activeStudents.map(s => s.id), cohortQuizIds, quizMaps);
        const list = cohortQuizIds.filter(id => has.has(String(id)));
        if (!cancelled) {
          setTaughtList(list);
          setIncluded(prev => {
            const next = {};
            list.forEach(id => { next[id] = prev[id] !== undefined ? prev[id] : true; });
            return next;
          });
        }
      } catch (e) {
        console.warn(e);
        if (!cancelled) setTaughtList([]);
      }
      if (!cancelled) { setLoading(false); setScanDone(true); }
    })();
    return () => { cancelled = true; };
  }, [cohortQuizIds.join("|"), activeStudents.map(s => s.id).join(","), currentCohort]);

  const available = taughtList;
  const selectedIds = useMemo(() => available.filter(id => included[id]), [available, included]);

  // 懶載入：只拉有勾選的小測
  useEffect(() => {
    if (!activeStudents.length || !selectedIds.length) {
      setScores({});
      return;
    }
    let cancelled = false;
    (async () => {
      setLoading(true);
      try {
        const merged = {};
        activeStudents.forEach(s => { merged[s.id] = {}; });
        for (const qid of selectedIds) {
          const part = await loadQuizScoresForQuiz(activeStudents.map(s => s.id), qid);
          Object.keys(part).forEach(sid => {
            if (!merged[sid]) merged[sid] = {};
            Object.assign(merged[sid], part[sid]);
          });
        }
        if (!cancelled) setScores(merged);
      } catch (e) { console.warn(e); }
      if (!cancelled) setLoading(false);
    })();
    return () => { cancelled = true; };
  }, [selectedIds.join("|"), activeStudents.map(s => s.id).join(",")]);

  const quizMax = useMemo(() => {
    const m = {};
    available.forEach(id => {
      m[id] = (quizMaps[id]?.questions || []).reduce((a, q) => a + (q.max || 0), 0);
    });
    return m;
  }, [available, quizMaps]);

  const scoreOf = (sid, qid) => {
    const rec = scores[sid]?.[qid];
    const map = quizMaps[qid];
    if (!rec || !map) return null;
    let any = false, total = 0;
    (map.questions || []).forEach(q => {
      const raw = rec[q.id];
      if (raw === undefined || raw === null || String(raw).trim() === "") return;
      any = true;
      const sc = quizQuestionScore(q, raw);
      if (sc != null) total += sc;
    });
    return any ? total : null;
  };

  const rows = useMemo(() => {
    return activeStudents.map(s => {
      const qs = {};
      let sumPct = 0, n = 0;
      selectedIds.forEach(qid => {
        const sc = scoreOf(s.id, qid);
        qs[qid] = sc;
        if (sc != null && quizMax[qid] > 0) {
          sumPct += (sc / quizMax[qid]) * 100;
          n++;
        }
      });
      return {
        ...s,
        quizScores: qs,
        average: n > 0 ? (sumPct / n) : null
      };
    });
  }, [activeStudents, selectedIds, scores, quizMax, quizMaps]);

  const exportExcel = () => {
    const header = ["班別", "號", "姓名", "學生ID", ...selectedIds.map(id => id + "分數"), ...selectedIds.map(id => id + "得分率"), "平均得分率"];
    const maxRow = ["", "", "滿分", "", ...selectedIds.map(id => quizMax[id] || 0), ...selectedIds.map(() => "100"), "100"];
    const body = rows.map(s => {
      const scoresCols = selectedIds.map(id => s.quizScores[id] == null ? "" : s.quizScores[id]);
      const pctCols = selectedIds.map(id => {
        const sc = s.quizScores[id];
        if (sc == null || !quizMax[id]) return "";
        return ((sc / quizMax[id]) * 100).toFixed(1);
      });
      return [s.class, s.num, s.name, s.id, ...scoresCols, ...pctCols, s.average == null ? "" : s.average.toFixed(1)];
    });
    const csv = [header, maxRow, ...body].map(r => r.map(c => {
      const x = String(c ?? "");
      return /[",\n]/.test(x) ? `"${x.replace(/"/g, '""')}"` : x;
    }).join(",")).join("\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "quiz_summary.csv";
    a.click();
  };

  const cellCls = (sc, max) => {
    if (sc == null || !max) return "";
    const pct = (sc / max) * 100;
    if (pct < 40) return "bg-rose-50 text-rose-700";
    if (pct < 60) return "bg-amber-50 text-amber-800";
    return "";
  };

  return (
    <div className="bg-white rounded-2xl border p-4 space-y-3">
      <div className="flex flex-wrap items-center justify-between gap-2">
        <div>
          <h2 className="font-bold text-lg">小測分數表</h2>
          <p className="text-xs text-slate-500">勾選要顯示／計入平均的小測；黃底 40–60%、紅底 &lt;40%。懶載入僅讀勾選卷。</p>
        </div>
        <div className="flex gap-2 items-center">
          {loading && <span className="text-xs text-slate-400">載入成績中…</span>}
          <button className="text-sm font-bold px-4 py-2 rounded-lg bg-emerald-600 text-white" onClick={exportExcel}>匯出 Excel (CSV)</button>
        </div>
      </div>
      <div className="flex flex-wrap gap-2">
        {available.map(id => (
          <label key={id} className={`text-sm font-bold flex items-center gap-1.5 border-2 rounded-lg px-3 py-1.5 cursor-pointer ${included[id]?"border-indigo-400 bg-indigo-50":"border-slate-200"}`}>
            <input type="checkbox" checked={!!included[id]} onChange={() => setIncluded(p => ({ ...p, [id]: !p[id] }))} />
            {id}
            <span className="text-xs font-normal text-slate-400">/{quizMax[id]}</span>
          </label>
        ))}
        {scanDone && !available.length && !loading && (
          <span className="text-slate-400 text-sm">此群組尚無「已有人作答」的小測（未教的不會顯示）</span>
        )}
        {!scanDone && <span className="text-slate-400 text-sm">正在檢查哪些小測已有成績…</span>}
      </div>
      <div className="overflow-auto max-h-[70vh]">
        <table className="min-w-full text-sm">
          <thead className="sticky top-0 bg-slate-50">
            <tr>
              <th className="text-left px-2 py-2">班</th>
              <th className="text-left px-2 py-2">號</th>
              <th className="text-left px-2 py-2">姓名</th>
              {selectedIds.map(id => (
                <th key={id} className="text-center px-2 py-2 text-xs">
                  {id}
                  <div className="text-[10px] font-normal text-slate-400">/{quizMax[id]}</div>
                </th>
              ))}
              <th className="text-center px-2 py-2 text-xs">平均%</th>
            </tr>
          </thead>
          <tbody>
            {rows.map(s => (
              <tr key={s.id} className="border-t">
                <td className="px-2 py-1">{s.class}</td>
                <td className="px-2 py-1">{s.num}</td>
                <td className="px-2 py-1 font-semibold">{s.name}</td>
                {selectedIds.map(id => {
                  const sc = s.quizScores[id];
                  return (
                    <td key={id} className={`px-2 py-1 text-center font-bold ${cellCls(sc, quizMax[id])}`}>
                      {sc == null ? "—" : sc}
                    </td>
                  );
                })}
                <td className={`px-2 py-1 text-center font-bold ${s.average != null && s.average < 40 ? "text-rose-600" : s.average != null && s.average < 60 ? "text-amber-600" : "text-slate-800"}`}>
                  {s.average == null ? "—" : s.average.toFixed(1)}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}




function classifyProgress(prevRank, curRank, prevW, curW, history) {
  // history: array of weighted scores oldest->newest for continuous check
  const rankDelta = (prevRank != null && curRank != null) ? (prevRank - curRank) : null; // positive = improved
  const scoreDelta = (prevW != null && curW != null) ? (curW - prevW) : null;
  let continuous = false;
  if (history && history.length >= 3) {
    let ok = true;
    for (let i = 1; i < history.length; i++) {
      if (history[i] == null || history[i-1] == null || history[i] < history[i-1] - 0.5) { ok = false; break; }
    }
    continuous = ok && history[history.length-1] > history[0] + 1;
  }
  if (continuous) return { key: "streak", label: "持續進步", icon: "🔥", cls: "bg-orange-100 text-orange-800 border-orange-300" };
  if ((rankDelta != null && rankDelta >= 3) || (scoreDelta != null && scoreDelta >= 10))
    return { key: "big", label: "大進步", icon: "🚀", cls: "bg-emerald-100 text-emerald-800 border-emerald-300" };
  if ((rankDelta != null && rankDelta >= 1) || (scoreDelta != null && scoreDelta >= 3))
    return { key: "small", label: "小進步", icon: "📈", cls: "bg-sky-100 text-sky-800 border-sky-300" };
  if ((rankDelta != null && rankDelta <= -2) || (scoreDelta != null && scoreDelta <= -5))
    return { key: "down", label: "退步", icon: "📉", cls: "bg-rose-100 text-rose-800 border-rose-300" };
  if ((rankDelta != null && rankDelta < 0) || (scoreDelta != null && scoreDelta < -1))
    return { key: "down_s", label: "略退", icon: "↘️", cls: "bg-amber-50 text-amber-800 border-amber-200" };
  return { key: "flat", label: "持平", icon: "➡️", cls: "bg-slate-100 text-slate-600 border-slate-200" };
}

function ExamProgressCompareBlock({ activeStudents, examMaps, examIds, currentExamId, examScores, calcStudent }) {
  const otherExamIds = useMemo(
    () => (examIds || []).filter(id => id && id !== currentExamId),
    [examIds, currentExamId]
  );
  // 預設：自動選「非本卷」的全部較早卷（按 id 排序後本卷之前的），最多 3 份
  const defaultBaseline = useMemo(() => {
    const ordered = [...(examIds || [])];
    const idx = ordered.indexOf(currentExamId);
    if (idx > 0) return ordered.slice(Math.max(0, idx - 3), idx);
    // 本卷在最前或不在列表：取其他卷最後最多 3 份
    return otherExamIds.slice(-3);
  }, [examIds, currentExamId, otherExamIds]);

  const [baselineIds, setBaselineIds] = useState([]);
  const [baselineReady, setBaselineReady] = useState(false);
  useEffect(() => {
    setBaselineIds(defaultBaseline);
    setBaselineReady(true);
    setRows(null);
  }, [currentExamId, defaultBaseline.join("|")]);

  const [busy, setBusy] = useState(false);
  const [rows, setRows] = useState(null);
  const [info, setInfo] = useState("");
  const [cache, setCache] = useState(null); // { weightedByExam, ranksByExam }

  const toggleBaseline = (id) => {
    if (id === currentExamId) return;
    setBaselineIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
    setRows(null);
  };

  const run = async () => {
    if (!currentExamId) return alert("請先在上方選擇本卷考試");
    const bases = baselineIds.filter(id => id !== currentExamId);
    if (!bases.length) return alert("請至少選擇一份「對照卷」（不可與本卷相同）");
    const needLoad = [currentExamId, ...bases];
    setBusy(true);
    setInfo("載入對照卷成績中…");
    try {
      const byExam = {};
      for (const eid of needLoad) {
        const part = await loadExamScoresForExam(activeStudents.map(s => s.id), eid);
        if (part.__meta) delete part.__meta;
        byExam[eid] = part;
        setInfo(`已載入 ${Object.keys(byExam).length}/${needLoad.length} 卷…`);
      }
      const ranksByExam = {};
      const weightedByExam = {};
      needLoad.forEach(eid => {
        const list = [];
        activeStudents.forEach(s => {
          const r = byExam[eid]?.[s.id]?.[eid];
          const st = calcExamWeightedFromRec(examMaps[eid], r || {});
          if (st) list.push({ sid: s.id, w: st.weighted });
        });
        list.sort((a, b) => b.w - a.w);
        const rankMap = {}, wMap = {};
        list.forEach((item, i) => { rankMap[item.sid] = i + 1; wMap[item.sid] = item.w; });
        ranksByExam[eid] = rankMap;
        weightedByExam[eid] = wMap;
      });
      setCache({ weightedByExam, ranksByExam });

      // 趨勢：按 examIds 排序後的 baseline + current
      const trendOrder = [...(examIds || [])].filter(id => bases.includes(id) || id === currentExamId);
      // 最近一份對照卷 = trendOrder 中 current 之前最後一份
      const curIdx = trendOrder.indexOf(currentExamId);
      const nearestPrev = curIdx > 0 ? trendOrder[curIdx - 1] : bases[bases.length - 1];

      const nextRows = activeStudents.map(s => {
        const seriesValid = trendOrder.map(eid => weightedByExam[eid]?.[s.id]).filter(x => x != null);
        const curW = weightedByExam[currentExamId]?.[s.id] ?? null;
        const curRank = ranksByExam[currentExamId]?.[s.id] ?? null;
        const prevW = nearestPrev ? (weightedByExam[nearestPrev]?.[s.id] ?? null) : null;
        const prevRank = nearestPrev ? (ranksByExam[nearestPrev]?.[s.id] ?? null) : null;
        const tag = (curW != null && prevW != null)
          ? classifyProgress(prevRank, curRank, prevW, curW, seriesValid)
          : (curW != null
            ? { key: "na", label: "對照無分", icon: "•", cls: "bg-slate-50 text-slate-500 border-slate-200" }
            : { key: "none", label: "未入分", icon: "—", cls: "bg-slate-50 text-slate-400 border-slate-100" });
        return {
          sid: s.id, name: s.name, class: s.class, num: s.num,
          curW, curRank, prevW, prevRank, prevExam: nearestPrev, tag,
          series: trendOrder.map(eid => ({ eid, w: weightedByExam[eid]?.[s.id], rank: ranksByExam[eid]?.[s.id] }))
        };
      });
      nextRows.sort((a, b) => (a.curRank || 999) - (b.curRank || 999));
      setRows(nextRows);
      setInfo(`本卷 ${currentExamId}  vs 對照 ${bases.join("、")}（最近對照：${nearestPrev || "—"}）`);
    } catch (e) {
      alert(e.message);
      setInfo("");
    }
    setBusy(false);
  };

  return (
    <div className="bg-white rounded-2xl border p-5 space-y-3">
      <div className="flex flex-wrap justify-between gap-3 items-start">
        <div>
          <h3 className="font-bold text-lg text-slate-800">跨卷進步比較</h3>
          <p className="text-xs text-slate-500">
            本卷固定為上方所選考試。請勾選<strong>對照卷</strong>（可多選看趨勢）；系統不會用本卷跟自己比。
            預設自動勾選本卷之前最多 3 份。按計算後才讀取。
          </p>
        </div>
        <button disabled={busy || !currentExamId} className="bg-indigo-600 text-white font-bold px-4 py-2 rounded-xl text-sm disabled:opacity-50" onClick={run}>
          {busy ? "計算中…" : "計算進步"}
        </button>
      </div>

      <div className="rounded-xl border border-slate-200 bg-slate-50 p-3 space-y-2">
        <div className="text-xs font-bold text-slate-600">
          本卷（比較終點）：<span className="text-indigo-700 font-black">{currentExamId || "—"}</span>
        </div>
        <div className="text-xs font-bold text-slate-600">對照卷（可多選 · 不可選本卷）</div>
        <div className="flex flex-wrap gap-2">
          {otherExamIds.map(id => (
            <label key={id} className={`text-xs font-bold px-2 py-1 rounded-lg border cursor-pointer ${baselineIds.includes(id)?"border-indigo-500 bg-indigo-50":"border-slate-200 bg-white"}`}>
              <input type="checkbox" className="mr-1" checked={baselineIds.includes(id)} onChange={() => toggleBaseline(id)} />
              {id}{examMaps[id]?.title ? ` · ${examMaps[id].title}` : ""}
            </label>
          ))}
          {!otherExamIds.length && <span className="text-xs text-slate-400">沒有其他考試可作對照</span>}
        </div>
        <div className="flex flex-wrap gap-2">
          <button type="button" className="text-[11px] font-bold text-indigo-600" onClick={() => { setBaselineIds(defaultBaseline); setRows(null); }}>重設為自動建議</button>
          <button type="button" className="text-[11px] font-bold text-slate-500" onClick={() => { setBaselineIds([...otherExamIds]); setRows(null); }}>全選對照卷</button>
          <button type="button" className="text-[11px] font-bold text-slate-500" onClick={() => { setBaselineIds([]); setRows(null); }}>清空</button>
        </div>
      </div>

      {info && <div className="text-xs text-slate-500">{info}</div>}
      <div className="flex flex-wrap gap-2 text-[11px] font-bold">
        {[
          ["🔥 持續進步","bg-orange-100"],
          ["🚀 大進步","bg-emerald-100"],
          ["📈 小進步","bg-sky-100"],
          ["➡️ 持平","bg-slate-100"],
          ["📉 退步","bg-rose-100"],
        ].map(([lab, bg]) => (
          <span key={lab} className={`px-2 py-0.5 rounded ${bg}`}>{lab}</span>
        ))}
      </div>
      {rows && (
        <div className="overflow-auto max-h-[50vh] border rounded-xl">
          <table className="min-w-full text-sm">
            <thead className="sticky top-0 bg-slate-50">
              <tr>
                {["班","號","姓名","本卷分","本卷排名","最近對照分","對照排名","變化","趨勢"].map(h => (
                  <th key={h} className="text-left px-2 py-2 text-xs text-slate-500 font-bold">{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {rows.map(r => (
                <tr key={r.sid} className="border-t">
                  <td className="px-2 py-1.5">{r.class}</td>
                  <td className="px-2 py-1.5">{r.num}</td>
                  <td className="px-2 py-1.5 font-bold">{r.name}</td>
                  <td className="px-2 py-1.5 font-black">{r.curW != null ? r.curW.toFixed(1) : "—"}</td>
                  <td className="px-2 py-1.5">{r.curRank ?? "—"}</td>
                  <td className="px-2 py-1.5">{r.prevW != null ? r.prevW.toFixed(1) : "—"}</td>
                  <td className="px-2 py-1.5">{r.prevRank ?? "—"}</td>
                  <td className="px-2 py-1.5">
                    <span className={`inline-flex items-center gap-1 text-xs font-black px-2 py-1 rounded-lg border ${r.tag.cls}`}>
                      <span className="text-base leading-none">{r.tag.icon}</span>{r.tag.label}
                    </span>
                  </td>
                  <td className="px-2 py-1.5 text-[11px] text-slate-500 mono">
                    {(r.series || []).map(x => x.w != null ? Math.round(x.w) : "·").join("→")}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
      {!rows && !busy && (
        <p className="text-sm text-slate-400 text-center py-6">勾選對照卷後按「計算進步」</p>
      )}
    </div>
  );
}


function ExamInputAnalysisView({ activeStudents, examMaps, examScores, setExamScores, currentCohort }) {
  const examIds = useMemo(
    () => Object.keys(examMaps || {}).filter(id => examVisibleForCohort(examMaps[id], currentCohort)).sort(),
    [examMaps, currentCohort]
  );
  const [selectedExam, setSelectedExam] = useState(examIds[0] || "");
  const [selectedStudentId, setSelectedStudentId] = useState("");
  const [saveStatus, setSaveStatus] = useState("idle");
  const [loading, setLoading] = useState(false);
  const [sortMode, setSortMode] = useState("question"); // question | pAsc | pDesc
  const inputRefs = useRef({});
  const timer = useRef(null);

  const [aiMc, setAiMc] = useState(5);
  const [aiLq, setAiLq] = useState(3);
  const [aiLevel, setAiLevel] = useState("中");
  const [aiExtra, setAiExtra] = useState({ practice: true, review: true, explainImg: false, ppt: false, notes: false });
  const [aiSelected, setAiSelected] = useState([]);

  useEffect(() => {
    if (examIds.length && !examIds.includes(selectedExam)) setSelectedExam(examIds[0] || "");
  }, [examIds]);

  const activeIdsKey = useMemo(() => activeStudents.map(s => s.id).join(","), [activeStudents]);
  const [loadInfo, setLoadInfo] = useState("");

  useEffect(() => {
    if (!selectedExam || !activeStudents.length) return;
    let cancelled = false;
    (async () => {
      setLoading(true);
      setLoadInfo("");
      try {
        const part = await loadExamScoresForExam(activeStudents.map(s => s.id), selectedExam);
        if (cancelled) return;
        const meta = part.__meta || {};
        delete part.__meta;
        setExamScores(prev => {
          const next = { ...prev };
          Object.keys(part).forEach(sid => {
            next[sid] = { ...(next[sid] || {}), ...(part[sid] || {}) };
          });
          if ((meta.errors || 0) === 0) {
            activeStudents.forEach(s => {
              if (!part[s.id] || !part[s.id][selectedExam]) {
                if (next[s.id] && next[s.id][selectedExam]) {
                  const copy = { ...next[s.id] };
                  delete copy[selectedExam];
                  next[s.id] = copy;
                }
              }
            });
          }
          return next;
        });
        setLoadInfo(`讀取 ${meta.found || 0}/${meta.tried || 0} 人有此卷成績` + (meta.errors ? `（${meta.errors} 次讀取失敗）` : ""));
      } catch (e) {
        console.warn(e);
        setLoadInfo("讀取失敗：" + (e.message || String(e)));
      }
      if (!cancelled) setLoading(false);
    })();
    return () => { cancelled = true; };
  }, [selectedExam, activeIdsKey]);

  const map = examMaps[selectedExam];
  const qList = map?.questions || [];

  const calcStudent = (sid) => {
    if (!map) return null;
    const rec = examScores[sid]?.[selectedExam] || {};
    // 建立不區分大小寫的 key 對照
    const recKeys = {};
    Object.keys(rec || {}).forEach(k => { if (k !== "updatedAt" && k !== "_id" && k !== "value") recKeys[String(k).toUpperCase()] = rec[k]; });
    let mcScore = 0, mcMax = 0, lqScore = 0, lqMax = 0, any = false;
    qList.forEach(q => {
      const max = q.max || 1;
      if (q.type === "MC") mcMax += max; else lqMax += max;
      let raw = rec[q.id];
      if (raw === undefined || raw === null || String(raw).trim() === "") {
        raw = recKeys[String(q.id).toUpperCase()];
      }
      if (raw === undefined || raw === null || String(raw).trim() === "") return;
      any = true;
      if (q.type === "MC") {
        if (q.ans) {
          const corrects = q.ans.toString().split(",").map(a => a.trim().toUpperCase());
          if (corrects.includes(String(raw).trim().toUpperCase())) mcScore += max;
        }
      } else {
        lqScore += parseFloat(raw) || 0;
      }
    });
    if (!any) return null;
    const senior = isSeniorExamMap(map, selectedExam);
    let weighted = 0;
    if (senior && mcMax > 0 && lqMax > 0) weighted = (mcScore / mcMax) * 35 + (lqScore / lqMax) * 65;
    else if (mcMax > 0 || lqMax > 0) {
      const t = mcScore + lqScore, tm = mcMax + lqMax;
      weighted = tm > 0 ? (t / tm) * 100 : 0;
    }
    return { mcScore, mcMax, lqScore, lqMax, total: mcScore + lqScore, max: mcMax + lqMax, weighted, isSenior: senior };
  };

  const focusNext = (fromQid) => {
    const idx = qList.findIndex(q => q.id === fromQid);
    if (idx < 0 || idx >= qList.length - 1) return;
    const nextId = qList[idx + 1].id;
    setTimeout(() => {
      const el = inputRefs.current[nextId] || document.querySelector('[data-ex-qid="'+nextId+'"]');
      if (el) { el.focus(); if (el.select) el.select(); }
    }, 40);
  };

  const scheduleSave = (sid, examId, record) => {
    setSaveStatus("saving");
    if (timer.current) clearTimeout(timer.current);
    timer.current = setTimeout(async () => {
      try {
        await saveExamScore(sid, examId, record);
        setSaveStatus("saved");
        setTimeout(() => setSaveStatus(s => s === "saved" ? "idle" : s), 1500);
      } catch (e) { setSaveStatus("idle"); alert(e.message); }
    }, 600);
  };

  const setQVal = (qid, raw, q) => {
    if (!selectedStudentId || !selectedExam) return;
    let stored = raw;
    if (raw === "" || raw === null || raw === undefined) stored = "";
    else if (q.type === "MC") stored = String(raw).toUpperCase().replace(/[^A-D]/g, "").slice(0, 1);
    else stored = (raw === "" || isNaN(parseFloat(raw))) ? raw : parseFloat(raw);

    setExamScores(prev => {
      const prevRec = { ...(prev[selectedStudentId]?.[selectedExam] || {}) };
      const nextRec = { ...prevRec, [qid]: stored };
      const next = {
        ...prev,
        [selectedStudentId]: {
          ...(prev[selectedStudentId] || {}),
          [selectedExam]: nextRec
        }
      };
      scheduleSave(selectedStudentId, selectedExam, nextRec);
      return next;
    });
    if (stored !== "" && stored !== null) focusNext(qid);
  };

  const clearStudent = async () => {
    if (!selectedStudentId || !selectedExam) return;
    if (!confirm("清除此學生此考試全部成績？")) return;
    try {
      await deleteExamScore(selectedStudentId, selectedExam);
      setExamScores(prev => {
        const next = { ...prev };
        if (next[selectedStudentId]) {
          const copy = { ...next[selectedStudentId] };
          delete copy[selectedExam];
          next[selectedStudentId] = copy;
        }
        return next;
      });
    } catch (e) { alert(e.message); }
  };


  // Analysis stats
  const attemptedStudents = useMemo(() => {
    return activeStudents.filter(s => {
      const rec = examScores[s.id]?.[selectedExam];
      if (!rec) return false;
      return qList.some(q => {
        const v = rec[q.id];
        return v !== undefined && v !== null && String(v).trim() !== "";
      });
    });
  }, [activeStudents, examScores, selectedExam, qList]);

  const qStats = useMemo(() => {
    if (!map) return [];
    return qList.map(q => {
      let totalScore = 0, attempts = 0;
      const counts = { A: 0, B: 0, C: 0, D: 0, Other: 0 };
      attemptedStudents.forEach(s => {
        const rec = examScores[s.id]?.[selectedExam];
        if (!rec) return;
        const val = rec[q.id];
        if (val === undefined || val === null || String(val).trim() === "") return;
        attempts++;
        if (q.type === "MC") {
          const ans = String(val).trim().toUpperCase();
          if (["A","B","C","D"].includes(ans)) counts[ans]++;
          else if (ans) counts.Other++;
          const sc = quizQuestionScore(q, val);
          if (sc != null) totalScore += sc;
        } else {
          totalScore += parseFloat(val) || 0;
        }
      });
      const pValue = attempts > 0 && q.max > 0 ? totalScore / (attempts * q.max) : null;
      let diag = "—", badgeColor = "text-slate-500 bg-slate-50 border-slate-200";
      if (pValue != null) {
        if (pValue < 0.40) { diag = "艱深"; badgeColor = "text-red-600 bg-red-50 border-red-200"; }
        else if (pValue > 0.75) { diag = "容易"; badgeColor = "text-green-600 bg-green-50 border-green-200"; }
        else { diag = "中等"; badgeColor = "text-amber-600 bg-amber-50 border-amber-200"; }
      }
      return {
        ...q,
        topicDesc: q.topicDesc || q.desc || "",
        attempts,
        totalScore,
        pValue,
        pct: pValue != null ? pValue * 100 : null,
        diag,
        badgeColor,
        counts
      };
    });
  }, [map, qList, attemptedStudents, examScores, selectedExam]);

  const sortedStats = useMemo(() => {
    const arr = qStats.slice();
    if (sortMode === "pAsc") arr.sort((a, b) => (a.pct ?? 999) - (b.pct ?? 999));
    else if (sortMode === "pDesc") arr.sort((a, b) => (b.pct ?? -1) - (a.pct ?? -1));
    else arr.sort((a, b) => String(a.id).localeCompare(String(b.id), undefined, { numeric: true }));
    return arr;
  }, [qStats, sortMode]);

  useEffect(() => {
    setAiSelected(qStats.filter(q => q.pct != null && q.pct < 60).map(q => q.id));
  }, [selectedExam, qStats.map(q => q.id + ":" + Math.round(q.pct || 0)).join("|")]);

  const classAvg = useMemo(() => {
    if (!attemptedStudents.length || !map) return null;
    let sumW = 0, n = 0;
    attemptedStudents.forEach(s => {
      const st = calcStudent(s.id);
      if (st) { sumW += st.weighted; n++; }
    });
    return n ? sumW / n : null;
  }, [attemptedStudents, examScores, selectedExam, map]);

  const buildPrompt = () => {
    const list = (aiSelected.length ? qStats.filter(q => aiSelected.includes(q.id)) : qStats.filter(q => q.pct != null && q.pct < 60));
    const weakQ = list.map(q => formatWeakItem(q, `全班得分率 ${q.pct == null ? "—" : Math.round(q.pct) + "%"}，難度體感：${q.diag}`)).join("\n") || "- （無）";
    const topicIds = list.map(q => q.topicId).filter(Boolean);
    const syllabus = getSyllabusTableText(topicIds);
    const tasks = [];
    if (aiExtra.practice) tasks.push(`A. 針對性練習：${aiMc} MC + ${aiLq} LQ，難度「${aiLevel}」。每題標明 topicId。`);
    if (aiExtra.review) tasks.push(`B. 約 15 分鐘試後檢討大綱（迷思、3 條 Concept Checking）。`);
    if (aiExtra.explainImg) tasks.push(`C. 解說圖描述。`);
    if (aiExtra.ppt) tasks.push(`D. PPT 大綱 8–12 頁。`);
    if (aiExtra.notes) tasks.push(`E. 溫習筆記。`);
    if (!tasks.length) tasks.push(`A. 練習 ${aiMc} MC + ${aiLq} LQ。`);
    return `【身份】你是香港 DSE 化學科老師。

【任務】全班剛完成考試「${map?.title || selectedExam}」（已入分 ${attemptedStudents.length} 人${classAvg != null ? `，加權平均約 ${classAvg.toFixed(1)}` : ""}）。

【弱項／選中題目】（含 topicId）
${weakQ}

【課程大綱參考】
${syllabus}

【產出要求】
${tasks.map((x,i)=>`${i+1}. ${x}`).join("\n")}

【其他】繁體中文；對應 topicId；直接給內容。`;
  };

  if (!examIds.length) {
    return <div className="p-8 text-slate-400">尚未有考試藍圖。請先到「考試內容設定」或匯入 examMaps。</div>;
  }
  if (!map) return <div className="p-8 text-slate-400">找不到考試資料</div>;

  const rec = selectedStudentId ? (examScores[selectedStudentId]?.[selectedExam] || {}) : {};
  const curStats = selectedStudentId ? calcStudent(selectedStudentId) : null;

  return (
    <div className="space-y-4">
      <div className="grid lg:grid-cols-5 gap-4">
        <div className="lg:col-span-2 bg-white rounded-2xl border p-4 space-y-3">
          <select className="w-full border rounded-lg px-2 py-2 text-sm font-bold" value={selectedExam}
            onChange={e => { setSelectedExam(e.target.value); setSelectedStudentId(""); }}>
            {examIds.map(id => <option key={id} value={id}>{id} — {examMaps[id].title || id}</option>)}
          </select>
          {loading && <div className="text-[11px] text-slate-400">載入此考試成績中…</div>}
          {!!loadInfo && <div className="text-[11px] text-slate-500">{loadInfo}</div>}
          <div className="max-h-[60vh] overflow-auto space-y-1">
            {activeStudents.map(s => {
              const st = calcStudent(s.id);
              const w = st ? st.weighted : null;
              const wCls = w == null ? "" : w < 40 ? "bg-rose-100 text-rose-800 border-rose-200" : w < 50 ? "bg-amber-100 text-amber-900 border-amber-200" : w < 70 ? "bg-sky-100 text-sky-800 border-sky-200" : "bg-emerald-100 text-emerald-800 border-emerald-200";
              return (
                <button key={s.id} onClick={() => setSelectedStudentId(s.id)}
                  className={`w-full text-left px-3 py-2 rounded-xl border text-sm ${selectedStudentId===s.id?"border-purple-400 bg-purple-50 ring-1 ring-purple-200":"border-slate-100 hover:bg-slate-50"}`}>
                  <div className="flex justify-between items-center gap-2">
                    <span className="font-bold text-base"><b>{s.class}-{s.num}</b> {s.name}</span>
                    {!st && <span className="text-xs text-slate-400">未入分</span>}
                    {st && (
                      <span className={`text-lg font-black px-2 py-0.5 rounded-lg border-2 ${wCls}`}>
                        {st.weighted.toFixed(1)} <span className="text-sm font-bold opacity-70">/ 100</span>
                      </span>
                    )}
                  </div>
                  {st && (
                    <div className="mt-1 flex flex-wrap gap-1.5 text-xs font-bold">
                      <span className="px-1.5 py-0.5 rounded bg-indigo-50 text-indigo-700 border border-indigo-100">MC {st.mcScore}/{st.mcMax}</span>
                      <span className="px-1.5 py-0.5 rounded bg-fuchsia-50 text-fuchsia-700 border border-fuchsia-100">LQ {st.lqScore}/{st.lqMax}</span>
                      <span className="px-1.5 py-0.5 rounded bg-slate-50 text-slate-600 border border-slate-200">卷面 {st.total}/{st.max}</span>
                    </div>
                  )}
                </button>
              );
            })}
          </div>
        </div>
        <div className="lg:col-span-3 bg-white rounded-2xl border p-4">
          {!selectedStudentId ? (
            <p className="text-slate-400 p-8 text-center">選擇學生輸入考試成績</p>
          ) : (
            <div className="space-y-3">
              <div className="flex flex-wrap justify-between items-center gap-2">
                <div className="font-black text-lg">{activeStudents.find(x=>x.id===selectedStudentId)?.name}

              {curStats && (
                <div className="rounded-2xl border-2 border-purple-300 bg-purple-50 px-4 py-3 flex flex-wrap items-center gap-4">
                  <div>
                    <div className="text-xs font-bold text-purple-600 uppercase tracking-wide">抄寫用 · 加權分</div>

                      {curStats.weighted.toFixed(1)}<span className="text-xl text-purple-500 font-bold"> / 100</span>

                  </div>
                  <div className="text-sm font-bold text-slate-700 space-y-0.5">
                    <div>MC {curStats.mcScore}/{curStats.mcMax}</div>
                    <div>LQ {curStats.lqScore}/{curStats.lqMax}</div>
                    <div className="text-slate-500">卷面 {curStats.total}/{curStats.max}</div>

                </div>
              )}

              <div className="space-y-2 max-h-[50vh] overflow-auto">
                {qList.map(q => {
                  const raw = rec[q.id];
                  const has = raw !== undefined && raw !== null && String(raw).trim() !== "";
                  let scoreColor = "border-slate-200 bg-white";
                  if (has) {
                    if (q.type === "MC") {
                      const ok = q.ans && q.ans.toString().split(",").map(a=>a.trim().toUpperCase()).includes(String(raw).trim().toUpperCase());
                      scoreColor = ok ? "border-emerald-400 bg-emerald-50 text-emerald-800" : "border-rose-400 bg-rose-50 text-rose-700";
                    } else {
                      const n = parseFloat(raw);
                      if (!isNaN(n) && n <= 0) scoreColor = "border-rose-400 bg-rose-50 text-rose-700";
                      else if (!isNaN(n) && n >= (q.max||0)) scoreColor = "border-emerald-400 bg-emerald-50 text-emerald-800";

                  return (

                          <input data-ex-qid={q.id} ref={el=>{if(el)inputRefs.current[q.id]=el;}} type="number"

                            onChange={e=>setQVal(q.id, e.target.value, q)}

        <div className="flex flex-wrap justify-between gap-2 items-center">

            <h3 className="font-bold text-lg">考試弱點分析 · {selectedExam} {map.title}</h3>

              {[
                { title: "淺 (P ≥ 75%)", cls: "bg-emerald-50 border-emerald-200 text-emerald-800", filter: q => q.pct != null && q.pct >= 75 },
                { title: "中 (40% ≤ P < 75%)", cls: "bg-amber-50 border-amber-200 text-amber-900", filter: q => q.pct != null && q.pct >= 40 && q.pct < 75 },
                { title: "深 (P < 40%)", cls: "bg-rose-50 border-rose-200 text-rose-800", filter: q => q.pct != null && q.pct < 40 },
              ].map((card, i) => {
                const list = qStats.filter(card.filter);
                return (
                  <div key={i} className={`rounded-2xl border p-4 ${card.cls}`}>
                    <div className="font-bold text-sm">{card.title}</div>
                    <div className="text-3xl font-black my-2">{list.length} <span className="text-base">題</span></div>
                    <div className="text-xs font-semibold break-words">{list.map(q=>q.id).join(", ") || "—"}</div>
                  </div>
                );
              })}
            </div>

            <div className="overflow-auto max-h-96 border rounded-xl">
              <table className="min-w-full text-xs">
                <thead className="bg-purple-50 sticky top-0">

                    <th className="px-2 py-2 text-left">選</th>
                    <th className="px-2 py-2 text-left">題號</th>
                    <th className="px-2 py-2 text-left">考核概念</th>
                    <th className="px-2 py-2 text-center">topicId</th>
                    <th className="px-2 py-2 text-center">作答</th>
                    <th className="px-2 py-2 text-center">得分率</th>
                    <th className="px-2 py-2 text-center">診斷</th>
                    <th className="px-2 py-2 text-left">MC 選項分佈</th>
                  </tr>
                </thead>
                <tbody>
                  {sortedStats.map(q => {
                    const pctCls = q.pct == null ? "text-slate-400" : q.pct < 40 ? "text-rose-600 font-bold" : q.pct < 75 ? "text-amber-600 font-bold" : "text-emerald-600 font-bold";
                    return (
                      <tr key={q.id} className="border-t">
                        <td className="px-2 py-1.5">
                          <input type="checkbox" checked={aiSelected.includes(q.id)}
                            onChange={() => setAiSelected(prev => prev.includes(q.id) ? prev.filter(x=>x!==q.id) : [...prev, q.id])} />
                        </td>
                        <td className="px-2 py-1.5 mono font-bold">{q.id}</td>
                        <td className="px-2 py-1.5 max-w-[200px] truncate" title={q.topicDesc}>{q.topicDesc}</td>
                        <td className="px-2 py-1.5 text-center mono text-[10px]">{q.topicId || "—"}</td>
                        <td className="px-2 py-1.5 text-center">{q.attempts}</td>
                        <td className={`px-2 py-1.5 text-center ${pctCls}`}>{q.pct == null ? "—" : q.pct.toFixed(1) + "%"}</td>
                        <td className="px-2 py-1.5 text-center">
                          <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded border ${q.badgeColor}`}>{q.diag}</span>
                        </td>
                        <td className="px-2 py-1.5 min-w-[180px]">
                          {q.type !== "MC" ? <span className="text-slate-400">—</span> : (() => {
                            const total = Math.max(1, (q.counts.A||0)+(q.counts.B||0)+(q.counts.C||0)+(q.counts.D||0)+(q.counts.Other||0));
                            const ansSet = (q.ans||"").toString().toUpperCase().split(",").map(a=>a.trim()).filter(Boolean);
                            const colors = { A: "bg-sky-500", B: "bg-violet-500", C: "bg-amber-500", D: "bg-rose-400" };
                            return (
                              <div className="space-y-1 py-0.5">
                                {["A","B","C","D"].map(opt => {
                                  const n = q.counts[opt] || 0;
                                  const pct = Math.round((n / total) * 100);
                                  const isAns = ansSet.includes(opt);
                                  return (
                                    <div key={opt} className="flex items-center gap-1.5">
                                      <span className={`w-4 text-[11px] font-black ${isAns ? "text-emerald-600" : "text-slate-600"}`}>{opt}</span>
                                      <div className="flex-1 h-3 rounded-md bg-slate-100 overflow-hidden border border-slate-200">
                                        <div className={`h-full ${isAns ? "bg-emerald-500" : colors[opt]}`} style={{width: Math.max(pct, n>0?4:0)+"%"}} title={n+" 人"} />
                                      </div>
                                      <span className={`text-[11px] font-bold w-12 text-right tabular-nums ${isAns?"text-emerald-700":"text-slate-700"}`}>{n}<span className="text-slate-400 font-normal">({pct}%)</span></span>
                                    </div>
                                  );
                                })}
                                {ansSet.length > 0 && (
                                  <div className="text-[10px] text-emerald-700 font-bold">✓ 答案 {ansSet.join("/")}</div>
                                )}
                              </div>
                            );
                          })()}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>

            <div className="rounded-2xl border-2 border-violet-300 bg-violet-50 p-5 space-y-4">
              <div className="font-black text-violet-900 text-lg">考試 AI Prompt</div>
              <div className="flex flex-wrap gap-2">
                <button className="px-3 py-1.5 rounded-lg bg-rose-100 text-rose-800 font-bold text-sm border"
                  onClick={() => setAiSelected(qStats.filter(q=>q.pct!=null&&q.pct<60).map(q=>q.id))}>全選弱項(&lt;60%)</button>
                <button className="px-3 py-1.5 rounded-lg bg-white border font-bold text-sm" onClick={() => setAiSelected(qStats.map(q=>q.id))}>全選</button>
                <button className="px-3 py-1.5 rounded-lg bg-white border font-bold text-sm" onClick={() => setAiSelected([])}>清空</button>
              </div>
              <div className="grid sm:grid-cols-3 gap-3">
                <label className="text-sm font-bold">難度
                  <select className="mt-1 w-full border-2 rounded-lg px-3 py-2" value={aiLevel} onChange={e=>setAiLevel(e.target.value)}>
                    <option value="淺">淺</option><option value="中">中</option><option value="深">深</option>
                  </select>
                </label>
                <label className="text-sm font-bold">MC
                  <input type="number" className="mt-1 w-full border-2 rounded-lg px-3 py-2" value={aiMc} onChange={e=>setAiMc(parseInt(e.target.value)||0)} />
                </label>
                <label className="text-sm font-bold">LQ
                  <input type="number" className="mt-1 w-full border-2 rounded-lg px-3 py-2" value={aiLq} onChange={e=>setAiLq(parseInt(e.target.value)||0)} />
                </label>
              </div>
              <div className="flex flex-wrap gap-3">
                {[
                  ["practice","弱項練習"],
                  ["review","試後檢討"],
                  ["explainImg","解說圖"],
                  ["ppt","PPT"],
                  ["notes","筆記"],
                ].map(([k,lab])=>(
                  <label key={k} className={`flex items-center gap-2 px-3 py-2 rounded-xl border-2 text-sm font-bold cursor-pointer ${aiExtra[k]?"border-violet-500 bg-white":"border-slate-200"}`}>
                    <input type="checkbox" checked={!!aiExtra[k]} onChange={e=>setAiExtra(x=>({...x,[k]:e.target.checked}))} /> {lab}
                  </label>
                ))}
              </div>
              <button className="bg-violet-600 text-white font-black px-6 py-3 rounded-xl"
                onClick={() => navigator.clipboard.writeText(buildPrompt()).then(()=>alert("已複製")).catch(()=>alert("失敗"))}>
                複製 AI Prompt（已選 {aiSelected.length} 題 · 含 Syllabus）
              </button>
            </div>
          </>
        )}
      </div>

      {/* 跨卷進步比較：按需計算，避免預設大量讀取 */}
      <ExamProgressCompareBlock
        activeStudents={activeStudents}
        examMaps={examMaps}
        examIds={examIds}
        currentExamId={selectedExam}
        examScores={examScores}
        calcStudent={calcStudent}
      />
    </div>
  );
}




function ExamPersonalAnalysisView({ activeStudents, examMaps, currentCohort }) {
  const examIds = useMemo(
    () => Object.keys(examMaps || {}).filter(id => examVisibleForCohort(examMaps[id], currentCohort)).sort(),
    [examMaps, currentCohort]
  );
  const [selectedStudentId, setSelectedStudentId] = useState("");
  const [scores, setScores] = useState({});
  const [loading, setLoading] = useState(false);
  const [selectedExams, setSelectedExams] = useState([]);
  const [selectedTopics, setSelectedTopics] = useState([]);
  const [aiLang, setAiLang] = useState("繁體中文");
  const [aiMcCount, setAiMcCount] = useState(8);
  const [aiLqCount, setAiLqCount] = useState(2);
  const [aiExtra, setAiExtra] = useState({ practice: true, notes: false, ppt: false, explainImg: false });
  const chartRef = useRef(null);
  const chartInstance = useRef(null);

  useEffect(() => {
    if (!selectedStudentId) { setScores({}); setSelectedExams([]); return; }
    let cancelled = false;
    (async () => {
      setLoading(true);
      try {
        const data = await loadAllExamScoresForStudent(selectedStudentId);
        if (cancelled) return;
        setScores(data);
        const taken = examIds.filter(eid => {
          const rec = data[eid] || {};
          return Object.keys(rec).some(k => k !== "updatedAt" && k !== "_id" && k !== "value" && rec[k] !== "" && rec[k] != null);
        });
        setSelectedExams(taken);
        setSelectedTopics([]);
      } catch (e) { console.warn(e); }
      if (!cancelled) setLoading(false);
    })();
    return () => { cancelled = true; };
  }, [selectedStudentId, examIds.join("|")]);

  const allExamsTaken = useMemo(() => {
    return examIds.filter(eid => {
      const rec = scores[eid] || {};
      return Object.keys(rec).some(k => k !== "updatedAt" && k !== "_id" && k !== "value" && rec[k] !== "" && rec[k] != null);
    });
  }, [scores, examIds]);

  const hasAnsweredQ = (examId, qId) => {
    const val = scores?.[examId]?.[qId];
    return val !== undefined && val !== null && val !== "";
  };
  const getStudentQScore = (examId, q) => {
    const val = scores?.[examId]?.[q.id];
    if (val === undefined || val === null || val === "") return 0;
    return quizQuestionScore(q, val) || 0;
  };

  const studentAnalysis = useMemo(() => {
    if (!selectedStudentId || !selectedExams.length) return { topics: [], domainStats: {} };
    const topicStats = {};
    const domainStats = {
      "1": { name: "地球與化學", max: 0, earned: 0 },
      "2": { name: "微觀世界 I", max: 0, earned: 0 },
      "3": { name: "金屬", max: 0, earned: 0 },
      "4": { name: "酸與鹼", max: 0, earned: 0 },
      "5": { name: "化石燃料", max: 0, earned: 0 },
      "6": { name: "微觀世界 II", max: 0, earned: 0 },
      "7": { name: "氧化還原", max: 0, earned: 0 },
      "8": { name: "能量", max: 0, earned: 0 },
      "9": { name: "反應速率", max: 0, earned: 0 },
      "10": { name: "化學平衡", max: 0, earned: 0 },
      "11": { name: "碳化合物", max: 0, earned: 0 },
      "12": { name: "化學規律", max: 0, earned: 0 },
      "13": { name: "工業化學", max: 0, earned: 0 },
      "14": { name: "材料化學", max: 0, earned: 0 },
      "15": { name: "分析化學", max: 0, earned: 0 }
    };
    selectedExams.forEach(examId => {
      const map = examMaps[examId];
      if (!map?.questions) return;
      map.questions.forEach(q => {
        if (!hasAnsweredQ(examId, q.id)) return;
        const score = getStudentQScore(examId, q);
        const tid = q.topicId || "（無）";
        if (!topicStats[tid]) {
          const info = SYLLABUS_TOPICS?.[tid];
          topicStats[tid] = {
            topicId: tid,
            topicName: (info && typeof info === "object") ? (info.topic || info.name || "") : (info || ""),
            syllabusDesc: (info && typeof info === "object") ? (info.desc || "") : "",
            totalMax: 0, totalEarned: 0, errorDescList: new Set()
          };
        }
        topicStats[tid].totalMax += q.max || 1;
        topicStats[tid].totalEarned += score;
        if (score < (q.max || 1) && q.topicDesc) topicStats[tid].errorDescList.add(q.topicDesc);
        let domainKey = String(tid).startsWith("E3") ? "E3" : String(tid).startsWith("E4") ? "E4" : String(tid).charAt(0);
        if (domainStats[domainKey]) {
          domainStats[domainKey].max += q.max || 1;
          domainStats[domainKey].earned += score;
        }
      });
    });
    const topics = Object.values(topicStats)
      .map(t => ({ ...t, overallPct: t.totalMax > 0 ? t.totalEarned / t.totalMax : 0, errorDescArray: Array.from(t.errorDescList) }))
      .filter(t => t.totalMax > 0 && t.overallPct <= 0.6)
      .sort((a, b) => a.overallPct - b.overallPct);
    return { topics, domainStats };
  }, [selectedStudentId, selectedExams, scores, examMaps]);

  const examScoresList = useMemo(() => {
    return selectedExams.map(eid => {
      const st = calcExamWeightedFromRec(examMaps[eid], scores[eid] || {});
      return { id: eid, title: examMaps[eid]?.title || eid, weighted: st?.weighted ?? null };
    }).filter(x => x.weighted != null);
  }, [selectedExams, scores, examMaps]);

  // DSE 模擬等級：已選考試綜合加權平均
  const gradeEstimate = useMemo(() => {
    if (!selectedStudentId || !examScoresList.length) return null;
    const avg = examScoresList.reduce((a, x) => a + x.weighted, 0) / examScoresList.length;
    const grade = estimateDseLevel(avg / 100);
    return { avg, grade, papers: examScoresList.length, list: examScoresList };
  }, [selectedStudentId, examScoresList]);

  useEffect(() => {
    if (!selectedStudentId || !chartRef.current) return;
    const ds = studentAnalysis.domainStats || {};
    const labels = [], dataPoints = [];
    Object.keys(ds).forEach(key => {
      if (ds[key].max > 0) {
        labels.push(ds[key].name);
        dataPoints.push(Math.round((ds[key].earned / ds[key].max) * 100));
      }
    });
    if (typeof Chart === "undefined") return;
    if (chartInstance.current) chartInstance.current.destroy();
    if (!labels.length) return;
    chartInstance.current = new Chart(chartRef.current.getContext("2d"), {
      type: "radar",
      data: {
        labels,
        datasets: [{
          label: "掌握度 %",
          data: dataPoints,
          backgroundColor: "rgba(124,58,237,0.2)",
          borderColor: "rgba(124,58,237,0.85)",
          pointBackgroundColor: "rgba(124,58,237,1)",
          borderWidth: 2
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: { r: { min: 0, max: 100, ticks: { stepSize: 20, display: false }, pointLabels: { font: { size: 11, weight: "bold" } } } },
        plugins: { legend: { display: false } }
      }
    });
    return () => { if (chartInstance.current) chartInstance.current.destroy(); };
  }, [studentAnalysis, selectedStudentId]);

  const studentName = activeStudents.find(s => s.id === selectedStudentId)?.name || "該學生";
  const generatedPrompt = useMemo(() => {
    if (!selectedStudentId || !selectedTopics.length) return "👈 請勾選至少一個弱點課題。";
    const targetTopics = studentAnalysis.topics.filter(t => selectedTopics.includes(t.topicId));
    const weakTopicsText = targetTopics.map(t =>
      `- 課題 [${t.topicId} ${t.topicName}]: 得分率 ${(t.overallPct*100).toFixed(0)}%｜學習要求: ${t.syllabusDesc || "—"}｜錯因: ${t.errorDescArray.join("; ") || "綜合薄弱"}`
    ).join("\n");
    const syllabus = getSyllabusTableText(targetTopics.map(t => t.topicId));
    return `【身份】你是香港 DSE 化學科老師。

【任務】學生【${studentName}】在校內考試中，下列課題得分率 ≤60%。請設計補底練習。

【基本設定】語言 ${aiLang}；MC ${aiMcCount}；LQ ${aiLqCount}
★ 若出練習，請用 Canvas 互動式小測驗形式。

【重災區】
${weakTopicsText}

【課程大綱參考】
${syllabus}

【要求】針對錯因出題；MC 附 4 選項；每題標 topicId；開頭一句鼓勵。
${aiExtra.notes ? "\\n【另】溫習筆記條列。" : ""}${aiExtra.ppt ? "\\n【另】PPT 大綱 8–12 頁。" : ""}${aiExtra.explainImg ? "\\n【另】解說圖描述。" : ""}`;
  }, [aiLang, aiMcCount, aiLqCount, selectedTopics, selectedStudentId, studentAnalysis, studentName, aiExtra]);

  return (
    <div className="space-y-4">
      <div className="flex flex-wrap justify-between gap-3 items-center">
        <div>
          <h2 className="font-bold text-xl text-violet-800">個人考試分析</h2>
          <p className="text-sm text-slate-500">跨卷弱點、領域雷達圖、補底 Prompt（模式同 Pastpaper 個人分析）</p>
        </div>
        <select className="border-2 rounded-lg px-3 py-2 text-sm font-bold min-w-[200px]" value={selectedStudentId}
          onChange={e => setSelectedStudentId(e.target.value)}>
          <option value="">-- 選擇學生 --</option>

              <label className="text-xs font-bold">MC
                <input type="number" className="mt-0.5 w-full border rounded px-2 py-1" value={aiMcCount} onChange={e=>setAiMcCount(parseInt(e.target.value)||0)} />

                </label>

              onClick={() => navigator.clipboard.writeText(generatedPrompt).then(()=>alert("已複製")).catch(()=>alert("失敗"))}>

            </button>
