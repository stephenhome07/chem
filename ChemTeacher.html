// ---------- 課程大綱（Topic ID）----------
let SYLLABUS_TOPICS = {};
let ACTIVE_SYLLABUS_ID = "all";

async function loadSyllabus(syllabusId) {
  const id = syllabusId || ACTIVE_SYLLABUS_ID || "all";
  ACTIVE_SYLLABUS_ID = id;
  try {
    let snap = await db.collection("syllabus").doc(String(id)).get();
    if (!snap.exists && id !== "all") {
      snap = await db.collection("syllabus").doc("all").get();
      if (snap.exists) ACTIVE_SYLLABUS_ID = "all";
    }
    if (snap.exists) {
      const data = snap.data();
      SYLLABUS_TOPICS = data.data || data.topics || data || {};
      if (SYLLABUS_TOPICS && SYLLABUS_TOPICS.data && typeof SYLLABUS_TOPICS.data === "object") {
        SYLLABUS_TOPICS = SYLLABUS_TOPICS.data;
      }
    }
  } catch (e) { console.warn("syllabus", e); }
  return SYLLABUS_TOPICS;
}

function getSyllabusTableText(topicIds) {
  const topics = SYLLABUS_TOPICS || {};
  const lines = ["課題編號\t範疇\t課題名稱\t學習要求"];
  let idList = [];
  if (topicIds && topicIds.length) {
    idList = [...new Set(topicIds.filter(Boolean))];
  } else {
    idList = Object.keys(topics);
  }
  idList.forEach(id => {
    const val = topics[id];
    if (typeof val === "object" && val !== null) {
      lines.push(`${id}\t${val.section || ""}\t${val.topic || val.name || ""}\t${val.desc || ""}`);
    } else if (val != null && val !== undefined) {
      lines.push(`${id}\t\t${val}\t`);
    } else {
      lines.push(`${id}\t\t\t`);
    }
  });
  if (lines.length === 1) {
    return "（課程大綱尚未載入。請匯入含 syllabus 的 Sheet JSON。）";
  }
  return lines.join("\n");
}

// ===== 讀取優化：記憶體快取 + scoreSummary =====
const __scoreDocCache = new Map();
const __summaryCache = new Map();
let __MAPS_BUNDLE = { homework: {}, quiz: {}, exam: {}, pastpaper: {} };
function setMapsBundle(bundle) { __MAPS_BUNDLE = bundle || __MAPS_BUNDLE; }
function cacheKey(sid, sub, id) { return sid + "/" + sub + "/" + id; }
function invalidateScoreCache(sid, sub, id) {
  if (sid && sub && id != null) __scoreDocCache.delete(cacheKey(sid, sub, id));
  else if (sid) {
    const prefix = sid + "/";
    for (const k of [...__scoreDocCache.keys()]) if (k.startsWith(prefix)) __scoreDocCache.delete(k);
  }
  if (sid) __summaryCache.delete(sid);
}
async function getScoreDocCached(sid, sub, id, force) {
  const key = cacheKey(sid, sub, id);
  if (!force && __scoreDocCache.has(key)) return __scoreDocCache.get(key);
  try {
    const snap = await db.collection("scores").doc(sid).collection(sub).doc(String(id)).get();
    const data = snap.exists ? snap.data() : null;
    __scoreDocCache.set(key, data);
    return data;
  } catch (e) { console.warn(key, e); return null; }
}
function avgPctArr(arr) { return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null; }
function mapVisibleCohort(map, cohort) {
  if (!map) return false;
  if (!map.cohort || map.cohort === "" || map.cohort === "所有學生") return true;
  if (!cohort) return true;
  return map.cohort === cohort;
}
function computeSummaryFromTrees(maps, trees, cohort) {
  const hwPcts=[], quizPcts=[], examWs=[], ppPcts=[];
  Object.entries(maps.homework||{}).forEach(([id,m])=>{
    if (!mapVisibleCohort(m, cohort) || !m.questions) return;
    const rec = trees.homeworks && trees.homeworks[id];
    if (!rec) return;
    const body = (rec.scores && typeof rec.scores==="object") ? Object.assign({}, rec, rec.scores) : rec;
    let earned=0,max=0,any=false;
    m.questions.forEach(q=>{
      max += q.max||0;
      const raw = body[q.id];
      if (raw===undefined||raw===null||String(raw).trim()==="") return;
      any=true; const sc=quizQuestionScore(q,raw); earned += sc==null?0:sc;
    });
    if (any && max>0) hwPcts.push(earned/max);
  });
  Object.entries(maps.quiz||{}).forEach(([id,m])=>{
    if (!mapVisibleCohort(m, cohort) || !m.questions) return;
    const rec = trees.quizzes && trees.quizzes[id];
    if (!rec) return;
    let earned=0,max=0,any=false;
    m.questions.forEach(q=>{
      max += q.max||0;
      const raw = rec[q.id];
      if (raw===undefined||raw===null||String(raw).trim()==="") return;
      any=true; const sc=quizQuestionScore(q,raw); earned += sc==null?0:sc;
    });
    if (any && max>0) quizPcts.push(earned/max);
  });
  Object.entries(maps.exam||{}).forEach(([id,m])=>{
    if (!mapVisibleCohort(m, cohort)) return;
    const rec = trees.exams && trees.exams[id];
    if (!rec) return;
    const st = (typeof calcExamWeightedFromRec==="function") ? calcExamWeightedFromRec(m, rec, id) : null;
    if (st) examWs.push(st.weighted/100);
  });
  Object.entries(maps.pastpaper||{}).forEach(([id,m])=>{
    if (!m || !m.questions) return;
    const rec = trees.pastpapers && trees.pastpapers[id];
    if (!rec) return;
    let earned=0,max=0,any=false;
    m.questions.forEach(q=>{
      max += q.max||0;
      const raw = rec[q.id];
      if (raw===undefined||raw===null||String(raw).trim()==="") return;
      any=true; const sc=quizQuestionScore(q,raw); earned += sc==null?0:sc;
    });
    if (any && max>0) ppPcts.push(earned/max);
  });
  const hw=avgPctArr(hwPcts), quiz=avgPctArr(quizPcts), exam=avgPctArr(examWs), pp=avgPctArr(ppPcts);
  const parts=[];
  if (hw!=null) parts.push({w:20,v:hw});
  if (quiz!=null) parts.push({w:30,v:quiz});
  if (exam!=null) parts.push({w:50,v:exam});
  const sumW = parts.reduce((a,p)=>a+p.w,0);
  const overall = sumW ? parts.reduce((a,p)=>a+p.v*(p.w/sumW),0) : null;
  return { hw, quiz, exam, pp, overall };
}
async function loadStudentScoreTreeCached(sid, subs) {
  const out = {};
  for (const sub of subs) {
    out[sub] = {};
    try {
      const snap = await db.collection("scores").doc(sid).collection(sub).get();
      snap.forEach(d => {
        let data = d.data() || {};
        if (data.value && typeof data.value === "object" && !Array.isArray(data.value))
          data = Object.assign({}, data.value, { updatedAt: data.updatedAt });
        out[sub][d.id] = data;
        __scoreDocCache.set(cacheKey(sid, sub, d.id), data);
      });
    } catch(e) { console.warn(e); }
  }
  return out;
}
async function recomputeAndSaveScoreSummary(sid, cohortHint) {
  try {
    const maps = __MAPS_BUNDLE;
    const trees = await loadStudentScoreTreeCached(sid, ["homeworks","quizzes","exams","pastpapers"]);
    let cohort = cohortHint || "";
    if (!cohort) {
      try {
        const s = await db.collection("students").doc(sid).get();
        cohort = s.exists ? (s.data().cohort || "") : "";
      } catch(e) {}
    }
    const summary = computeSummaryFromTrees(maps, trees, cohort);
    const payload = Object.assign({}, summary, { cohort: cohort||"", updatedAt: new Date().toISOString() });
    await db.collection("scoreSummary").doc(sid).set(payload, { merge: true });
    __summaryCache.set(sid, payload);
    return payload;
  } catch(e) { console.warn("recomputeSummary", sid, e); return null; }
}
async function loadScoreSummaries(studentIds) {
  const out = {};
  const need = [];
  studentIds.forEach(sid => {
    if (__summaryCache.has(sid)) out[sid] = __summaryCache.get(sid);
    else need.push(sid);
  });
  for (let i=0; i<need.length; i+=20) {
    const slice = need.slice(i, i+20);
    await Promise.all(slice.map(async sid => {
      try {
        const snap = await db.collection("scoreSummary").doc(sid).get();
        if (snap.exists) { out[sid]=snap.data(); __summaryCache.set(sid, out[sid]); }
        else out[sid]=null;
      } catch(e) { out[sid]=null; }
    }));
  }
  return out;
}
async function ensureScoreSummaries(studentIds, studentsById) {
  const loaded = await loadScoreSummaries(studentIds);
  const missing = studentIds.filter(sid => {
    const s = loaded[sid];
    return !s || (s.hw==null && s.quiz==null && s.exam==null && s.overall==null);
  });
  for (const sid of missing) {
    const cohort = studentsById && studentsById[sid] ? studentsById[sid].cohort : undefined;
    const s = await recomputeAndSaveScoreSummary(sid, cohort);
    if (s) loaded[sid] = s;
  }
  return loaded;
}

function quizRecordHasScore(rec, map) {
  if (!rec || typeof rec !== "object") return false;
  const qs = map && Array.isArray(map.questions) ? map.questions : null;
  // 必須有題庫且至少一題有非空作答（與分數表 scoreOf 同一標準）
  if (!qs || !qs.length) return false;
  for (let i = 0; i < qs.length; i++) {
    const raw = rec[qs[i].id];
    if (raw === undefined || raw === null || String(raw).trim() === "") continue;
    return true;
  }
  return false;
}

/** 全班至少一人有真正作答的小測（用每人 quizzes 子集合一次讀完，避免誤判） */
async function findQuizzesWithClassScores(studentIds, quizIds, quizMaps) {
  const has = new Set();
  if (!studentIds?.length || !quizIds?.length) return has;
  const want = {};
  quizIds.forEach(id => { want[String(id)] = true; });
  for (const sid of studentIds) {
    try {
      const data = await loadAllQuizScoresForStudent(sid);
      Object.keys(data || {}).forEach(qid => {
        if (!want[String(qid)]) return;
        if (quizRecordHasScore(data[qid], quizMaps ? quizMaps[qid] : null)) {
          has.add(String(qid));
        }
      });
    } catch (e) { console.warn(e); }
  }
  return has;
}

/** 一次寫入多份 pastpaper（JSON import） */
async function savePastpaperMapsBulk(mapsObj) {
  const entries = Object.entries(mapsObj || {});
  let batch = db.batch(), ops = 0;
  const commit = async () => { if (!ops) return; await batch.commit(); batch = db.batch(); ops = 0; };
  for (const [id, data] of entries) {
    batch.set(db.collection("pastpaperMaps").doc(String(id)), { ...data, _id: id, updatedAt: new Date().toISOString() }, { merge: true });
    ops++;
    if (ops >= 400) await commit();
  }
  await commit();
}

/** DSE 模擬等級：參考近年 Chemistry 公開試表現分佈粗略對應卷面得分率 */
function estimateDseLevel(pct01) {
  const p = (pct01 == null || isNaN(pct01)) ? null : (pct01 > 1 ? pct01 / 100 : pct01);
  if (p == null) return { level: "—", color: "bg-slate-100 text-slate-500 border-slate-200", minPct: null };
  const pct = p * 100;
  // 粗略門檻（參考 MC 答對題數比例換算 + 實務校內用）
  if (pct >= 85) return { level: "5**", color: "bg-purple-100 text-purple-800 border-purple-300", minPct: 85 };
  if (pct >= 78) return { level: "5*", color: "bg-indigo-100 text-indigo-800 border-indigo-300", minPct: 78 };
  if (pct >= 67) return { level: "5", color: "bg-blue-100 text-blue-800 border-blue-300", minPct: 67 };
  if (pct >= 55) return { level: "4", color: "bg-sky-100 text-sky-800 border-sky-300", minPct: 55 };
  if (pct >= 40) return { level: "3", color: "bg-emerald-100 text-emerald-800 border-emerald-300", minPct: 40 };
  if (pct >= 30) return { level: "2", color: "bg-amber-100 text-amber-900 border-amber-300", minPct: 30 };
  if (pct >= 20) return { level: "1", color: "bg-orange-100 text-orange-800 border-orange-300", minPct: 20 };
  return { level: "U", color: "bg-rose-100 text-rose-800 border-rose-300", minPct: 0 };
}

/** 是否高中卷：S4/S5/S6 用 MC35%+LQ65%；S3／初中用卷面直接加總 */
function isSeniorExamMap(map, examId) {
  const titleStr = String((examId || "") + " " + (map && map.title || "")).toUpperCase();
  if (titleStr.includes("S3") || titleStr.includes("中三") || titleStr.includes("初中")) return false;
  if (titleStr.includes("S4") || titleStr.includes("S5") || titleStr.includes("S6") || titleStr.includes("高中") || titleStr.includes("DSE")) return true;
  return true; // 化學預設高中加權
}

/** 計算考試加權分（高中 MC35%+LQ65%；初中卷面%；單類則卷面%） */
function calcExamWeightedFromRec(map, rec, examId) {
  if (!map || !map.questions) return null;
  const qList = map.questions;
  let mcScore = 0, mcMax = 0, lqScore = 0, lqMax = 0, any = false;
  qList.forEach(q => {
    const max = q.max || 1;
    if (q.type === "MC") mcMax += max; else lqMax += max;
    const raw = rec && rec[q.id];
    if (raw === undefined || raw === null || String(raw).trim() === "") return;
    any = true;
    const sc = quizQuestionScore(q, raw);
    if (sc == null) return;
    if (q.type === "MC") mcScore += sc; else lqScore += sc;
  });
  if (!any) return null;
  const total = mcScore + lqScore;
  const totalMax = mcMax + lqMax;
  const senior = isSeniorExamMap(map, examId);
  let weighted = totalMax > 0 ? (total / totalMax) * 100 : 0;
  if (senior && mcMax > 0 && lqMax > 0) {
    weighted = ((mcScore / mcMax) * 0.35 + (lqScore / lqMax) * 0.65) * 100;
  }
  return { weighted, total, max: totalMax, mcScore, mcMax, lqScore, lqMax, isSenior: senior };
}

function quizQuestionScore(q, raw) {
  if (raw === undefined || raw === null || String(raw).trim() === "") return null;
  if (q.type === "MC") {
    if (!q.ans) return 0;
    const corrects = q.ans.toString().split(",").map(a => a.trim().toUpperCase());
    return corrects.includes(String(raw).trim().toUpperCase()) ? (q.max || 1) : 0;
  }
  const n = parseFloat(raw);
  return isNaN(n) ? 0 : n;
}

async function clearCollectionDocs(colName) {
  let total = 0;
  // 分頁刪，避免一次 get 過大
  while (true) {
    const snap = await db.collection(colName).limit(400).get();
    if (snap.empty) break;
    let batch = db.batch(), ops = 0;
    for (const d of snap.docs) {
      batch.delete(d.ref);
      ops++;
    }
    if (ops) await batch.commit();
    total += ops;
    if (snap.size < 400) break;
  }
  return total;
}

async function clearAllFirestoreData(logm) {
  // Firestore 重點：父文件刪了，子集合仍可存在；collection("scores").get() 掃不到「無父文件」的孤兒。
  // 必須用 collectionGroup 清 homeworks/quizzes/exams/pastpapers。

  async function deleteByCollectionGroup(groupName) {
    let total = 0;
    for (let guard = 0; guard < 100; guard++) {
      const snap = await db.collectionGroup(groupName).limit(400).get();
      if (snap.empty) break;
      const batch = db.batch();
      snap.docs.forEach(d => batch.delete(d.ref));
      await batch.commit();
      total += snap.size;
      logm("  · collectionGroup/" + groupName + " 本批 ×" + snap.size);
      if (snap.size < 400) break;
    }
    return total;
  }

  logm("以 collectionGroup 清除所有成績子集合（含孤兒路徑 S3A-04 等）…");
  for (const sub of ["pastpapers", "homeworks", "quizzes", "exams"]) {
    try {
      const n = await deleteByCollectionGroup(sub);
      logm("✓ " + sub + " 共刪 " + n);
    } catch (e) {
      logm("⚠ collectionGroup " + sub + "：" + (e.message || e));
      logm("  （若提示 index，請到 Firebase 依連結建立 collection group 索引後再清一次）");
    }
  }

  logm("清除 scores 根文件…");
  let scoreRootCount = 0;
  for (let round = 0; round < 30; round++) {
    const scoreRoots = await db.collection("scores").limit(100).get();
    if (scoreRoots.empty) break;
    const batch = db.batch();
    scoreRoots.docs.forEach(d => batch.delete(d.ref));
    await batch.commit();
    scoreRootCount += scoreRoots.size;
    if (scoreRoots.size < 100) break;
  }
  logm("✓ scores 根 ×" + scoreRootCount);

  logm("清除 scoreSummary…");
  try {
    const sumN = await clearCollectionDocs("scoreSummary");
    logm("✓ scoreSummary (" + sumN + ")");
  } catch (e) { logm("⚠ scoreSummary：" + (e.message || e)); }

  try {
    if (typeof __scoreDocCache !== "undefined") __scoreDocCache.clear();
    if (typeof __summaryCache !== "undefined") __summaryCache.clear();
    logm("✓ 已清空記憶體 cache");
  } catch (e) {}

  const cols = [
    "students",
    "homeworkMaps", "quizMaps", "examMaps", "pastpaperMaps",
    "quizMakeup", "examMakeup",
    "syllabus", "meta", "continuousAssess",
    "pastpaperScores", "remediationProgress", "homeworkScores", "examScores", "quizScores"
  ];
  for (const c of cols) {
    logm("清除 " + c + "…");
    try {
      const n = await clearCollectionDocs(c);
      logm("✓ " + c + " (" + n + ")");
    } catch (e) {
      logm("⚠ " + c + "：" + (e && e.message ? e.message : e));
    }
  }

  // 驗證 collectionGroup
  logm("驗證殘留…");
  let left = 0;
  for (const sub of ["pastpapers", "homeworks", "quizzes", "exams"]) {
    try {
      const snap = await db.collectionGroup(sub).limit(3).get();
      left += snap.size;
      if (snap.size) logm("⚠ 仍有 " + sub + " 例如 " + snap.docs[0].ref.path);
    } catch (e) {
      logm("⚠ 驗證 " + sub + "：" + (e.message || e));
    }
  }
  if (!left) logm("✓ 驗證：成績子集合無殘留（抽樣）");
  else logm("⚠ 仍有殘留，請看上方路徑或索引錯誤後再清");
  logm("全部清除流程結束");
}

async function migrateStudentId(oldId, newId, studentPatch) {
  const oldRef = db.collection("students").doc(oldId);
  const newRef = db.collection("students").doc(newId);
  const oldSnap = await oldRef.get();
  if (!oldSnap.exists) throw new Error("找不到舊學生 " + oldId);
  const data = { ...oldSnap.data(), ...studentPatch, id: newId, sid: newId };
  await newRef.set(data, { merge: true });
  // move score subcollections
  for (const sub of ["homeworks", "quizzes", "exams", "pastpapers"]) {
    const snap = await db.collection("scores").doc(oldId).collection(sub).get();
    for (const doc of snap.docs) {
      await db.collection("scores").doc(newId).collection(sub).doc(doc.id).set(doc.data(), { merge: true });
      await doc.ref.delete();
    }
  }
  await oldRef.delete();
}

function ImportView({ onReload }) {
  const [json, setJson] = useState("");
  const [url, setUrl] = useState("");
  const [log, setLog] = useState("");
  const [stats, setStats] = useState(null);

  useEffect(() => {
    (async () => {
      try {
        const stu = await db.collection("students").get();
        const hw = await db.collection("homeworkMaps").get();
        const mig = await db.collection("meta").doc("migration").get();
        setStats({ students: stu.size, hw: hw.size, last: mig.exists ? mig.data().lastImportAt : null });
      } catch(e) { setStats({ error: e.message }); }
    })();
  }, []);

  const importPayload = async (payload) => {
    const logm = (m) => setLog(p => p + m + "\n");
    setLog("");
    let batch = db.batch(), ops = 0;
    const commit = async () => { if (!ops) return; await batch.commit(); batch = db.batch(); ops = 0; };
    const students = Array.isArray(payload.students) ? payload.students : [];
    logm(`學生 ${students.length}…`);
    // Sheet 舊 key（S4A-3）→ 正規 sid（s23070012）；成績一律寫到 sid 下
    const idToSid = {};
    for (const s of students) {
      if (!s?.id && !s?.sid) continue;
      const legacyId = String(s.id || s.sid);
      const realSid = String(s.sid || s.id);
      idToSid[legacyId] = realSid;
      idToSid[realSid] = realSid;
      batch.set(db.collection("students").doc(realSid), {
        id: realSid,
        sid: realSid,
        legacyId,
        class: s.class||"", num: s.num??"", name: s.name||"",
        cohort: s.cohort||"", pin: (s.pin!=null && s.pin!=="") ? s.pin : "", active: s.active!==false,
        updatedAt: new Date().toISOString()
      }, { merge: true });
      ops++; if (ops>=400) await commit();
    }
    await commit();
    logm("✓ 學生（以 sid 為文件 ID）");

    const writeMaps = async (col, obj) => {
      const data = obj||{};
      logm(`${col} ${Object.keys(data).length}…`);
      for (const k of Object.keys(data)) {
        batch.set(db.collection(col).doc(String(k)), { ...data[k], _id:k, updatedAt: new Date().toISOString() }, { merge:true });
        ops++; if (ops>=400) await commit();
      }
      await commit();
      logm("✓ "+col);
    };
    await writeMaps("homeworkMaps", payload.homeworkMaps);
    await writeMaps("quizMaps", payload.quizMaps);
    await writeMaps("examMaps", payload.examMaps);
    await writeMaps("pastpaperMaps", payload.pastpaperMaps);
    if (payload.syllabus) await db.collection("syllabus").doc("all").set({ data: payload.syllabus, updatedAt: new Date().toISOString() }, { merge:true });

    const writeScores = async (tree, sub) => {
      const root = tree||{};
      logm(`${sub}…`);
      for (const key of Object.keys(root)) {
        const scoreSid = idToSid[key] || key;
        for (const pid of Object.keys(root[key]||{})) {
          const val = root[key][pid];
          const doc = (val && typeof val==="object" && !Array.isArray(val)) ? { ...val } : { value: val };
          batch.set(db.collection("scores").doc(scoreSid).collection(sub).doc(String(pid)), { ...doc, updatedAt: new Date().toISOString() }, { merge:true });
          ops++; if (ops>=400) await commit();
        }
      }
      await commit();
      logm("✓ "+sub);
    };
    await writeScores(payload.homeworkScores, "homeworks");
    await writeScores(payload.scores, "quizzes");
    await writeScores(payload.examScores, "exams");
    await writeScores(payload.pastpaperScores, "pastpapers");

function IdMapView({ students, onReload }) {
  const [text, setText] = useState("");
  const [log, setLog] = useState("");

  const run = async () => {
    setLog("");
    const lines = text.trim().split("\n").map(l=>l.trim()).filter(Boolean);
    let ok=0, skip=0, fail=0;
    for (const line of lines) {
      let cls, num, newId;
      if (line.includes("\t")) {
        const p = line.split("\t").map(x=>x.trim());
        if (p.length>=3) { cls=p[0]; num=p[1]; newId=p[2]; }
      } else if (line.includes(",")) {
        const p = line.split(",").map(x=>x.trim());
        if (p.length===2 && p[0].includes("-")) {
          const m = p[0].match(/^([A-Za-z0-9]+)-(\d+)$/);
          if (m) { cls=m[1]; num=m[2]; newId=p[1]; }
        } else if (p.length>=3) { cls=p[0]; num=p[1]; newId=p[2]; }
      } else {
        const p = line.split(/\s+/).filter(Boolean);
        if (p.length>=3) { cls=p[0]; num=p[1]; newId=p[2]; }
      }
      if (!cls || num===undefined || !newId) {
        setLog(l=>l+`略過無法解析：${line}\n`); skip++; continue;
      }
      newId = String(newId).trim();
      const match = students.find(s => String(s.class)===String(cls) && String(s.num)===String(num));
      if (!match) {
        setLog(l=>l+`略過（系統無此學生）：${cls}-${num}\n`);
        skip++;
        continue;
      }
      if (match.id === newId) {
        setLog(l=>l+`已是 ${newId}（${cls}-${num} ${match.name||""}）\n`); ok++; continue;
      }
      try {
        await migrateStudentId(match.id, newId, { class: cls, num: isNaN(Number(num))?num:Number(num) });
        setLog(l=>l+`✓ 遷移 ${match.id} → ${newId}（${cls}-${num} ${match.name||""}）\n`);
        ok++;
      } catch(e) { setLog(l=>l+`失敗 ${line}: ${e.message}\n`); fail++; }
    }
    setLog(l=>l+`\n完成：更新 ${ok}，略過 ${skip}，失敗 ${fail}\n（只更新現有學生，不會新增）\n`);
    if (onReload) onReload();
  };

  return (
    <div className="max-w-3xl space-y-4">
      <div className="bg-white rounded-2xl border p-5 space-y-3">
        <h2 className="font-bold text-lg">學生 ID 對照補齊</h2>
        <p className="text-sm text-slate-600 leading-relaxed">
          只會<strong>更新系統裡已有的學生</strong>（以班別+學號對上），全校名單貼上沒問題，找不到的會略過、不會新增。<br/>
          目標主鍵：<b className="mono">s12345678</b>。每行：
          <code className="bg-slate-100 px-1">S4A	3	s12345678</code> 或 <code className="bg-slate-100 px-1">S4A-3,s12345678</code>
        </p>
        <textarea className="w-full h-48 border rounded-xl p-3 text-sm mono" value={text} onChange={e=>setText(e.target.value)}
          placeholder={"S4A\t3\ts12345678\nS4A-5,s12345679"} />
        <button className="bg-indigo-600 text-white font-bold px-4 py-2 rounded-lg text-sm" onClick={run}>執行對照（只更新現有）</button>
        <pre className="bg-slate-900 text-emerald-400 text-xs p-3 rounded-xl h-40 overflow-auto mono">{log||"// 結果"}</pre>
      </div>
      <div className="bg-white rounded-2xl border p-5">
        <h3 className="font-bold mb-2 text-sm">目前學生（前 50）</h3>
        <div className="overflow-auto max-h-64 text-xs">
          <table className="min-w-full">
            <thead><tr className="text-left text-slate-500">{["ID","班","號","姓名"].map(h=><th key={h} className="px-2 py-1">{h}</th>)}</tr></thead>
            <tbody>
              {students.slice(0,50).map(s=>(
                <tr key={s.id} className="border-t">
                  <td className="px-2 py-1 mono font-bold">{s.id}</td>
                  <td className="px-2 py-1">{s.class}</td>
                  <td className="px-2 py-1">{s.num}</td>
                  <td className="px-2 py-1">{s.name}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function HwSettingsView({ students, homeworkMaps, setHomeworkMaps, currentCohort }) {
  const cohorts = useMemo(() => Array.from(new Set(students.map(s=>s.cohort).filter(Boolean))).sort(), [students]);
  const [selectedCohort, setSelectedCohort] = useState(currentCohort || cohorts[0] || "");
  const [hwId, setHwId] = useState("");
  const [hwTitle, setHwTitle] = useState("");
  const [pasteData, setPasteData] = useState("");
  const [editingOriginalId, setEditingOriginalId] = useState(null);
  const [busy, setBusy] = useState(false);

  const filtered = Object.keys(homeworkMaps||{}).filter(id => !homeworkMaps[id].cohort || homeworkMaps[id].cohort===selectedCohort).sort();

  const parseLines = (text) => {
    return text.trim().split("\n").map(line => {
      const clean = line.trim(); if (!clean) return null;
      let cols = clean.split("\t").map(c=>c.trim());
      if (cols.length < 6) {
        const multi = clean.split(/\s{2,}/).map(c=>c.trim()).filter(Boolean);
        if (multi.length>=6) cols = multi;
      }
      if (cols.length < 6) {
        const parts = clean.split(/\s+/).filter(Boolean);
        if (parts.length>=6) {
          const last = parts[parts.length-1];
          const isAns = /^[A-Da-d]([,]\s*[A-Da-d])*$/.test(last);
          let ans="", descParts=parts.slice(5);
          if (isAns) { ans=last.toUpperCase().replace(/\s+/g,""); descParts=parts.slice(5,-1); }
          cols = [parts[0],parts[1],parts[2],parts[3],parts[4],descParts.join(" "),ans];
        }
      }
      let maxScore = parseFloat(cols[2]); if (isNaN(maxScore)||maxScore<=0) maxScore=1;
      return {
        id: (cols[0]||"").trim(), type: (cols[1]||"LQ").toUpperCase(), max: maxScore,
        level: (cols[3]||"中").trim(), topicId: (cols[4]||"").trim(),
        topicDesc: (cols[5]||"").trim(), ans: (cols[6]||"").trim().toUpperCase()
      };
    }).filter(q => q && q.id && !String(q.id).includes("題目ID"));
  };

  const handleSave = async () => {
    if (!hwId || !hwTitle || !pasteData || !selectedCohort) return alert("請填寫完整");
    const questions = parseLines(pasteData);
    if (!questions.length) return alert("無法解析題目");
    const newId = hwId.trim();
    const oldId = editingOriginalId;
    setBusy(true);
    try {
      const data = { title: hwTitle, cohort: selectedCohort, questions };
      await saveHomeworkMap(newId, data);
      const next = { ...homeworkMaps, [newId]: { ...data, _id: newId } };
      if (oldId && oldId !== newId) {
        // migrate scores
        const stuSnap = await db.collection("students").get();
        for (const d of stuSnap.docs) {
          const ref = db.collection("scores").doc(d.id).collection("homeworks").doc(oldId);
          const snap = await ref.get();
          if (snap.exists) {
            await db.collection("scores").doc(d.id).collection("homeworks").doc(newId).set(snap.data(), { merge:true });
            await ref.delete();
          }
        }
        await deleteHomeworkMap(oldId);
        delete next[oldId];
      }
      setHomeworkMaps(next);
      setHwId(""); setHwTitle(""); setPasteData(""); setEditingOriginalId(null);
      alert("已儲存 " + newId);
    } catch(e) { alert(e.message); }
    setBusy(false);
  };

  const handleDelete = async (id) => {
    if (!confirm("刪除功課 "+id+" 及其成績？")) return;
    setBusy(true);
    try {
      await deleteHomeworkMap(id);
      const stuSnap = await db.collection("students").get();
      for (const d of stuSnap.docs) {
        try { await deleteHomeworkScore(d.id, id); } catch(_){}
      }
      const next = { ...homeworkMaps }; delete next[id];
      setHomeworkMaps(next);
    } catch(e) { alert(e.message); }
    setBusy(false);
  };

  
  const buildCsvPrompt = () => {

【絕對禁止】不要表格、Markdown 或說明，只輸出題目行。topicId 不可自創，必須對應課程大綱。`;
  };

  const copyPrompt = () => {
    navigator.clipboard.writeText(buildCsvPrompt()).then(()=>alert("已複製 AI Prompt！貼到 Gemini / ChatGPT，上傳功課後即可生成可貼上的表格。")).catch(()=>alert("複製失敗，請手動全選 Prompt"));

  const loadEdit = (id) => {

    setEditingOriginalId(id);
    setSelectedCohort(hw.cohort||selectedCohort);
  };

  return (
    <div className="grid lg:grid-cols-2 gap-4">
      <div className="bg-white rounded-2xl border p-4 space-y-2">
        <div className="flex justify-between items-center">
          <h2 className="font-bold">功課設定</h2>
          <select className="border rounded px-2 py-1 text-sm" value={selectedCohort} onChange={e=>setSelectedCohort(e.target.value)}>
            {cohorts.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
        </div>
        <div className="space-y-1 max-h-[70vh] overflow-auto">
          {filtered.map(id => (
            <div key={id} className="border rounded-xl p-3 flex justify-between gap-2 items-start hover:bg-slate-50">
              <div className="min-w-0">
                <div className="font-bold text-sm mono text-indigo-700">{id}</div>
                <div className="text-sm font-semibold truncate">{homeworkMaps[id].title}</div>
                <div className="text-[11px] text-slate-400">{(homeworkMaps[id].questions||[]).length} 題 · {homeworkMaps[id].cohort}</div>
              </div>
              <div className="flex gap-1 shrink-0">
                <button className="text-xs px-2 py-1 bg-indigo-50 text-indigo-700 rounded font-bold" onClick={()=>loadEdit(id)}>編輯</button>
                <button className="text-xs px-2 py-1 bg-rose-50 text-rose-700 rounded font-bold" onClick={()=>handleDelete(id)}>刪</button>
              </div>
            </div>
          ))}
          {!filtered.length && <p className="text-slate-400 text-sm p-4">此群組尚無功課</p>}
        </div>
      </div>

          {cohorts.map(c=><option key={c} value={c}>{c}</option>)}
        </select>
        <textarea className="w-full h-56 border rounded-xl p-3 text-xs mono" placeholder="題目ID	題型	滿分	深淺	topicId	描述	答案" value={pasteData} onChange={e=>setPasteData(e.target.value)} />

        </div>
      </div>
    </div>
  );
}
