function PastpaperSettingsView({ pastpaperMaps, setPastpaperMaps }) {
  const [jsonText, setJsonText] = useState("");
  const [status, setStatus] = useState("");
  const [busy, setBusy] = useState(false);
  const [selectedId, setSelectedId] = useState("");

  const listIds = useMemo(() => Object.keys(pastpaperMaps || {}).sort().reverse(), [pastpaperMaps]);

  useEffect(() => {
    if (Object.keys(pastpaperMaps || {}).length) {
      // 不自動覆寫 textarea，避免打字中被洗
    } else if (!jsonText) {
      setJsonText(`{
  "2014-P1A": {
    "title": "2014 HKDSE Chemistry - Paper 1A (MC)",
    "questions": [
      { "id": "2014-MC-01", "type": "MC", "max": 1, "level": "中", "topicId": "1.1.1", "topicDesc": "示例描述", "ans": "A" }
    ]
  }
}`);
    }
  }, []);

  const loadOne = (id) => {
    const m = pastpaperMaps[id];
    if (!m) return;
    setSelectedId(id);
    setJsonText(JSON.stringify({ [id]: { title: m.title, questions: m.questions || [], cohort: m.cohort || "" } }, null, 2));
  };

  const handleImport = async () => {
    let parsed;
    try {
      parsed = JSON.parse(jsonText);
    } catch (e) {
      return alert("JSON 格式錯誤：" + e.message);
    }
    if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
      return alert("頂層必須是物件：{ \"2014-P1A\": { title, questions }, ... }");
    }
    setBusy(true);
    setStatus("儲存中…");
    try {
      // normalize each paper
      const clean = {};
      Object.entries(parsed).forEach(([id, data]) => {
        if (!data || typeof data !== "object") return;
        clean[id] = {
          title: data.title || id,
          questions: Array.isArray(data.questions) ? data.questions : [],
          cohort: data.cohort || ""
        };
      });
      await savePastpaperMapsBulk(clean);
      setPastpaperMaps(prev => ({ ...prev, ...Object.fromEntries(Object.entries(clean).map(([k,v]) => [k, { ...v, _id: k }])) }));
      setStatus(`✅ 已匯入 ${Object.keys(clean).length} 份試卷`);
      alert(`已匯入 ${Object.keys(clean).length} 份 Pastpaper 至 Firebase`);
    } catch (e) {
      setStatus("❌ " + e.message);
      alert(e.message);
    }
    setBusy(false);
  };

  const handleDelete = async (id) => {
    if (!confirm("刪除題庫「" + id + "」？（成績不會自動刪）")) return;
    setBusy(true);
    try {
      await deletePastpaperMap(id);
      const next = { ...pastpaperMaps };
      delete next[id];
      setPastpaperMaps(next);
      if (selectedId === id) setSelectedId("");
    } catch (e) { alert(e.message); }
    setBusy(false);
  };

  const buildPrompt = () => {
    const syllabus = getSyllabusTableText();
    return `【身份】你是一位專門為香港高中化學（HKDSE）出題與分析的老師，學生程度為 Band 3。

【任務】我會上傳一份 HKDSE 化學科歷屆試卷（Paper 1A / 1B / 2 的 PDF、Word 或圖片）。請分析整份試卷，生成結構化 JSON，方便直接匯入學校系統的 Pastpaper 題庫。

【課程大綱對照表（請嚴格按此表選填 topicId）】
${syllabus}

【輸出格式】
只輸出一個合法 JSON 物件（不要 Markdown、不要說明文字），格式：

{
  "{年份}-P1A": {
    "title": "{年份} HKDSE Chemistry - Paper 1A (MC)",
    "questions": [ ... ]
  },
  "{年份}-P1B": {
    "title": "{年份} HKDSE Chemistry - Paper 1B (LQ)",
    "questions": [ ... ]
  },
  "{年份}-P2": {
    "title": "{年份} HKDSE Chemistry - Paper 2 (Electives)",
    "questions": [ ... ]
  }
}

每個 question：
- id: 字串
- type: "MC" 或 "LQ"
- max: 數字
- level: "淺" | "中" | "深"
- topicId: 從上方大綱選用（如 "2.3.3"、"E3.2.1"）
- topicDesc: 20–30 字中文描述（自擬，勿抄大綱長句）
- ans: MC 填 A/B/C/D；LQ 填 ""

【題目 ID】
1. Paper 1A：{年份}-MC-{兩位題號}，例 2014-MC-01
2. Paper 1B：{年份}-LQ-{大題兩位}{小題}，例 2014-LQ-01a、2014-LQ-02bi
3. Paper 2（只處理 E3、E4）：
   - MC：{年份}-MC-E{3|4}-{兩位題號}
   - LQ：{年份}-LQ-E{3|4}-{大題}{小題}

【滿分】MC=1；LQ 按卷面分數，無標示則 1–4。
【難度】針對 Band 3：淺／中／深。

【絕對禁止】不要 json 程式碼圍欄或說明，只輸出可被 JSON.parse 的純 JSON。`;
  };

  return (
    <div className="space-y-4">
      <div className="bg-indigo-50 border border-indigo-200 rounded-xl p-3 text-sm text-indigo-900">
        <b>新增 Pastpaper：</b>用下方 AI Prompt 生成 JSON → 貼到右側「匯入／編輯 JSON」→ 按「匯入到 Firebase」。可一次貼多年份／多卷（頂層多個 key）。左側列表點選可預覽已有卷。
      </div>
      <div className="grid lg:grid-cols-5 gap-4">
        <div className="lg:col-span-2 bg-white rounded-2xl border p-4 space-y-3">
          <h2 className="font-bold text-lg text-indigo-800">已匯入題庫</h2>
          <p className="text-sm text-slate-500">共 {listIds.length} 份。點選可載入 JSON 預覽。</p>
          <div className="max-h-[65vh] overflow-auto space-y-2">
            {listIds.map(id => {
              const m = pastpaperMaps[id];
              return (
                <div key={id} className={`border rounded-xl p-3 ${selectedId===id?"border-indigo-400 bg-indigo-50":"border-slate-200"}`}>
                  <button className="w-full text-left" onClick={() => loadOne(id)}>
                    <div className="font-bold mono text-indigo-700">{id}</div>
                    <div className="text-sm font-semibold truncate">{m.title}</div>
                    <div className="text-xs text-slate-500">{(m.questions||[]).length} 題</div>

          </div>

          <h2 className="font-bold text-lg">匯入／編輯 JSON</h2>
          <p className="text-sm text-slate-600">頂層為物件，key 為試卷編號（如 <span className="mono">2014-P1A</span>），value 含 title、questions。</p>
          <textarea className="w-full h-80 border-2 rounded-xl p-3 text-xs mono" value={jsonText} onChange={e=>setJsonText(e.target.value)} />

        <button className="bg-violet-600 hover:bg-violet-700 text-white font-black px-6 py-3 rounded-xl text-base"

  );

function ClassRankingView({ activeStudents, currentCohort, homeworkMaps, quizMaps, examMaps, pastpaperMaps }) {
  const [rankTab, setRankTab] = useState("composite");
  const [leaderboardMonth, setLeaderboardMonth] = useState("all");
  const [summaries, setSummaries] = useState({});
  const [trees, setTrees] = useState({}); // 僅 Pastpaper 分頁需要時才載
  const [loading, setLoading] = useState(false);

  useEffect(() => {
    if (!activeStudents.length) { setSummaries({}); return; }
    let cancelled = false;
    (async () => {
      setLoading(true);
      try {
        setMapsBundle({
          homework: homeworkMaps || {},
          quiz: quizMaps || {},
          exam: examMaps || {},
          pastpaper: pastpaperMaps || {}
        });
        const byId = {};
        activeStudents.forEach(s => { byId[s.id] = s; });
        const next = await ensureScoreSummaries(activeStudents.map(s => s.id), byId);
        if (!cancelled) setSummaries(next);
      } catch (e) { console.warn(e); }
      if (!cancelled) setLoading(false);
    })();
    return () => { cancelled = true; };
  }, [activeStudents.map(s => s.id).join(","), currentCohort]);

  // Pastpaper 分頁才懶載入成績樹（避免一進排行就爆讀取）
  useEffect(() => {
    if (rankTab !== "pastpaper" || !activeStudents.length) return;
    if (Object.keys(trees).length) return;
    let cancelled = false;
    (async () => {
      setLoading(true);
      try {
        const next = {};
        const ids = activeStudents.map(s => s.id);
        for (let i = 0; i < ids.length; i += 8) {
          const slice = ids.slice(i, i + 8);
          await Promise.all(slice.map(async sid => {
            next[sid] = await loadStudentScoreTreeCached(sid, ["pastpapers"]);
          }));
        }
        if (!cancelled) setTrees(next);
      } catch (e) { console.warn(e); }
      if (!cancelled) setLoading(false);
    })();
    return () => { cancelled = true; };
  }, [rankTab, activeStudents.map(s => s.id).join(",")]);

  const scoreOf = (val, q) => {
    if (val === undefined || val === null || String(val).trim() === "") return null;
    if (q.type === "MC") {
      if (!q.ans) return null;
      const corrects = q.ans.toString().split(",").map(a => a.trim().toUpperCase());
      return corrects.includes(String(val).trim().toUpperCase()) ? (q.max || 1) : 0;
    }
    const n = parseFloat(val);
    return isNaN(n) ? 0 : n;
  };

  const calcCategoryPct = (sId, category) => {
    const s = summaries[sId];
    if (!s) return null;
    if (category === "homework") return s.hw != null ? s.hw : null;
    if (category === "quiz") return s.quiz != null ? s.quiz : null;
    if (category === "exam") return s.exam != null ? s.exam : null;
    return null;
  };

  const schoolRankings = useMemo(() => {
    const peers = activeStudents || [];
    const build = (cat) => peers.map(s => {
      const pct = calcCategoryPct(s.id, cat);
      return { student: s, pct, score: pct === null ? -1 : pct };
    }).filter(r => r.pct !== null).sort((a, b) => b.pct - a.pct);

    const BASE_W = { homework: 0.2, quiz: 0.3, exam: 0.5 };
    const composite = peers.map(s => {
      const hw = calcCategoryPct(s.id, "homework");
      const qz = calcCategoryPct(s.id, "quiz");
      const ex = calcCategoryPct(s.id, "exam");
      const parts = [];
      if (hw !== null) parts.push({ w: BASE_W.homework, v: hw });
      if (qz !== null) parts.push({ w: BASE_W.quiz, v: qz });
      if (ex !== null) parts.push({ w: BASE_W.exam, v: ex });
      if (!parts.length) return { student: s, pct: null, detail: { hw, qz, ex } };
      const wSum = parts.reduce((a, p) => a + p.w, 0);
      const pct = parts.reduce((a, p) => a + (p.w / wSum) * p.v, 0);
      return { student: s, pct, detail: { hw, qz, ex } };
    }).filter(r => r.pct !== null).sort((a, b) => b.pct - a.pct);

    return { homework: build("homework"), quiz: build("quiz"), exam: build("exam"), composite };
  }, [activeStudents, summaries, homeworkMaps, quizMaps, examMaps]);

  const availableMonths = useMemo(() => {
    const months = new Set();
    (activeStudents || []).forEach(s => {
      Object.values(trees[s.id]?.pastpapers || {}).forEach(r => {
        if (r && r._submitMonth) months.add(r._submitMonth);
      });
    });
    return Array.from(months).sort().reverse();
  }, [activeStudents, trees]);

  const pastpaperBoard = useMemo(() => {
    return (activeStudents || []).map(s => {
      const sScores = trees[s.id]?.pastpapers || {};
      let totalQ = 0, earned = 0, max = 0;
      Object.keys(sScores).forEach(pid => {
        const rec = sScores[pid];
        if (leaderboardMonth !== "all" && rec?._submitMonth !== leaderboardMonth) return;
        const map = pastpaperMaps[pid];
        if (!map?.questions) return;
        map.questions.forEach(q => {
          const val = rec[q.id];
          if (val === undefined || val === null || String(val).trim() === "") return;
          totalQ++;
          max += q.max || 0;
          const sc = scoreOf(val, q);
          if (sc !== null) earned += sc;
        });
      });
      const accuracy = max > 0 ? earned / max : 0;
      return { student: s, totalQuestions: totalQ, accuracy, pct: accuracy };
    }).filter(r => r.totalQuestions > 0).sort((a, b) => b.totalQuestions - a.totalQuestions || b.accuracy - a.accuracy);
  }, [activeStudents, trees, pastpaperMaps, leaderboardMonth]);

  const board = rankTab === "pastpaper" ? pastpaperBoard
    : rankTab === "homework" ? schoolRankings.homework
    : rankTab === "quiz" ? schoolRankings.quiz
    : rankTab === "exam" ? schoolRankings.exam
    : schoolRankings.composite;

  const medal = (idx) => idx === 0 ? "🥇" : idx === 1 ? "🥈" : idx === 2 ? "🥉" : String(idx + 1);

  return (
    <div className="space-y-4 max-w-4xl">
      <div>
        <h2 className="font-bold text-xl text-amber-700">群組戰力排行榜</h2>
        <p className="text-sm text-slate-500">
          目前群組：<b className="text-indigo-700">{currentCohort || "所有學生"}</b>（共 {(activeStudents || []).length} 人）
          · 綜合 = 功課 20% + 小測 30% + 統考 50%（缺項自動重算權重）
        </p>
        {loading && <p className="text-xs text-slate-400 mt-1">載入全組成績中…</p>}
      </div>

      <div className="bg-white rounded-2xl border shadow-sm overflow-hidden">
        <div className="p-4 border-b flex flex-wrap gap-2 items-center">
          {[
            { id: "composite", label: "⭐ 綜合排名" },
            { id: "homework", label: "📖 功課" },
            { id: "quiz", label: "📝 小測" },
            { id: "exam", label: "🏫 統考" },

                  {isPP

            );

        </div>
      </div>
    </div>
  );
}

function ContinuousAssessView({ students, homeworkMaps, examMaps, currentCohort }) {
  const cohorts = useMemo(() => Array.from(new Set(students.map(s => s.cohort).filter(Boolean))).sort(), [students]);
  const [cohort, setCohort] = useState(currentCohort && currentCohort !== "所有學生" ? currentCohort : (cohorts[0] || ""));
  const [wUT, setWUT] = useState(50);
  const [wHW, setWHW] = useState(30);
  const [wCP, setWCP] = useState(20);
  const [utExamId, setUtExamId] = useState("");
  const [hwSel, setHwSel] = useState({});
  const [rows, setRows] = useState([]); // {id,class,num,name,ut,hw,cp,total}
  const [loading, setLoading] = useState(false);
  const [saveStatus, setSaveStatus] = useState("");
  const [sheetName, setSheetName] = useState("");
  const [savedList, setSavedList] = useState([]); // [{id, name, cohort, updatedAt, n}]
  const [loadPick, setLoadPick] = useState("");

  const refreshSavedList = async () => {
    try {
      const snap = await db.collection("continuousAssess").get();
      const list = [];
      snap.forEach(d => {
        const data = d.data() || {};
        list.push({
          id: d.id,
          name: data.name || d.id,
          cohort: data.cohort || "",
          updatedAt: data.updatedAt || "",
          n: Array.isArray(data.rows) ? data.rows.length : 0
        });
      });
      list.sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));
      setSavedList(list);
    } catch (e) { console.warn(e); }
  };

  useEffect(() => { refreshSavedList(); }, []);

  const cohortStudents = useMemo(() => {
    return students.filter(s => s.active !== false && (!cohort || s.cohort === cohort))
      .sort((a,b) => String(a.class).localeCompare(String(b.class)) || (Number(a.num)||0)-(Number(b.num)||0));
  }, [students, cohort]);

  const examIds = useMemo(() => Object.keys(examMaps || {}).filter(id => {
    const m = examMaps[id];
    if (!m) return false;
    if (!m.cohort || m.cohort === "" || m.cohort === "所有學生") return true;
    return m.cohort === cohort;
  }).sort(), [examMaps, cohort]);

  const hwIds = useMemo(() => Object.keys(homeworkMaps || {}).filter(id => {
    const m = homeworkMaps[id];
    if (!m) return false;
    if (!m.cohort || m.cohort === "" || m.cohort === "所有學生") return true;
    return m.cohort === cohort;
  }).sort(), [homeworkMaps, cohort]);

  useEffect(() => {
    if (examIds.length && !examIds.includes(utExamId)) setUtExamId(examIds[0] || "");
  }, [examIds]);

  useEffect(() => {
    setHwSel(prev => {
      const next = {};
      hwIds.forEach(id => { next[id] = prev[id] !== undefined ? prev[id] : true; });
      return next;
    });
  }, [hwIds.join("|")]);

  const scoreOf = (val, q) => {
    if (val === undefined || val === null || String(val).trim() === "") return null;
    if (q.type === "MC") {
      if (!q.ans) return null;
      const corrects = q.ans.toString().split(",").map(a => a.trim().toUpperCase());
      return corrects.includes(String(val).trim().toUpperCase()) ? (q.max || 1) : 0;
    }
    const n = parseFloat(val);
    return isNaN(n) ? 0 : n;
  };

  const compute = async () => {
    if (!cohortStudents.length) return alert("此群組沒有學生");
    if (!utExamId) return alert("請選擇 UT 考試");
    const selectedHw = hwIds.filter(id => hwSel[id]);
    setLoading(true);
    try {
      // load exam + hw scores
      const examPart = await loadExamScoresForExam(cohortStudents.map(s => s.id), utExamId);
      if (examPart.__meta) delete examPart.__meta;
      const hwScores = {};
      for (const hwId of selectedHw) {
        const part = await loadHomeworkScoresForHw(cohortStudents.map(s => s.id), hwId);
        Object.keys(part).forEach(sid => {
          if (!hwScores[sid]) hwScores[sid] = {};
          Object.assign(hwScores[sid], part[sid] || {});
        });
      }

      const examMap = examMaps[utExamId];
      const raws = cohortStudents.map(s => {
        // UT %
        let utPct = null;
        const erec = examPart[s.id]?.[utExamId];
        if (erec && examMap?.questions?.length) {
          let earned = 0, max = 0, any = false;
          examMap.questions.forEach(q => {
            max += q.max || 0;
            const sc = scoreOf(erec[q.id], q);
            if (sc === null) return;
            any = true;
            earned += sc;
          });
          if (any && max > 0) utPct = earned / max;
        }
        // HW average %
        let hwSum = 0, hwN = 0;
        selectedHw.forEach(hwId => {
          const map = homeworkMaps[hwId];
          if (!map?.questions?.length) return;
          const rec = hwScores[s.id]?.[hwId];
          if (rec && rec.remakeStatus === "EXEMPT") return;
          let max = 0;
          map.questions.forEach(q => { max += q.max || 0; });
          if (max <= 0) return;
          if (!rec || !rec.scores || !Object.keys(rec.scores).length) {
            hwSum += 0; hwN++; return;
          }
          let earned = 0;
          map.questions.forEach(q => {
            const sc = scoreOf(rec.scores[q.id], q);
            earned += sc === null ? 0 : sc;
          });
          hwSum += earned / max;
          hwN++;
        });
        const hwPct = hwN > 0 ? hwSum / hwN : null;
        // composite for curve
        let curveParts = [];
        if (utPct != null) curveParts.push(utPct);
        if (hwPct != null) curveParts.push(hwPct);
        const curveRaw = curveParts.length ? curveParts.reduce((a,b)=>a+b,0)/curveParts.length : null;
        return { s, utPct, hwPct, curveRaw };
      });

      const withRaw = raws.filter(r => r.curveRaw != null);
      const mean = withRaw.length ? withRaw.reduce((a,r)=>a+r.curveRaw,0)/withRaw.length : 0.65;

      const nextRows = raws.map(r => {
        // UT / HW as marks out of weight? Show as percentage scores scaled to component max
        const utMark = r.utPct == null ? null : +(r.utPct * wUT).toFixed(1);
        const hwMark = r.hwPct == null ? null : +(r.hwPct * wHW).toFixed(1);
        // class performance 0-20: mean 13
        let cp = 13;
        if (r.curveRaw != null) {
          cp = 13 + (r.curveRaw - mean) * 25; // sensitivity
          cp = Math.max(0, Math.min(20, Math.round(cp * 10) / 10));
        }
        // scale CP to wCP if wCP !== 20
        const cpWeighted = wCP === 20 ? cp : +(cp / 20 * wCP).toFixed(1);
        const parts = [];
        if (utMark != null) parts.push(utMark);
        if (hwMark != null) parts.push(hwMark);
        parts.push(cpWeighted);
        const total = +parts.reduce((a,b)=>a+b,0).toFixed(1);
        return {
          id: r.s.id, class: r.s.class, num: r.s.num, name: r.s.name,
          ut: utMark, hw: hwMark, cp: cpWeighted, total,
          utPct: r.utPct, hwPct: r.hwPct
        };
      });
      setRows(nextRows);
    } catch (e) { alert(e.message); }
    setLoading(false);
  };

  const updateCp = (sid, val) => {
    const n = parseFloat(val);
    setRows(prev => prev.map(r => {
      if (r.id !== sid) return r;
      const cp = isNaN(n) ? 0 : Math.max(0, Math.min(wCP, n));
      const parts = [];
      if (r.ut != null) parts.push(r.ut);
      if (r.hw != null) parts.push(r.hw);
      parts.push(cp);
      return { ...r, cp, total: +parts.reduce((a,b)=>a+b,0).toFixed(1) };
    }));
  };

  const saveSheet = async () => {
    if (!rows.length) return alert("請先計算");
    const name = (sheetName || "").trim();
    if (!name) return alert("請輸入底稿名稱，例如 2627T1A1");
    // doc id：只用安全字元
    const key = name.replace(/[\/\s]+/g, "_").replace(/[^\w\u4e00-\u9fff\-_.]/g, "");
    if (!key) return alert("名稱無效");
    setSaveStatus("儲存中…");
    try {
      // 還原完整列（含班號姓名）方便直接載入核對
      const fullRows = rows.map(r => ({
        id: r.id, class: r.class, num: r.num, name: r.name,
        ut: r.ut, hw: r.hw, cp: r.cp, total: r.total,
        utPct: r.utPct, hwPct: r.hwPct
      }));
      await db.collection("continuousAssess").doc(key).set({
        name,
        cohort: cohort || "",
        weights: { ut: wUT, hw: wHW, cp: wCP },
        utExamId,
        hwIds: hwIds.filter(id => hwSel[id]),
        rows: fullRows,
        updatedAt: new Date().toISOString()
      }, { merge: true });
      setSheetName(name);
      setSaveStatus("已儲存：「" + name + "」");
      await refreshSavedList();
      setTimeout(() => setSaveStatus(""), 2500);
    } catch (e) { setSaveStatus(""); alert(e.message); }
  };

  const loadSheet = async (docId) => {
    if (!docId) return alert("請選擇一份底稿");
    setSaveStatus("載入中…");
    try {
      const snap = await db.collection("continuousAssess").doc(docId).get();
      if (!snap.exists) return alert("找不到底稿");
      const data = snap.data() || {};
      setSheetName(data.name || docId);
      if (data.cohort) setCohort(data.cohort);
      if (data.weights) {
        if (data.weights.ut != null) setWUT(data.weights.ut);
        if (data.weights.hw != null) setWHW(data.weights.hw);
        if (data.weights.cp != null) setWCP(data.weights.cp);
      }
      if (data.utExamId) setUtExamId(data.utExamId);
      if (Array.isArray(data.hwIds)) {
        const sel = {};
        hwIds.forEach(id => { sel[id] = data.hwIds.includes(id); });
        // 保留已存但目前列表沒有的 id
        data.hwIds.forEach(id => { sel[id] = true; });
        setHwSel(sel);
      }
      const loaded = (data.rows || []).map(r => {
        // 補班名：若舊底稿只有 id
        const stu = students.find(s => s.id === r.id);
        return {
          id: r.id,
          class: r.class != null ? r.class : (stu?.class || ""),
          num: r.num != null ? r.num : (stu?.num ?? ""),
          name: r.name || stu?.name || r.id,
          ut: r.ut, hw: r.hw, cp: r.cp, total: r.total,
          utPct: r.utPct, hwPct: r.hwPct
        };
      });
      setRows(loaded);
      setLoadPick(docId);
      setSaveStatus("已載入：「" + (data.name || docId) + "」");
      setTimeout(() => setSaveStatus(""), 2500);
    } catch (e) { setSaveStatus(""); alert(e.message); }
  };

  const deleteSheet = async (docId) => {
    if (!docId) return;
    if (!confirm("刪除底稿「" + docId + "」？")) return;
    try {
      await db.collection("continuousAssess").doc(docId).delete();
      if (loadPick === docId) setLoadPick("");
      await refreshSavedList();
      alert("已刪除");
    } catch (e) { alert(e.message); }
  };

  const exportCsv = () => {
    const header = ["班別","號","姓名","學生ID","UT("+wUT+")","HW("+wHW+")","課堂("+wCP+")","總分"];
    const body = rows.map(r => [r.class, r.num, r.name, r.id, r.ut ?? "", r.hw ?? "", r.cp ?? "", r.total ?? ""]);
    const csv = [header, ...body].map(line => line.map(c => {
      const x = String(c ?? "");
      return /[",\n]/.test(x) ? `"${x.replace(/"/g,'""')}"` : x;
    }).join(",")).join("\n");
    const blob = new Blob(["\uFEFF"+csv], { type: "text/csv;charset=utf-8;" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `平時分_${(sheetName||cohort||"all").replace(/\\s+/g,"_")}.csv`;
    a.click();
  };

  return (
    <div className="space-y-4">
      <div>
        <h2 className="font-bold text-xl text-emerald-800">平時分輸出</h2>
        <p className="text-sm text-slate-500">預設 UT 50% + HW 30% + 課堂表現 20%（可調）。課堂分由 UT/HW 拉曲線，平均約 13／20，可人手改。</p>
      </div>

      <div className="bg-white rounded-2xl border p-4 space-y-3">
        <div className="grid sm:grid-cols-4 gap-3">
          <label className="text-xs font-bold">群組
            <select className="mt-1 w-full border rounded-lg px-2 py-1.5 text-sm" value={cohort} onChange={e=>setCohort(e.target.value)}>
              {cohorts.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </label>
          <label className="text-xs font-bold">UT 權重 %
            <input type="number" className="mt-1 w-full border rounded-lg px-2 py-1.5 text-sm" value={wUT} onChange={e=>setWUT(parseFloat(e.target.value)||0)} />
          </label>
          <label className="text-xs font-bold">HW 權重 %
            <input type="number" className="mt-1 w-full border rounded-lg px-2 py-1.5 text-sm" value={wHW} onChange={e=>setWHW(parseFloat(e.target.value)||0)} />
          </label>
          <label className="text-xs font-bold">課堂權重 %（滿分刻度）
            <input type="number" className="mt-1 w-full border rounded-lg px-2 py-1.5 text-sm" value={wCP} onChange={e=>setWCP(parseFloat(e.target.value)||0)} />
          </label>
        </div>
        <label className="text-xs font-bold block">UT 考試（選一份已入分考試）
          <select className="mt-1 w-full border rounded-lg px-2 py-1.5 text-sm font-semibold" value={utExamId} onChange={e=>setUtExamId(e.target.value)}>
            {!examIds.length && <option value="">無考試</option>}
            {examIds.map(id => <option key={id} value={id}>{id} — {examMaps[id]?.title || id}</option>)}
          </select>
        </label>
        <div>
          <div className="text-xs font-bold mb-1">計入的功課 HW（可多選）</div>
          <div className="flex flex-wrap gap-2 max-h-28 overflow-auto">
            {hwIds.map(id => (
              <label key={id} className={`text-xs font-bold px-2 py-1 rounded-lg border cursor-pointer ${hwSel[id]?"border-emerald-500 bg-emerald-50":"border-slate-200"}`}>
                <input type="checkbox" className="mr-1" checked={!!hwSel[id]} onChange={()=>setHwSel(p=>({...p,[id]:!p[id]}))} />
                {id}
              </label>
            ))}
            {!hwIds.length && <span className="text-slate-400 text-sm">此群組無功課藍圖</span>}
          </div>
        </div>
        <div className="grid sm:grid-cols-2 gap-3 items-end">
          <label className="text-xs font-bold">底稿名稱（儲存／覆蓋用）
            <input className="mt-1 w-full border-2 border-indigo-200 rounded-lg px-3 py-2 text-sm font-bold mono"
              placeholder="例如 2627T1A1" value={sheetName} onChange={e=>setSheetName(e.target.value)} />
          </label>
          <div className="flex flex-wrap gap-2">
            <button disabled={loading} className="bg-emerald-600 text-white font-bold px-5 py-2 rounded-xl text-sm disabled:opacity-50" onClick={compute}>
              {loading ? "計算中…" : "計算／預填課堂分"}
            </button>
            <button className="bg-indigo-600 text-white font-bold px-4 py-2 rounded-xl text-sm" onClick={saveSheet}>儲存底稿</button>
            <button className="border-2 font-bold px-4 py-2 rounded-xl text-sm" onClick={exportCsv}>匯出 CSV</button>
          </div>
        </div>
        {saveStatus && <div className="text-sm font-semibold text-slate-600">{saveStatus}</div>}

        <div className="rounded-xl border border-slate-200 bg-slate-50 p-3 space-y-2">
          <div className="text-xs font-bold text-slate-700">已存底稿（點選載入核對）</div>
          <div className="flex flex-wrap gap-2 items-center">
            <select className="border rounded-lg px-2 py-1.5 text-sm font-semibold min-w-[200px]" value={loadPick}
              onChange={e => setLoadPick(e.target.value)}>
              <option value="">— 選擇底稿 —</option>
              {savedList.map(s => (
                <option key={s.id} value={s.id}>
                  {s.name}{s.cohort ? " · "+s.cohort : ""}（{s.n}人）{s.updatedAt ? " · "+String(s.updatedAt).slice(0,16).replace("T"," ") : ""}
                </option>
              ))}
            </select>
            <button className="bg-slate-800 text-white font-bold text-sm px-3 py-1.5 rounded-lg" onClick={() => loadSheet(loadPick)}>載入</button>
            <button className="text-rose-600 font-bold text-sm px-2" onClick={() => deleteSheet(loadPick)}>刪除底稿</button>
            <button className="text-indigo-600 font-bold text-sm px-2" onClick={refreshSavedList}>重新整理列表</button>
          </div>
          {!savedList.length && <p className="text-xs text-slate-400">尚未有底稿。計算後輸入名稱再按「儲存底稿」。</p>}
        </div>
      </div>

      <div className="bg-white rounded-2xl border overflow-auto max-h-[65vh]">
        <table className="min-w-full text-sm">
          <thead className="sticky top-0 bg-slate-50">
            <tr>
              {["班","號","姓名","UT","HW","課堂表現","總分"].map(h => (
                <th key={h} className="text-left px-3 py-2 text-xs font-bold text-slate-500">{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {rows.map(r => (
              <tr key={r.id} className="border-t">
                <td className="px-3 py-1.5">{r.class}</td>
                <td className="px-3 py-1.5">{r.num}</td>
                <td className="px-3 py-1.5 font-bold">{r.name}</td>
                <td className="px-3 py-1.5">{r.ut == null ? "—" : r.ut}</td>
                <td className="px-3 py-1.5">{r.hw == null ? "—" : r.hw}</td>
                <td className="px-3 py-1.5">
                  <input type="number" step="0.1" className="w-20 border rounded px-1 py-0.5 font-bold"
                    value={r.cp} onChange={e => updateCp(r.id, e.target.value)} />
                  <span className="text-[10px] text-slate-400 ml-1">/{wCP}</span>
                </td>
                <td className="px-3 py-1.5 font-black text-emerald-700">{r.total}</td>
              </tr>
            ))}
            {!rows.length && (
              <tr><td colSpan={7} className="p-8 text-center text-slate-400">選擇 UT／HW 後按「計算／預填課堂分」</td></tr>
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}


function SyllabusSettingsView({ students }) {
  const [profiles, setProfiles] = useState([]);
  const [activeId, setActiveId] = useState("all");
  const [title, setTitle] = useState("");
  const [text, setText] = useState("");
  const [cohortMap, setCohortMap] = useState({});
  const [newId, setNewId] = useState("");
  const [busy, setBusy] = useState(false);
  const [status, setStatus] = useState("");

  const cohorts = useMemo(() => Array.from(new Set((students || []).map(s => s.cohort).filter(Boolean))).sort(), [students]);

  const topicsToText = (topics) => {
    const vals = Object.values(topics || {});
    const hasRich = vals.some(v => typeof v === "object" && v && (v.topic || v.section || v.desc));
    let s = hasRich ? "課題編號\t範疇\t課題名稱\t學習要求\n" : "課題編號\t課題名稱\n";
    Object.entries(topics || {}).forEach(([id, val]) => {
      if (hasRich) {
        const sec = (typeof val === "object" && val) ? (val.section || "") : "";
        const topic = (typeof val === "object" && val) ? (val.topic || val.name || "") : String(val || "");
        const desc = (typeof val === "object" && val) ? (val.desc || "") : "";
        s += `${id}\t${sec}\t${topic}\t${desc}\n`;
      } else {
        const topic = (typeof val === "object" && val) ? (val.topic || val.name || "") : String(val || "");
        s += `${id}\t${topic}\n`;
      }
    });
    return s;
  };

  const textToTopics = (raw) => {
    const newSyllabus = {};
    const lines = (raw || "").trim().split("\n");
    for (let i = 0; i < lines.length; i++) {
      if (!lines[i].trim()) continue;
      if (i === 0 && /課題|topic|編號/i.test(lines[i])) continue;
      const cols = lines[i].split("\t").map(c => c.trim());
      if (cols.length < 2 || !cols[0]) continue;
      const id = cols[0];
      if (cols.length >= 4) newSyllabus[id] = { section: cols[1] || "", topic: cols[2] || "", desc: cols[3] || "" };
      else if (cols.length === 3) newSyllabus[id] = { section: "", topic: cols[1] || "", desc: cols[2] || "" };
      else newSyllabus[id] = { section: "", topic: cols[1] || "", desc: "" };
    }
    return newSyllabus;
  };

  const refresh = async () => {
    const list = await listSyllabusProfiles();
    setProfiles(list);
    const map = await loadCohortSyllabusMap();
    setCohortMap(map || {});
  };

  const loadProfile = async (id) => {
    setActiveId(id);
    setBusy(true);
    try {
      const snap = await db.collection("syllabus").doc(String(id)).get();
      if (!snap.exists) {
        setTitle(id);
        setText("課題編號\t範疇\t課題名稱\t學習要求\n");
      } else {
        const data = snap.data() || {};
        setTitle(data.title || id);
        const body = data.data || data.topics || {};
        setText(topicsToText(body));
      }
      await loadSyllabus(id);
    } catch (e) { alert(e.message); }
    setBusy(false);
  };

  useEffect(() => {
    (async () => {
      await refresh();
      await loadProfile(ACTIVE_SYLLABUS_ID || "all");
    })();
  }, []);

  const save = async () => {
    if (!activeId) return;
    setBusy(true);
    setStatus("儲存中…");
    try {
      const topics = textToTopics(text);
      await saveSyllabusProfile(activeId, title || activeId, topics);
      SYLLABUS_TOPICS = topics;
      ACTIVE_SYLLABUS_ID = activeId;
      await refresh();
      setStatus("已儲存「" + (title || activeId) + "」（" + Object.keys(topics).length + " 課題）");
      setTimeout(() => setStatus(""), 2500);
    } catch (e) { setStatus(""); alert(e.message); }
    setBusy(false);
  };

  const createNew = async () => {
    const id = (newId || "").trim().replace(/[\/\s]+/g, "_");
    if (!id) return alert("請輸入大綱 ID，例如 DSE_current 或 S3_foundation");
    if (profiles.some(p => p.id === id)) return alert("ID 已存在，請直接載入編輯");
    setBusy(true);
    try {
      await saveSyllabusProfile(id, id, {});
      setNewId("");
      await refresh();
      await loadProfile(id);
    } catch (e) { alert(e.message); }
    setBusy(false);
  };

  const remove = async () => {
    if (activeId === "all") return alert("不可刪除預設 all");
    if (!confirm("刪除大綱「" + activeId + "」？群組若綁定此大綱會改回 all。")) return;
    setBusy(true);
    try {
      await deleteSyllabusProfile(activeId);
      const map = { ...cohortMap };
      Object.keys(map).forEach(k => { if (map[k] === activeId) map[k] = "all"; });
      await saveCohortSyllabusMap(map);
      setCohortMap(map);
      await refresh();
      await loadProfile("all");
    } catch (e) { alert(e.message); }
    setBusy(false);
  };

  const saveBindings = async () => {
    setBusy(true);
    try {
      await saveCohortSyllabusMap(cohortMap);
      alert("已儲存群組 ↔ 大綱對照");
    } catch (e) { alert(e.message); }
    setBusy(false);
  };

  return (
    <div className="space-y-4 max-w-5xl">
      <div>
        <h2 className="font-bold text-xl text-indigo-800">課程大綱 (Syllabus) 設定</h2>
        <p className="text-sm text-slate-500 mt-1">
          建議用<strong>大綱檔案（Curriculum Profile）</strong>，再讓群組綁定：例如多個高中群組共用「DSE_current」，S3 用「S3_foundation」，日後新高中用「DSE_2028」。
          不必每個群組複製一份大綱。
        </p>
      </div>

      <div className="bg-violet-50 border border-violet-200 rounded-2xl p-4 space-y-3">
        <div className="font-bold text-violet-900">AI Prompt · 由教學文件生成大綱表</div>
        <p className="text-xs text-violet-800">把官方／校本教學大綱、課程文件上傳到 Gemini／ChatGPT，貼上下列 Prompt，要求輸出 Tab 分隔表，再貼回下方編輯區儲存。</p>
        <button className="bg-violet-600 text-white font-bold text-sm px-4 py-2 rounded-lg"
          onClick={() => {
            const prompt = `【身份】你是香港中學化學課程設計專家，熟悉 HKDSE Chemistry 及初中科學（化學部份）課程架構。

【任務】我會提供一份或多份「教學文件／課程大綱／Textbook 目錄／EDB 課程文件」。請你整理成系統可用的【課程大綱表】。

【輸出格式】（必須嚴格遵守）
1. 只輸出純文字表格，用 Tab 分隔，不要 Markdown、不要 code fence、不要額外說明。
2. 第一行必須是表頭：
課題編號\t範疇\t課題名稱\t學習要求
3. 之後每一行一個課題，例如：
2.1.1\t微觀世界 I\t原子結構\t指出亞原子粒子的電荷、質量與在原子中的位置
4. 課題編號：優先使用官方／校本已有編號（如 1.1.1、2.3.3、E3.2.1）。若文件無編號，請按章節合理編出層級編號，並保持一致。
5. 範疇：地球與化學／微觀世界／金屬／酸與鹼／化石燃料／氧化還原／反應速率／化學平衡／碳化合物／工業化學／材料化學／分析化學／其他（可按文件調整）。
6. 課題名稱：精簡（約 4–12 字）。
7. 學習要求：一句至兩句，寫「學生應能……」的可考點描述，方便出題與弱點分析。
8. 涵蓋文件中的所有主要課題；不要省略選修（如 E3、E4），若文件有提及。
9. 語言：繁體中文。

【開始】請等待我上傳／貼上教學文件後再輸出表格。`;
            navigator.clipboard.writeText(prompt).then(() => alert("已複製 AI Prompt")).catch(() => alert("複製失敗，請手動選取"));
          }}>
          複製生成大綱 Prompt
        </button>
      </div>

      <div className="grid lg:grid-cols-5 gap-4">
        <div className="lg:col-span-2 space-y-3">
          <div className="bg-white rounded-2xl border p-4 space-y-2">
            <div className="font-bold text-sm">大綱檔案列表</div>
            <div className="max-h-48 overflow-auto space-y-1">
              {profiles.map(p => (
                <button key={p.id} type="button" onClick={() => loadProfile(p.id)}
                  className={`w-full text-left px-3 py-2 rounded-lg border text-sm ${activeId===p.id?"border-indigo-400 bg-indigo-50 font-bold":"border-slate-100 hover:bg-slate-50"}`}>
                  <div>{p.title}</div>
                  <div className="text-[10px] text-slate-400 mono">{p.id} · {p.n} 課題</div>
                </button>
              ))}
              {!profiles.length && <p className="text-xs text-slate-400">尚無。可新建，或從 Sheet 匯入到 all。</p>}
            </div>
            <div className="flex gap-2">
              <input className="flex-1 border rounded-lg px-2 py-1.5 text-sm mono" placeholder="新 ID 如 S3_foundation" value={newId} onChange={e=>setNewId(e.target.value)} />
              <button className="bg-indigo-600 text-white font-bold text-xs px-3 rounded-lg" onClick={createNew}>新建</button>
            </div>
          </div>

          <div className="bg-white rounded-2xl border p-4 space-y-2">
            <div className="font-bold text-sm">群組綁定大綱</div>
            <p className="text-[11px] text-slate-500">切換頂部群組時，AI Prompt 會載入對應大綱。</p>
            <div className="space-y-2 max-h-56 overflow-auto">
              {cohorts.map(c => (
                <div key={c} className="flex items-center gap-2 text-sm">
                  <span className="w-28 font-semibold truncate" title={c}>{c}</span>
                  <select className="flex-1 border rounded px-2 py-1 text-xs"
                    value={cohortMap[c] || "all"}
                    onChange={e => setCohortMap(m => ({ ...m, [c]: e.target.value }))}>
                    {(profiles.length ? profiles : [{ id: "all", title: "all" }]).map(p => (
                      <option key={p.id} value={p.id}>{p.title}</option>
                    ))}
                    {!profiles.some(p => p.id === "all") && <option value="all">all</option>}
                  </select>
                </div>
              ))}
              {!cohorts.length && <p className="text-xs text-slate-400">尚無群組（學生資料內 cohort 欄）</p>}
            </div>
            <button className="bg-slate-800 text-white font-bold text-sm px-3 py-1.5 rounded-lg" onClick={saveBindings}>儲存綁定</button>
          </div>
        </div>

        <div className="lg:col-span-3 bg-white rounded-2xl border p-4 space-y-3">
          <div className="flex flex-wrap gap-2 items-end">
            <label className="text-xs font-bold flex-1">顯示名稱
              <input className="mt-1 w-full border rounded-lg px-2 py-1.5 text-sm" value={title} onChange={e=>setTitle(e.target.value)} />
            </label>
            <div className="text-xs text-slate-500 mono pb-2">ID: {activeId}</div>
            <button disabled={busy} className="bg-indigo-600 text-white font-bold text-sm px-4 py-2 rounded-lg disabled:opacity-50" onClick={save}>儲存大綱</button>
            {activeId !== "all" && (
              <button className="text-rose-600 font-bold text-sm px-2" onClick={remove}>刪除</button>
            )}
          </div>
          <p className="text-[11px] text-slate-500">格式：課題編號[Tab]範疇[Tab]課題名稱[Tab]學習要求（或兩欄：編號[Tab]名稱）</p>
          <textarea className="w-full h-[28rem] border rounded-xl p-3 text-xs mono bg-slate-50"
            value={text} onChange={e=>setText(e.target.value)}
            placeholder={"課題編號\t範疇\t課題名稱\t學習要求\n2.1.1\t微觀世界 I\t原子結構\t..."} />
          {status && <div className="text-sm font-semibold text-emerald-700">{status}</div>}
        </div>
      </div>
    </div>
  );
}



function StudentPromotionView({ students, onReload }) {
  const cohorts = useMemo(() => Array.from(new Set((students || []).map(s => s.cohort).filter(Boolean))).sort(), [students]);
  const [selectedCohort, setSelectedCohort] = useState(cohorts[0] || "");
  const [newCohort, setNewCohort] = useState(selectedCohort);
  const [pasteData, setPasteData] = useState("");
  const [previewList, setPreviewList] = useState(null);
  const [filterCohort, setFilterCohort] = useState("全部");
  const [busy, setBusy] = useState(false);

  useEffect(() => { setNewCohort(selectedCohort); }, [selectedCohort]);
  useEffect(() => {
    if (cohorts.length && !cohorts.includes(selectedCohort)) setSelectedCohort(cohorts[0] || "");
  }, [cohorts]);

  const filteredRoster = useMemo(() => {
    return (students || []).filter(s => filterCohort === "全部" || s.cohort === filterCohort)
      .sort((a, b) => String(a.cohort||"").localeCompare(String(b.cohort||"")) || String(a.class||"").localeCompare(String(b.class||"")) || (Number(a.num)||0)-(Number(b.num)||0));
  }, [students, filterCohort]);

  const handlePreview = () => {
    if (!pasteData.trim()) return alert("請先貼上新學期 Excel 學生資料");
    const lines = pasteData.trim().split("\n");
    const incoming = [];
    lines.forEach(line => {
      const parts = line.split("\t");
      if (parts.length >= 3) {
        incoming.push({
          cls: parts[0].trim(),
          num: parts[1].trim(),
          name: parts[2].trim(),
          studentId: parts.length >= 4 ? parts[3].trim() : ""
        });
      }
    });
    if (!incoming.length) return alert("無法解析。格式：班別[Tab]座號[Tab]姓名 或 再加[Tab]學號");

    const currentStudents = (students || []).filter(s => s.cohort === selectedCohort);
    const preview = incoming.map(inc => {
      let match = null;
      if (inc.studentId) {
        match = currentStudents.find(s => s.id === inc.studentId || s.sid === inc.studentId);
      }
      if (!match) match = currentStudents.find(s => s.name === inc.name);
      return {
        ...inc,
        exists: !!match,
        oldId: match?.id,
        oldSid: match?.sid || match?.id,
        oldClass: match?.class,
        oldNum: match?.num
      };
    });
    const notFound = currentStudents.filter(s => {
      const bySid = incoming.some(i => i.studentId && (s.id === i.studentId || s.sid === i.studentId));
      const byName = incoming.some(i => i.name === s.name);
      return !bySid && !byName;
    });
    setPreviewList({ preview, notFound });
  };

  const handleCommit = async () => {
    if (!previewList?.preview?.length) return alert("請先預覽");
    if (!confirm(`確認將來源群組「${selectedCohort}」更新為目標「${newCohort}」？\n舊生會更新班號姓名群組（保留永久 ID）；名單上的新生會新增。`)) return;
    setBusy(true);
    let promoteCount = 0, newCount = 0;
    try {
      for (const item of previewList.preview) {
        if (item.exists && item.oldId) {
          const permanentId = item.oldId; // Firebase：成績掛在永久 id 下，不改 id
          const patch = {
            class: item.cls,
            num: isNaN(Number(item.num)) ? item.num : Number(item.num),
            name: item.name,
            cohort: newCohort,
            sid: item.studentId || item.oldSid || permanentId,
            updatedAt: new Date().toISOString()
          };
          await db.collection("students").doc(permanentId).set(patch, { merge: true });
          // 若貼上了新的 s 學號且與舊 id 不同，才遷移主鍵
          if (item.studentId && item.studentId !== permanentId && String(item.studentId).startsWith("s")) {
            await migrateStudentId(permanentId, item.studentId, patch);
          }
          promoteCount++;
        } else {
          let nid = item.studentId || (`${item.cls}-${item.num}`.replace(/\s+/g, ""));
          const exists = students.find(s => s.id === nid);
          if (exists) nid = nid + "_" + Date.now().toString(36).slice(-4);
          await db.collection("students").doc(nid).set({
            id: nid,
            sid: item.studentId || nid,
            class: item.cls,
            num: isNaN(Number(item.num)) ? item.num : Number(item.num),
            name: item.name,
            cohort: newCohort,
            pin: "",
            active: true,
            updatedAt: new Date().toISOString()
          }, { merge: true });
          newCount++;
        }
      }
      alert(`完成！\n更新舊生：${promoteCount}\n新增學生：${newCount}\n（成績掛在永久學生 ID 下，班別變更無需搬成績）`);
      setPreviewList(null);
      setPasteData("");
      if (onReload) await onReload();
    } catch (e) { alert(e.message); }
    setBusy(false);
  };

  const clearScores = async (sid, name) => {
    if (!confirm(`清除「${name}」全部成績（小測/考試/功課/Pastpaper）？學生仍留在名單。`)) return;
    setBusy(true);
    try {
      for (const sub of ["homeworks", "quizzes", "exams", "pastpapers"]) {
        const snap = await db.collection("scores").doc(sid).collection(sub).get();
        for (const d of snap.docs) await d.ref.delete();
      }
      alert("已清除成績");
    } catch (e) { alert(e.message); }
    setBusy(false);
  };

  const purgeOrphans = async () => {
    if (!confirm("掃描 scores 集合，刪除「不在學生名單」的成績根文件？（可能需一點時間）")) return;
    setBusy(true);
    try {
      const valid = new Set((students || []).map(s => s.id));
      const roots = await db.collection("scores").get();
      let n = 0;
      for (const root of roots.docs) {
        if (valid.has(root.id)) continue;
        for (const sub of ["homeworks", "quizzes", "exams", "pastpapers"]) {
          const snap = await root.ref.collection(sub).get();
          for (const d of snap.docs) await d.ref.delete();
        }
        await root.ref.delete();
        n++;
      }
      alert(n ? `已清理 ${n} 個幽靈成績根` : "沒有發現幽靈成績");
    } catch (e) { alert(e.message); }
    setBusy(false);
  };

  return (
    <div className="space-y-4">
      <div>
        <h2 className="font-bold text-xl text-purple-800">學生動態管理與智慧升班（新學年轉換）</h2>
        <p className="text-sm text-slate-500 mt-1">
          貼上新學期名單預覽。優先用「學號／永久 ID」對應舊生，否則用姓名。
          Firebase 成績存在永久學生 ID 下，升班只更新班別／座號／群組，一般<strong>不必搬成績</strong>。
        </p>
      </div>

      <div className="bg-white rounded-2xl border p-4 space-y-4">
        <div className="grid md:grid-cols-2 gap-4">
          <label className="text-xs font-bold">1. 來源群組（舊名單所在）
            <select className="mt-1 w-full border rounded-lg px-2 py-2 text-sm font-semibold" value={selectedCohort} onChange={e=>setSelectedCohort(e.target.value)}>
              {cohorts.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </label>
          <label className="text-xs font-bold">2. 目標群組（可改／留班）
            <input className="mt-1 w-full border-2 border-purple-200 rounded-lg px-2 py-2 text-sm font-bold" value={newCohort} onChange={e=>setNewCohort(e.target.value)} />
          </label>
        </div>
        <div>
          <div className="text-xs font-bold mb-1">3. 貼上新學期名單（Excel 複製）</div>
          <p className="text-[11px] text-slate-500 mb-1">格式：班別[Tab]座號[Tab]姓名　或　班別[Tab]座號[Tab]姓名[Tab]學號(s12345678)</p>
          <textarea className="w-full h-36 border rounded-xl p-3 text-sm mono" value={pasteData} onChange={e=>setPasteData(e.target.value)}
            placeholder={"6A\t23\t謝宇邦\ts20241234\n6B\t13\t林宥燁\ts20241235"} />
        </div>
        <div className="flex flex-wrap gap-2">
          <button className="bg-purple-600 text-white font-bold px-4 py-2 rounded-xl text-sm" onClick={handlePreview}>預覽升班結果</button>
          <button disabled={busy || !previewList} className="bg-indigo-600 text-white font-bold px-4 py-2 rounded-xl text-sm disabled:opacity-40" onClick={handleCommit}>
            {busy ? "處理中…" : "確認寫入雲端"}
          </button>
          <button disabled={busy} className="bg-rose-600 text-white font-bold px-4 py-2 rounded-xl text-sm disabled:opacity-40" onClick={purgeOrphans}>
            清理幽靈成績
          </button>
        </div>
      </div>

      {previewList && (
        <div className="bg-white rounded-2xl border p-4 space-y-3">
          <h3 className="font-bold">升班／更新清單預覽</h3>
          <div className="overflow-auto max-h-64">
            <table className="min-w-full text-sm">
              <thead className="bg-slate-50 sticky top-0">
                <tr>{["狀態","新班","座號","姓名","學號","舊 ID","舊班座"].map(h=><th key={h} className="text-left px-2 py-1 text-xs text-slate-500">{h}</th>)}</tr>
              </thead>
              <tbody>
                {previewList.preview.map((r, i) => (
                  <tr key={i} className="border-t">
                    <td className="px-2 py-1">{r.exists ? <span className="text-emerald-600 font-bold">更新</span> : <span className="text-amber-600 font-bold">新增</span>}</td>
                    <td className="px-2 py-1">{r.cls}</td>
                    <td className="px-2 py-1">{r.num}</td>
                    <td className="px-2 py-1 font-semibold">{r.name}</td>
                    <td className="px-2 py-1 mono text-xs">{r.studentId || "—"}</td>
                    <td className="px-2 py-1 mono text-xs">{r.oldId || "—"}</td>
                    <td className="px-2 py-1 text-xs text-slate-500">{r.exists ? `${r.oldClass}-${r.oldNum}` : "—"}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          {!!previewList.notFound.length && (
            <div className="text-sm text-rose-700">
              <b>來源群組有 {previewList.notFound.length} 人未出現在新名單</b>（不會自動刪除；可在下方名冊處理）：
              {previewList.notFound.map(s => s.name).join("、")}
            </div>
          )}
        </div>
      )}

      <div className="bg-white rounded-2xl border p-4">
        <div className="flex flex-wrap justify-between gap-2 mb-3">
          <h3 className="font-bold">化學科現有學生名冊（{filteredRoster.length} 人）</h3>
          <select className="border rounded-lg px-2 py-1 text-sm" value={filterCohort} onChange={e=>setFilterCohort(e.target.value)}>
            <option value="全部">顯示全部學群</option>
            {cohorts.map(c => <option key={c} value={c}>{c}</option>)}
          </select>
        </div>
        <div className="overflow-auto max-h-80">
          <table className="min-w-full text-sm">
            <thead className="sticky top-0 bg-slate-50">
              <tr>{["學群","班","座號","姓名","永久 ID","操作"].map(h=><th key={h} className="text-left px-2 py-1 text-xs text-slate-500">{h}</th>)}</tr>
            </thead>
            <tbody>
              {filteredRoster.map(s => (
                <tr key={s.id} className="border-t">
                  <td className="px-2 py-1.5 text-xs">{s.cohort || "—"}</td>
                  <td className="px-2 py-1.5">{s.class}</td>
                  <td className="px-2 py-1.5">{s.num}</td>
                  <td className="px-2 py-1.5 font-bold">{s.name}</td>
                  <td className="px-2 py-1.5 mono text-xs">{s.id}</td>
                  <td className="px-2 py-1.5">
                    <button className="text-amber-600 font-bold text-xs mr-2" disabled={busy} onClick={()=>clearScores(s.id, s.name)}>清成績</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}


function App() {
  const [view, setView] = useState("hwGrade");
  const [students, setStudents] = useState([]);
  const [homeworkMaps, setHomeworkMaps] = useState({});
  const [homeworkScores, setHomeworkScores] = useState({});
  const [quizMaps, setQuizMaps] = useState({});
  const [quizScores, setQuizScores] = useState({});
  const [examMaps, setExamMaps] = useState({});
  const [examScores, setExamScores] = useState({});
  const [pastpaperMaps, setPastpaperMaps] = useState({});
  const [pastpaperScores, setPastpaperScores] = useState({});
  const [loading, setLoading] = useState(true);
  const [cohort, setCohort] = useState(() => {
    try { return localStorage.getItem("chem_teacher_cohort") || ""; } catch (e) { return ""; }
  });
  const [cohortReady, setCohortReady] = useState(false);

  const reload = useCallback(async () => {
    setLoading(true);
    try {
      const stu = await loadAllStudents();
      setStudents(stu);
      const maps = await loadHomeworkMaps();
      setHomeworkMaps(maps);
      const qmaps = await loadQuizMaps();
      setQuizMaps(qmaps);
      const emaps = await loadExamMaps();
      setExamMaps(emaps);
      const pmaps = await loadPastpaperMaps();
      setMapsBundle({ homework: maps, quiz: qmaps, exam: emaps, pastpaper: pmaps });
      setPastpaperMaps(pmaps);

      // 決定群組：記住的有效群組 > 第一個真實群組（預設不用「所有學生」）
      const realCohorts = Array.from(new Set(stu.map(s => s.cohort).filter(Boolean))).sort();
      let saved = "";
      try { saved = localStorage.getItem("chem_teacher_cohort") || ""; } catch (e) {}
      let nextCohort = saved;
      // 已記住且仍存在 → 沿用；若記的是「所有學生」也尊重手動選擇
      if (nextCohort && nextCohort !== "所有學生" && !realCohorts.includes(nextCohort)) {
        nextCohort = "";
      }
      if (!nextCohort) {
        nextCohort = realCohorts[0] || "所有學生";
      }
      setCohort(nextCohort);
      try { localStorage.setItem("chem_teacher_cohort", nextCohort); } catch (e) {}
      setCohortReady(true);

      const sylId = await resolveSyllabusIdForCohort(nextCohort === "所有學生" ? "" : nextCohort);
      await loadSyllabus(sylId);

      setHomeworkScores({});
      setQuizScores({});
      setExamScores({});
      setPastpaperScores({});
    } catch(e) { alert("載入失敗："+e.message); }
    setLoading(false);
  }, []);

  useEffect(()=>{ reload(); }, [reload]);

  // 切換群組時載入對應大綱（不重讀全部 maps）
  useEffect(() => {
    if (!cohortReady || !cohort) return;
    (async () => {
      try {
        const sylId = await resolveSyllabusIdForCohort(cohort === "所有學生" ? "" : cohort);
        await loadSyllabus(sylId);
      } catch (e) { console.warn(e); }
    })();
  }, [cohort, cohortReady]);

  const cohorts = useMemo(() => [...Array.from(new Set(students.map(s=>s.cohort).filter(Boolean))).sort(), "所有學生"], [students]);
  const activeStudents = useMemo(() => {
    const base = cohort==="所有學生" ? students : students.filter(s=>s.cohort===cohort);
    return base.filter(s => s.active !== false);
  }, [students, cohort]);

  return (
    <div className="min-h-screen flex flex-col">
      {/* ★ 固定頂欄：群組永遠可見 */}
      <div className="sticky top-0 z-50 bg-indigo-700 text-white shadow-md">
        <div className="flex flex-wrap items-center gap-3 px-4 py-2.5">
          <div className="font-black text-sm tracking-wide shrink-0">Chemistry Teacher</div>
          <div className="h-5 w-px bg-white/30 hidden sm:block" />
          <label className="flex items-center gap-2 text-xs font-bold shrink-0">
            <span className="opacity-90">目前群組</span>
            <select
              className="border-0 rounded-lg px-2.5 py-1.5 text-sm font-black text-indigo-900 bg-white shadow focus:ring-2 focus:ring-amber-300 min-w-[9rem]"
              value={cohort}
              onChange={e => {
                const v = e.target.value;
                setCohort(v);
                try { localStorage.setItem("chem_teacher_cohort", v); } catch (err) {}
              }}
            >
              {(cohorts || []).map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </label>
          <span className="text-[11px] text-indigo-100 hidden md:inline">
            {cohort === "所有學生" ? "（全校）" : ""} · {activeStudents.length} 人
          </span>
          <button
            type="button"
            className="ml-auto text-xs font-bold bg-white/15 hover:bg-white/25 px-3 py-1.5 rounded-lg transition"
            onClick={reload}
            disabled={loading}
          >
            {loading ? "載入中…" : "重新載入"}
          </button>
        </div>
      </div>
      <div className="flex flex-1 min-h-0">
      <Sidebar view={view} setView={setView} cohort={cohort} setCohort={setCohort} cohorts={cohorts} reload={reload} loading={loading} />
      <main className="flex-1 p-6 overflow-auto">
        {loading && <div className="text-xs text-slate-400 mb-2">載入中…</div>}
        {view==="ranking" && <ClassRankingView activeStudents={activeStudents} currentCohort={cohort} homeworkMaps={homeworkMaps} quizMaps={quizMaps} examMaps={examMaps} pastpaperMaps={pastpaperMaps} />}
        {view==="students" && <StudentsManageView students={students} onReload={reload} />}
        {view==="promotion" && <StudentPromotionView students={students} onReload={reload} />}
        {view==="syllabus" && <SyllabusSettingsView students={students} />}
        {view==="caExport" && <ContinuousAssessView students={students} homeworkMaps={homeworkMaps} examMaps={examMaps} currentCohort={cohort} />}
        {view==="import" && <ImportView onReload={reload} />}
        {view==="idMap" && <IdMapView students={students} onReload={reload} />}
        {view==="pins" && <PinsView students={students} onReload={reload} />}
        {view==="hwSettings" && <HwSettingsView students={students} homeworkMaps={homeworkMaps} setHomeworkMaps={setHomeworkMaps} currentCohort={cohort==="所有學生"?(cohorts[1]||""):cohort} />}
        {view==="hwGrade" && <HwGradeView activeStudents={activeStudents} homeworkMaps={homeworkMaps} homeworkScores={homeworkScores} setHomeworkScores={setHomeworkScores} currentCohort={cohort==="所有學生"?"":cohort} />}
        {view==="hwSummary" && <HwSummaryView activeStudents={activeStudents} homeworkMaps={homeworkMaps} homeworkScores={homeworkScores} setHomeworkScores={setHomeworkScores} currentCohort={cohort==="所有學生"?"":cohort} />}
        {view==="hwChase" && <HwChaseView activeStudents={activeStudents} homeworkMaps={homeworkMaps} homeworkScores={homeworkScores} setHomeworkScores={setHomeworkScores} currentCohort={cohort==="所有學生"?"":cohort} />}
        {view==="quizInput" && <QuizInputAnalysisView activeStudents={activeStudents} quizMaps={quizMaps} quizScores={quizScores} setQuizScores={setQuizScores} currentCohort={cohort} />}
        {view==="quizStudent" && <QuizStudentAnalysisView activeStudents={activeStudents} quizMaps={quizMaps} currentCohort={cohort} />}
        {view==="quizSummary" && <QuizSummaryView activeStudents={activeStudents} quizMaps={quizMaps} currentCohort={cohort} />}
        {view==="quizSettings" && <QuizSettingsView students={students} quizMaps={quizMaps} setQuizMaps={setQuizMaps} currentCohort={cohort} />}
        {view==="examInput" && <ExamInputAnalysisView activeStudents={activeStudents} examMaps={examMaps} examScores={examScores} setExamScores={setExamScores} currentCohort={cohort} />}
        {view==="examPersonal" && <ExamPersonalAnalysisView activeStudents={activeStudents} examMaps={examMaps} currentCohort={cohort} />}
        {view==="examMakeup" && <ExamMakeupView activeStudents={activeStudents} examMaps={examMaps} examScores={examScores} setExamScores={setExamScores} currentCohort={cohort} />}
        {view==="examSummary" && <ExamSummaryView activeStudents={activeStudents} examMaps={examMaps} currentCohort={cohort} />}
        {view==="examSettings" && <ExamSettingsView students={students} examMaps={examMaps} setExamMaps={setExamMaps} currentCohort={cohort} />}
        {view==="ppInput" && <PastpaperInputAnalysisView activeStudents={activeStudents} pastpaperMaps={pastpaperMaps} pastpaperScores={pastpaperScores} setPastpaperScores={setPastpaperScores} />}
        {view==="ppPersonal" && <PastpaperPersonalAnalysisView activeStudents={activeStudents} pastpaperMaps={pastpaperMaps} />}
        {view==="ppSettings" && <PastpaperSettingsView pastpaperMaps={pastpaperMaps} setPastpaperMaps={setPastpaperMaps} />}
      </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
