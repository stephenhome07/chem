function HwGradeView({ activeStudents, homeworkMaps, homeworkScores, setHomeworkScores, currentCohort }) {
  const availableHws = useMemo(() => Object.keys(homeworkMaps||{}).filter(id => !homeworkMaps[id].cohort || homeworkMaps[id].cohort===currentCohort).sort(), [homeworkMaps, currentCohort]);
  const [selectedHw, setSelectedHw] = useState(availableHws[0]||"");
  const [selectedStudentId, setSelectedStudentId] = useState("");
  const [edit, setEdit] = useState(null);
  const [filter, setFilter] = useState("ALL");
  const [saveStatus, setSaveStatus] = useState("idle");
  const timer = useRef(null);
  const editRef = useRef(null);
  const sidRef = useRef("");
  const hwRef = useRef("");
  const inputRefs = useRef({});
  const pendingFocusRef = useRef(null);

  // AI analysis controls
  const [aiMc, setAiMc] = useState(10);
  const [aiLq, setAiLq] = useState(2);
  const [aiLevel, setAiLevel] = useState("中");
  const [aiSelected, setAiSelected] = useState([]);
  const [aiExtra, setAiExtra] = useState({ practice: true, explainImg: false, ppt: false, notes: false });

  useEffect(()=>{ editRef.current=edit; },[edit]);
  useEffect(()=>{ sidRef.current=selectedStudentId; },[selectedStudentId]);
  useEffect(()=>{ hwRef.current=selectedHw; },[selectedHw]);
  useEffect(()=>{
    if (availableHws.length && !availableHws.includes(selectedHw)) setSelectedHw(availableHws[0]||"");
  },[availableHws]);

  // 懶載入：只拉目前選中功課的成績
  const [hwLoading, setHwLoading] = useState(false);
  useEffect(() => {
    if (!selectedHw || !activeStudents.length) return;
    let cancelled = false;
    (async () => {
      setHwLoading(true);
      try {
        const part = await loadHomeworkScoresForHw(activeStudents.map(s=>s.id), selectedHw);
        if (cancelled) return;
        setHomeworkScores(prev => {
          const next = { ...prev };
          activeStudents.forEach(s => {
            next[s.id] = { ...(next[s.id]||{}) };
            if (part[s.id] && part[s.id][selectedHw]) next[s.id][selectedHw] = part[s.id][selectedHw];
          });
          return next;
        });
      } catch(e) { console.warn(e); }
      if (!cancelled) setHwLoading(false);
    })();
    return () => { cancelled = true; };
  }, [selectedHw, activeStudents.map(s=>s.id).join(",")]);

  // After React re-render, apply pending focus (fixes auto-jump lost on setState)
  useEffect(() => {
    const qid = pendingFocusRef.current;
    if (!qid) return;
    pendingFocusRef.current = null;
    const t = setTimeout(() => {
      const el = inputRefs.current[qid] || document.querySelector('[data-hw-qid="'+qid+'"]');
      if (el) { el.focus(); if (el.select) el.select(); }
    }, 50);
    return () => clearTimeout(t);
  });

  const map = homeworkMaps[selectedHw];
  const qList = (map && map.questions) ? map.questions : [];

  const focusNext = (fromQid) => {
    const idx = qList.findIndex(q => q.id === fromQid);
    if (idx < 0) return;
    // 優先下一個空格；若後面都填了就去下一題
    for (let i = idx + 1; i < qList.length; i++) {
      const id = qList[i].id;
      const v = (editRef.current && editRef.current.scores) ? editRef.current.scores[id] : undefined;
      if (v === undefined || v === null || String(v).trim() === "") {
        pendingFocusRef.current = id;
        // force effect by toggling if same
        const el = inputRefs.current[id] || document.querySelector('[data-hw-qid="'+id+'"]');
        if (el) setTimeout(() => { el.focus(); if (el.select) el.select(); }, 60);
        return;
      }
    }
    if (idx + 1 < qList.length) {
      const id = qList[idx + 1].id;
      pendingFocusRef.current = id;
      setTimeout(() => {
        const el = inputRefs.current[id] || document.querySelector('[data-hw-qid="'+id+'"]');
        if (el) { el.focus(); if (el.select) el.select(); }
      }, 60);
    }
  };

  const openStudent = (sid) => {
    if (timer.current) { clearTimeout(timer.current); timer.current=null; }
    setSelectedStudentId(sid);
    const rec = homeworkScores[sid]?.[selectedHw];
    const next = rec ? { ...rec, scores: { ...(rec.scores||{}) } } : { scores:{}, remakeStatus:"MISSING", remarks:"", gradingDate:"", remakeDate:"" };
    setEdit(next);
    setSaveStatus("idle");
    setTimeout(() => {
      const firstEmpty = qList.find(q => {
        const v = next.scores?.[q.id];
        return v === undefined || v === null || String(v).trim() === "";
      });
      const target = firstEmpty ? firstEmpty.id : (qList[0] && qList[0].id);
      if (target) {
        const el = inputRefs.current[target] || document.querySelector('[data-hw-qid="'+target+'"]');
        if (el) el.focus();
      }
    }, 80);
  };

  const persist = async (record, sid, hw) => {
    setSaveStatus("saving");
    try {
      await saveHomeworkScore(sid, hw, record);
      setHomeworkScores(prev => ({
        ...prev,
        [sid]: { ...(prev[sid]||{}), [hw]: record }
      }));
      setSaveStatus("saved");
      setTimeout(()=>setSaveStatus("idle"), 1500);
    } catch(e) { setSaveStatus("idle"); alert(e.message); }
  };

  const scheduleSave = (next) => {
    setEdit(next);
    editRef.current = next;
    if (timer.current) clearTimeout(timer.current);
    timer.current = setTimeout(() => {
      const sid = sidRef.current, hw = hwRef.current;
      if (!sid || !hw) return;
      persist(next, sid, hw);
    }, 800);
  };

  const onScoreChange = (q, raw) => {
    const v = q.type === "MC" ? String(raw).toUpperCase() : raw;
    const scores = { ...(editRef.current?.scores || edit?.scores || {}), [q.id]: v };
    const base = editRef.current || edit;
    const next = { ...base, scores, remakeStatus: base.remakeStatus==="MISSING"?"PENDING":base.remakeStatus };
    scheduleSave(next);
    // MC：有字母就跳；LQ：有數字也跳（方便連續入分）
    if (String(v).trim() !== "") {
      focusNext(q.id);
    }
  };

  const filteredStudents = activeStudents.filter(s => {
    if (filter==="ALL") return true;
    const st = homeworkScores[s.id]?.[selectedHw]?.remakeStatus || "MISSING";
    return st === filter;
  });

  // 全班題目表現分析
  const questionStats = useMemo(() => {
    if (!map?.questions) return [];
    return map.questions.map(q => {
      let attempts = 0, full = 0, earned = 0, maxPossible = 0;
      activeStudents.forEach(s => {
        const rec = homeworkScores[s.id]?.[selectedHw];
        if (!rec?.scores) return;
        const val = rec.scores[q.id];
        if (val === undefined || val === null || String(val).trim() === "") return;
        attempts++;
        maxPossible += (q.max || 1);
        if (q.type === "MC") {
          if (q.ans) {
            const corrects = q.ans.toString().split(",").map(a => a.trim().toUpperCase());
            if (corrects.includes(String(val).trim().toUpperCase())) { full++; earned += (q.max||1); }
          }
        } else {
          const n = parseFloat(val) || 0;
          earned += n;
          if (n >= (q.max||1)) full++;
        }
      });
      const rate = attempts > 0 ? (q.type === "MC" ? full / attempts : (maxPossible > 0 ? earned / maxPossible : 0)) : null;
      return { ...q, attempts, full, earned, maxPossible, rate };
    });
  }, [map, homeworkScores, activeStudents, selectedHw]);

  const weakDefaultIds = useMemo(() =>
    questionStats.filter(q => q.rate !== null && q.rate < 0.6).map(q => q.id),
  [questionStats]);

  useEffect(() => {
    setAiSelected(weakDefaultIds);
  }, [selectedHw, weakDefaultIds.join("|")]);

  const buildPracticePrompt = () => {
    const selected = questionStats.filter(q => aiSelected.includes(q.id));
    const list = (selected.length ? selected : questionStats.filter(q => q.rate !== null && q.rate < 0.6));
    const weakList = list.map(q => {
      const pct = q.rate !== null ? Math.round(q.rate * 100) + "%" : "無資料";
      return formatWeakItem(q, `全班得分率 ${pct}，難度：${q.level || "中"}`);
    }).join("\n") || "- （請自行補充難點）";
    const topicIds = list.map(q => q.topicId).filter(Boolean);
    const syllabus = getSyllabusTableText(topicIds);

    const tasks = [];
    if (aiExtra.practice) {
      tasks.push(`A. 針對性練習卷：出 ${aiMc} 題 MC 與 ${aiLq} 題 LQ，難度「${aiLevel}」，繁體中文，貼近 HKDSE。MC 附常見錯項陷阱；LQ 附分步評分。每題請標明對應 topicId。`);
    }
    if (aiExtra.explainImg) {
      tasks.push(`B. 解說圖片：為上述每條弱項各設計 1 張「可在簡報使用」的概念圖／示意圖描述（構圖、標註、重點公式），並註明 topicId。`);
    }
    if (aiExtra.ppt) {
      tasks.push(`C. PPT 大綱：以勾選弱項為綱，8–12 頁（標題、要點、建議圖示、口述提示），標明 topicId。`);
    }
    if (aiExtra.notes) {
      tasks.push(`D. 溫習筆記：定義 → 公式 → 易錯點 → 一例題，對應 topicId。`);
    }
    if (!tasks.length) tasks.push(`A. 針對性練習卷：出 ${aiMc} 題 MC 與 ${aiLq} 題 LQ。`);

    return `【身份】你是香港 DSE 化學科老師，學生約 Band 3。

【任務】根據以下「功課弱項診斷」（功課 ${selectedHw}：${map?.title || ""}），完成指定產出。

【難點列表】（每項含 topicId）
${weakList}

【課程大綱參考】（僅列相關 Topic ID）
${syllabus}

【產出要求】
${tasks.map((x,i)=>`${i+1}. ${x}`).join("\n")}

【其他】
- 語言：繁體中文
- 題目須對應弱項與 topicId，由淺入深
- 不要多餘開場白，直接給內容`;
  };

  const copyPrompt = () => {
    navigator.clipboard.writeText(buildPracticePrompt())
      .then(() => alert("已複製 AI Prompt！可貼到 Gemini / ChatGPT。"))
      .catch(() => alert("複製失敗，請重試"));
  };

  if (!map) return <div className="p-8 text-slate-400">請先在「功課設定」建立功課，或切換群組。</div>;

  return (
    <div className="space-y-4">
    <div className="grid lg:grid-cols-5 gap-4">
      <div className="lg:col-span-2 bg-white rounded-2xl border p-4 space-y-3">
        <select className="w-full border rounded-lg px-2 py-2 text-sm font-bold" value={selectedHw} onChange={e=>{setSelectedHw(e.target.value); setSelectedStudentId(""); setEdit(null);}}>
          {availableHws.map(id=><option key={id} value={id}>{id} — {homeworkMaps[id].title}</option>)}
        </select>
        {hwLoading && <div className="text-[11px] text-slate-400">載入此功課成績中…</div>}
        <div className="flex flex-wrap gap-1">
          {["ALL","MISSING","PENDING","DONE","PERFECT","EXEMPT"].map(f=>(
            <button key={f} onClick={()=>setFilter(f)} className={`text-[10px] font-bold px-2 py-1 rounded-full border ${filter===f?"bg-indigo-600 text-white border-indigo-600":"bg-white text-slate-600"}`}>
              {f==="ALL"?"全部":(STATUS_META[f]?.label||f)}
            </button>
          ))}
        </div>
        <div className="max-h-[55vh] overflow-auto space-y-1">
          {filteredStudents.map(s => {
            const st = homeworkScores[s.id]?.[selectedHw]?.remakeStatus || "MISSING";
            const rec = homeworkScores[s.id]?.[selectedHw];
            let scoreTxt = null;
            if (rec && map) {
              let total = 0, max = 0, any = false;
              (map.questions||[]).forEach(q => {
                max += (q.max||0);
                const val = rec.scores?.[q.id];
                if (val === undefined || val === null || String(val).trim() === "") return;
                any = true;
                if (q.type === "MC") {
                  if (q.ans) {
                    const corrects = q.ans.toString().split(",").map(a=>a.trim().toUpperCase());
                    if (corrects.includes(String(val).trim().toUpperCase())) total += (q.max||0);
                  }
                } else total += parseFloat(val)||0;
              });
              if (any) scoreTxt = total + "/" + max;
            }
            return (
              <button key={s.id} onClick={()=>openStudent(s.id)}
                className={`w-full text-left px-3 py-2 rounded-xl border text-sm flex justify-between items-center gap-2 ${selectedStudentId===s.id?"border-indigo-400 bg-indigo-50":"border-slate-100 hover:bg-slate-50"}`}>
                <span className="min-w-0 truncate"><b>{s.class}-{s.num}</b> {s.name}</span>
                <span className="flex items-center gap-1.5 shrink-0">
                  {scoreTxt && <span className="text-xs font-bold text-indigo-700 tabular-nums">{scoreTxt}</span>}
                  <Badge status={st} />
                </span>
              </button>
            );
          })}
        </div>
      </div>
      <div className="lg:col-span-3 bg-white rounded-2xl border p-4">
        {!edit || !selectedStudentId ? <p className="text-slate-400 p-8 text-center">選擇學生開始批改（輸入後自動跳下一格）</p> : (
          <div className="space-y-3">
            <div className="flex justify-between items-center">
              <div className="font-bold">{activeStudents.find(x=>x.id===selectedStudentId)?.name} · {selectedHw}</div>
              <div className="text-xs text-slate-400">{saveStatus==="saving"?"儲存中…":saveStatus==="saved"?"已存":"自動跳格"}</div>
            </div>
            <div className="flex flex-wrap gap-2">
              {Object.keys(STATUS_META).map(st=>(
                <button key={st} className={`text-xs font-bold px-2 py-1 rounded-lg border ${edit.remakeStatus===st?"ring-2 ring-indigo-400":""} ${STATUS_META[st].cls}`}
                  onClick={()=>scheduleSave({ ...edit, remakeStatus: st, remakeDate: st==="DONE"?new Date().toISOString().slice(0,10):(edit.remakeDate||"") })}>
                  {STATUS_META[st].label}
                </button>
              ))}
            </div>
            <div className="space-y-2 max-h-[50vh] overflow-auto">
              {qList.map(q => (
                <div key={q.id} className="border rounded-xl p-2 flex gap-2 items-center">
                  <div className="w-24 shrink-0">
                    <div className="text-xs font-bold mono">{q.id}</div>
                    <div className="text-[10px] text-slate-400">{q.type} /{q.max}</div>
                  </div>
                  <div className="flex-1 text-xs text-slate-600 truncate" title={q.topicDesc}>{q.topicId} {q.topicDesc}</div>
                  {(() => {
                    const raw = edit.scores?.[q.id];
                    const has = raw !== undefined && raw !== null && String(raw).trim() !== "";
                    let scoreColor = "border-slate-200 bg-white text-slate-800";
                    if (has) {
                      if (q.type === "MC") {
                        const ok = q.ans && String(raw).trim().toUpperCase() === String(q.ans).split(",")[0].trim().toUpperCase()
                          || (q.ans && q.ans.toString().split(",").map(a=>a.trim().toUpperCase()).includes(String(raw).trim().toUpperCase()));
                        scoreColor = ok ? "border-emerald-400 bg-emerald-50 text-emerald-800" : "border-rose-400 bg-rose-50 text-rose-700";
                      } else {
                        const n = parseFloat(raw);
                        if (!isNaN(n) && n <= 0) scoreColor = "border-rose-400 bg-rose-50 text-rose-700";
                        else if (!isNaN(n) && n >= (q.max||0)) scoreColor = "border-emerald-400 bg-emerald-50 text-emerald-800";
                        else if (has) scoreColor = "border-amber-400 bg-amber-50 text-amber-800";
                      }
                    }
                    return (
                      <div className="flex items-center gap-1 shrink-0">
                        {q.type==="MC" ? (
                          <input
                            data-hw-qid={q.id}
                            ref={el => { if (el) inputRefs.current[q.id]=el; }}
                            className={`w-14 border-2 rounded px-1 py-1 text-center font-bold uppercase ${scoreColor}`}
                            maxLength={4}
                            value={raw ?? ""}
                            onChange={e=>onScoreChange(q, e.target.value)}
                            onKeyDown={e=>{ if (e.key==="Enter" || e.key==="Tab") { e.preventDefault(); focusNext(q.id); } }}
                          />
                        ) : (
                          <input
                            data-hw-qid={q.id}
                            ref={el => { if (el) inputRefs.current[q.id]=el; }}
                            type="number"
                            className={`w-16 border-2 rounded px-1 py-1 text-center font-bold ${scoreColor}`}
                            value={raw ?? ""}
                            onChange={e=>onScoreChange(q, e.target.value)}
                            onKeyDown={e=>{
                              if (e.key==="Enter" || e.key==="Tab") {
                                e.preventDefault();
                                focusNext(q.id);
                              }
                            }}
                          />
                        )}
                        <span className="text-[11px] font-bold text-slate-400 tabular-nums">/{q.max}</span>
                        {q.type==="MC" && q.ans && (
                          <span className={`text-[10px] font-bold ml-0.5 ${has && scoreColor.includes("emerald")?"text-emerald-600":"text-slate-400"}`}>
                            {q.ans}
                          </span>
                        )}
                      </div>
                    );
                  })()}
                </div>
              ))}
            </div>
            <textarea className="w-full border rounded-xl p-2 text-sm" rows={2} placeholder="備註"
              value={edit.remarks||""} onChange={e=>scheduleSave({ ...edit, remarks:e.target.value })} />
          </div>
        )}
      </div>
    </div>

    {/* 功課分析 + AI Prompt */}
    <div className="bg-white rounded-2xl border p-5 space-y-4">
      <div className="flex flex-wrap items-center justify-between gap-2">
        <h3 className="font-bold text-slate-800">本份功課分析 · {selectedHw} {map.title}</h3>
        <span className="text-xs text-slate-400">預設勾選得分率 &lt; 60%</span>
      </div>
      <div className="overflow-auto max-h-56 border rounded-xl">
        <table className="min-w-full text-xs">
          <thead className="bg-slate-50 sticky top-0">
            <tr>
              <th className="px-2 py-2 text-left">選</th>
              <th className="px-2 py-2 text-left">題號</th>
              <th className="px-2 py-2 text-left">考點</th>
              <th className="px-2 py-2 text-center">作答</th>
              <th className="px-2 py-2 text-center">得分率</th>
            </tr>
          </thead>
          <tbody>
            {questionStats.map(q => {
              const pct = q.rate === null ? null : Math.round(q.rate * 100);
              const color = pct === null ? "text-slate-400" : pct < 40 ? "text-rose-600 font-bold" : pct < 60 ? "text-amber-600 font-bold" : "text-emerald-600 font-bold";
              return (
                <tr key={q.id} className="border-t">
                  <td className="px-2 py-1.5">
                    <input type="checkbox" checked={aiSelected.includes(q.id)}
                      onChange={() => setAiSelected(prev => prev.includes(q.id) ? prev.filter(x=>x!==q.id) : [...prev, q.id])} />
                  </td>
                  <td className="px-2 py-1.5 mono font-bold">{q.id}</td>
                  <td className="px-2 py-1.5 truncate max-w-[280px]" title={q.topicDesc}><span className="mono text-[10px] text-indigo-600 font-bold">{q.topicId||"—"}</span> {q.topicDesc}</td>
                  <td className="px-2 py-1.5 text-center">{q.attempts}</td>
                  <td className={`px-2 py-1.5 text-center ${color}`}>{pct === null ? "—" : pct + "%"}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <div className="rounded-2xl border-2 border-violet-300 bg-violet-50 p-5 space-y-4">
        <div className="font-black text-violet-900 text-lg">功課 AI Prompt 生成</div>
        <p className="text-sm text-violet-800">弱項含 <b>topicId</b>，並附上<strong>課程大綱參考</strong>（Syllabus）。產出類型可多選，區塊已加大方便點選。</p>
        <div className="flex flex-wrap gap-2">
          <button className="px-3 py-1.5 rounded-lg bg-rose-100 text-rose-800 font-bold text-sm border border-rose-200" onClick={()=>setAiSelected(weakDefaultIds)}>全選弱項(&lt;60%)</button>
          <button className="px-3 py-1.5 rounded-lg bg-white border font-bold text-sm" onClick={()=>setAiSelected(questionStats.map(q=>q.id))}>全選全部</button>
          <button className="px-3 py-1.5 rounded-lg bg-white border font-bold text-sm" onClick={()=>setAiSelected([])}>清空</button>
        </div>
        <div className="grid sm:grid-cols-3 gap-3">
          <label className="text-sm font-bold text-slate-700">難度
            <select className="mt-1 w-full border-2 border-violet-200 rounded-lg px-3 py-2 text-sm" value={aiLevel} onChange={e=>setAiLevel(e.target.value)}>
              <option value="淺">淺</option>
              <option value="中">中</option>
              <option value="深">深</option>
            </select>
          </label>
          <label className="text-sm font-bold text-slate-700">MC 題數
            <input type="number" min={0} className="mt-1 w-full border-2 border-violet-200 rounded-lg px-3 py-2 text-sm" value={aiMc} onChange={e=>setAiMc(parseInt(e.target.value)||0)} />
          </label>
          <label className="text-sm font-bold text-slate-700">LQ 題數
            <input type="number" min={0} className="mt-1 w-full border-2 border-violet-200 rounded-lg px-3 py-2 text-sm" value={aiLq} onChange={e=>setAiLq(parseInt(e.target.value)||0)} />
          </label>
        </div>
        <div>
          <div className="text-sm font-bold text-slate-700 mb-2">產出類型（可多選）</div>
          <div className="flex flex-wrap gap-3">
            {[
              ["practice","弱項練習"],
              ["explainImg","解說圖描述"],
              ["ppt","PPT 大綱"],
              ["notes","筆記"],
            ].map(([k,lab])=>(
              <label key={k} className={`flex items-center gap-2 px-4 py-2.5 rounded-xl border-2 text-sm font-bold cursor-pointer ${aiExtra[k]?"border-violet-500 bg-white text-violet-800":"border-slate-200 bg-white/60 text-slate-600"}`}>
                <input type="checkbox" className="w-4 h-4" checked={!!aiExtra[k]} onChange={e=>setAiExtra(x=>({...x,[k]:e.target.checked}))} /> {lab}
              </label>
            ))}
          </div>
        </div>
        <button className="w-full sm:w-auto bg-violet-600 hover:bg-violet-700 text-white font-black px-8 py-3 rounded-xl text-base shadow" onClick={copyPrompt}>
          複製 AI Prompt（已選 {aiSelected.length} 題 · 含 Syllabus）
        </button>
      </div>
    </div>
    </div>
  );
}

function HwSummaryView({ activeStudents, homeworkMaps, homeworkScores, setHomeworkScores, currentCohort }) {
  const availableHws = useMemo(() => Object.keys(homeworkMaps||{}).filter(id => !homeworkMaps[id].cohort || homeworkMaps[id].cohort===currentCohort).sort(), [homeworkMaps, currentCohort]);
  const [included, setIncluded] = useState({});
  const [editMode, setEditMode] = useState(false);
  const [saveStatus, setSaveStatus] = useState("idle");
  const [sumLoading, setSumLoading] = useState(false);
  useEffect(() => {
    const o={}; availableHws.forEach(h=>o[h]=true); setIncluded(o);
  }, [availableHws.join("|")]);
  useEffect(() => {
    if (!availableHws.length || !activeStudents.length) return;
    let cancelled = false;
    (async () => {
      setSumLoading(true);
      try {
        const part = await loadHomeworkScoresForHws(activeStudents.map(s=>s.id), availableHws);
        if (cancelled) return;
        setHomeworkScores(prev => {
          const next = { ...prev };
          Object.keys(part).forEach(sid => {
            next[sid] = { ...(next[sid]||{}), ...part[sid] };
          });
          return next;
        });
      } catch(e) { console.warn(e); }
      if (!cancelled) setSumLoading(false);
    })();
    return () => { cancelled = true; };
  }, [availableHws.join("|"), activeStudents.map(s=>s.id).join(",")]);

  const hwMax = useMemo(() => {
    const m={};
    availableHws.forEach(id => { m[id]=(homeworkMaps[id].questions||[]).reduce((a,q)=>a+(q.max||0),0); });
    return m;
  }, [availableHws, homeworkMaps]);

  const scoreOf = (sid, hwId) => {
    const rec = homeworkScores[sid]?.[hwId];
    if (!rec || rec.remakeStatus==="EXEMPT") return null;
    if (rec.remakeStatus==="MISSING" && (!rec.scores || !Object.keys(rec.scores).length)) return null;
    const map = homeworkMaps[hwId];
    if (!map) return null;
    let t=0;
    (map.questions||[]).forEach(q => {
      const val = rec.scores?.[q.id];
      if (val===undefined||val===null||String(val).trim()==="") return;
      if (q.type==="MC") {
        if (q.ans) {
          const corrects = q.ans.toString().split(",").map(a=>a.trim().toUpperCase());
          if (corrects.includes(String(val).trim().toUpperCase())) t+=q.max;
        }
      } else t += parseFloat(val)||0;
    });
    return t;
  };

  const setCellStatus = async (sid, hw, status) => {
    const prev = homeworkScores[sid]?.[hw] || { scores: {} };
    const next = { ...prev, remakeStatus: status, remakeDate: status==="DONE"?new Date().toISOString().slice(0,10):(prev.remakeDate||"") };
    setSaveStatus("saving");
    try {
      await saveHomeworkScore(sid, hw, next);
      setHomeworkScores(p => ({ ...p, [sid]: { ...(p[sid]||{}), [hw]: next } }));
      setSaveStatus("saved");
      setTimeout(()=>setSaveStatus("idle"), 1000);
    } catch(e) { setSaveStatus("idle"); alert(e.message); }
  };

  const exportExcel = () => {
    const hws = availableHws.filter(h=>included[h]);
    const header = ["班別","學號","姓名","學生ID", ...hws.map(h=>h+"分數"), ...hws.map(h=>h+"狀態")];
    const rows = activeStudents.map(s => {
      const scores = hws.map(h => { const sc=scoreOf(s.id,h); return sc===null?"":sc; });
      const statuses = hws.map(h => homeworkScores[s.id]?.[h]?.remakeStatus || "MISSING");
      return [s.class, s.num, s.name, s.id, ...scores, ...statuses];
    });
    const csv = [header, ...rows].map(r => r.map(c => {
      const x = String(c??"");
      return /[",\n]/.test(x) ? `"${x.replace(/"/g,'""')}"` : x;
    }).join(",")).join("\n");
    const blob = new Blob(["\uFEFF"+csv], { type: "text/csv;charset=utf-8;" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "homework_summary.csv";
    a.click();
  };

  const cols = availableHws.filter(h=>included[h]);

  return (
    <div className="bg-white rounded-2xl border p-4 space-y-3">
      <div className="flex flex-wrap items-center justify-between gap-2">
        <h2 className="font-bold">功課成績總表</h2>
        <div className="flex flex-wrap gap-2 items-center">
          <span className="text-xs text-slate-400">{saveStatus==="saving"?"儲存中…":saveStatus==="saved"?"已存":""}</span>
          <button className={`text-sm font-bold px-3 py-1.5 rounded-lg border ${editMode?"bg-amber-500 text-white border-amber-500":"bg-amber-50 text-amber-800 border-amber-200"}`} onClick={()=>setEditMode(m=>!m)}>
            {editMode ? "結束編輯" : "開啟快速編輯"}
          </button>
          <button className="text-sm font-bold px-3 py-1.5 rounded-lg bg-emerald-600 text-white" onClick={exportExcel}>匯出 Excel (CSV)</button>
        </div>
      </div>
      {editMode && <p className="text-xs text-amber-700 bg-amber-50 border border-amber-100 rounded-lg px-3 py-2">編輯模式：下拉選單仍保留狀態顏色。可直接改未交／欠改正／已改正／完美／豁免。</p>}
      <div className="flex flex-wrap gap-2">
        {availableHws.map(id=>(
          <label key={id} className="text-xs font-bold flex items-center gap-1 border rounded-lg px-2 py-1">
            <input type="checkbox" checked={!!included[id]} onChange={()=>setIncluded(p=>({...p,[id]:!p[id]}))} />
            {id}
          </label>
        ))}
      </div>
      <div className="overflow-auto max-h-[70vh]">
        <table className="min-w-full text-sm">
          <thead className="sticky top-0 bg-slate-50">
            <tr>
              <th className="text-left px-2 py-2">班</th>
              <th className="text-left px-2 py-2">號</th>
              <th className="text-left px-2 py-2">姓名</th>
              {cols.map(h=>(
                <th key={h} className="text-center px-2 py-2 text-xs">{h}<div className="text-[10px] font-normal text-slate-400">/{hwMax[h]}</div></th>
              ))}
            </tr>
          </thead>
          <tbody>
            {activeStudents.map(s=>(
              <tr key={s.id} className="border-t">
                <td className="px-2 py-1">{s.class}</td>
                <td className="px-2 py-1">{s.num}</td>
                <td className="px-2 py-1 font-semibold">{s.name}</td>
                {cols.map(h=>{
                  const rec = homeworkScores[s.id]?.[h];
                  const sc = scoreOf(s.id,h);
                  const st = rec?.remakeStatus || "MISSING";
                  const meta = STATUS_META[st] || STATUS_META.MISSING;
                  return (
                    <td key={h} className="px-2 py-1 text-center">
                      <div className="font-bold">{sc===null?"-":sc}</div>
                      {editMode ? (
                        <select
                          className={`text-[10px] font-bold border rounded mt-0.5 max-w-[100px] px-1 py-0.5 ${meta.cls}`}
                          value={st}
                          onChange={e=>setCellStatus(s.id, h, e.target.value)}>
                          {Object.keys(STATUS_META).map(k=>(
                            <option key={k} value={k}>{STATUS_META[k].label}</option>
                          ))}
                        </select>
                      ) : <Badge status={st} />}
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function HwChaseView({ activeStudents, homeworkMaps, homeworkScores, setHomeworkScores, currentCohort }) {
  const availableHws = useMemo(() => Object.keys(homeworkMaps||{}).filter(id => !homeworkMaps[id].cohort || homeworkMaps[id].cohort===currentCohort).sort(), [homeworkMaps, currentCohort]);
  const [typeFilter, setTypeFilter] = useState("BOTH");
  const [expanded, setExpanded] = useState(null);
  useEffect(() => {
    if (!availableHws.length || !activeStudents.length) return;
    let cancelled = false;
    (async () => {
      try {
        const part = await loadHomeworkScoresForHws(activeStudents.map(s=>s.id), availableHws);
        if (cancelled) return;
        setHomeworkScores(prev => {
          const next = { ...prev };
          Object.keys(part).forEach(sid => {
            next[sid] = { ...(next[sid]||{}), ...part[sid] };
          });
          return next;
        });
      } catch(e) { console.warn(e); }
    })();
    return () => { cancelled = true; };
  }, [availableHws.join("|"), activeStudents.map(s=>s.id).join(",")]);

  const byStudent = useMemo(() => {
    const map = {};
    activeStudents.forEach(s => {
      const items = [];
      availableHws.forEach(hw => {
        const st = homeworkScores[s.id]?.[hw]?.remakeStatus || "MISSING";
        if (typeFilter==="BOTH" && st!=="MISSING" && st!=="PENDING") return;
        if (typeFilter==="MISSING" && st!=="MISSING") return;
        if (typeFilter==="PENDING" && st!=="PENDING") return;
        const rec = homeworkScores[s.id]?.[hw];
        const qs = (homeworkMaps[hw]?.questions)||[];
        items.push({
          hw, status: st, rec,
          title: homeworkMaps[hw]?.title || hw,
          questions: qs,
          missingQ: qs.filter(q => {
            const v = rec?.scores?.[q.id];
            return v===undefined||v===null||String(v).trim()==="";
          }).map(q=>q.id)
        });
      });
      if (items.length) map[s.id] = { student: s, items };
    });
    return Object.values(map).sort((a,b)=> String(a.student.class).localeCompare(String(b.student.class)) || (Number(a.student.num)||0)-(Number(b.student.num)||0));
  }, [activeStudents, availableHws, homeworkScores, typeFilter, homeworkMaps]);

  const setStatus = async (sid, hw, status) => {
    const prev = homeworkScores[sid]?.[hw] || { scores:{} };
    const next = { ...prev, remakeStatus: status, remakeDate: status==="DONE"?new Date().toISOString().slice(0,10):(prev.remakeDate||"") };
    await saveHomeworkScore(sid, hw, next);
    setHomeworkScores(p => ({ ...p, [sid]: { ...(p[sid]||{}), [hw]: next } }));
  };

  return (
    <div className="bg-white rounded-2xl border p-4 space-y-3">
      <h2 className="font-bold text-lg">追欠交功課及改正區</h2>
      <p className="text-sm text-slate-500">以<strong>學生</strong>為單位。點開可看欠哪些功課、題目概要，方便當面解答。</p>
      <div className="flex flex-wrap gap-2 items-center">
        <select className="border rounded-lg px-2 py-1 text-sm" value={typeFilter} onChange={e=>setTypeFilter(e.target.value)}>
          <option value="BOTH">未交 + 欠改正</option>
          <option value="MISSING">只看未交</option>
          <option value="PENDING">只看欠改正</option>
        </select>
        <span className="text-sm text-slate-500">共 {byStudent.length} 位同學</span>
      </div>
      <div className="space-y-2 max-h-[75vh] overflow-auto">
        {byStudent.map(({ student: s, items }) => {
          const open = expanded === s.id;
          const nMiss = items.filter(i=>i.status==="MISSING").length;
          const nPend = items.filter(i=>i.status==="PENDING").length;
          return (
            <div key={s.id} className="border rounded-xl overflow-hidden">
              <button className="w-full flex flex-wrap items-center justify-between gap-2 px-4 py-3 bg-slate-50 hover:bg-slate-100 text-left"
                onClick={()=>setExpanded(open?null:s.id)}>
                <div>
                  <span className="font-bold">{s.class}-{s.num} {s.name}</span>
                  <span className="ml-2 text-xs mono text-slate-400">{s.id}</span>
                </div>
                <div className="flex gap-2 text-[11px] font-bold">
                  {nMiss>0 && <span className="px-2 py-0.5 rounded-full bg-slate-200 text-slate-700">未交 {nMiss}</span>}
                  {nPend>0 && <span className="px-2 py-0.5 rounded-full bg-rose-100 text-rose-700">欠改正 {nPend}</span>}
                  <span className="text-slate-400">{open?"收起":"詳細"}</span>
                </div>
              </button>
              {open && (
                <div className="p-3 space-y-3 bg-white">
                  {items.map(it => (
                    <div key={it.hw} className="border rounded-xl p-3 space-y-2">
                      <div className="flex flex-wrap justify-between gap-2 items-start">
                        <div>
                          <div className="font-bold text-indigo-700 mono text-sm">{it.hw}</div>
                          <div className="font-semibold text-sm">{it.title}</div>
                          <Badge status={it.status} />
                        </div>
                        <div className="flex flex-wrap gap-1">
                          {it.status==="MISSING" && <button className="text-[10px] font-bold px-2 py-1 rounded bg-slate-100" onClick={()=>setStatus(s.id,it.hw,"PENDING")}>標已交待改</button>}
                          {it.status==="PENDING" && <button className="text-[10px] font-bold px-2 py-1 rounded bg-blue-100 text-blue-700" onClick={()=>setStatus(s.id,it.hw,"DONE")}>已改正</button>}
                          <button className="text-[10px] font-bold px-2 py-1 rounded bg-emerald-50 text-emerald-700" onClick={()=>setStatus(s.id,it.hw,"PERFECT")}>完美</button>
                          <button className="text-[10px] font-bold px-2 py-1 rounded bg-amber-50 text-amber-700" onClick={()=>setStatus(s.id,it.hw,"EXEMPT")}>豁免</button>
                        </div>
                      </div>
                      <div className="text-xs text-slate-600 bg-slate-50 rounded-lg p-2">
                        <div className="font-bold text-slate-500 mb-1">題目概要（{it.questions.length} 題）
                          {it.missingQ.length>0 && <span className="text-rose-600 ml-1">· 未填 {it.missingQ.join(", ")}</span>}
                        </div>
                        <ul className="space-y-0.5 max-h-32 overflow-auto">
                          {it.questions.map(q=>(
                            <li key={q.id} className="truncate">
                              <span className="mono font-bold text-slate-700">{q.id}</span>
                              <span className="text-slate-400 mx-1">{q.type}/{q.max}</span>
                              {q.topicId} {q.topicDesc}
                            </li>
                          ))}
                        </ul>
                        {it.rec?.remarks && <div className="mt-1 text-amber-800">備註：{it.rec.remarks}</div>}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
        {!byStudent.length && <div className="text-center text-slate-400 py-10">沒有符合的欠交／欠改正 🎉</div>}
      </div>
    </div>
  );
}


function QuizInputAnalysisView({ activeStudents, quizMaps, quizScores, setQuizScores, currentCohort }) {
  const quizIds = useMemo(() => Object.keys(quizMaps || {}).filter(id => quizVisibleForCohort(quizMaps[id], currentCohort)).sort(), [quizMaps, currentCohort]);
  const [selectedQuiz, setSelectedQuiz] = useState(quizIds[0] || "");
  const [selectedStudentId, setSelectedStudentId] = useState("");
  const [saveStatus, setSaveStatus] = useState("idle");
  const [qzLoading, setQzLoading] = useState(false);
  const [makeup, setMakeup] = useState({}); // sid -> { category, status, remark }
  const [makeupSel, setMakeupSel] = useState([]);
  const [mkMc, setMkMc] = useState(10);
  const [mkLq, setMkLq] = useState(0);
  const [mkLevel, setMkLevel] = useState("中");
  const [makeupSaving, setMakeupSaving] = useState(false);
  const inputRefs = useRef({});
  const scoresRef = useRef(quizScores);
  const timer = useRef(null);
  useEffect(() => { scoresRef.current = quizScores; }, [quizScores]);
  useEffect(() => {
    if (quizIds.length && !quizIds.includes(selectedQuiz)) setSelectedQuiz(quizIds[0] || "");
  }, [quizIds]);

  // 懶載入：只拉目前小測成績 + 補測記錄
  useEffect(() => {
    if (!selectedQuiz || !activeStudents.length) return;
    let cancelled = false;
    (async () => {
      setQzLoading(true);
      try {
        const part = await loadQuizScoresForQuiz(activeStudents.map(s => s.id), selectedQuiz);
        const mk = await loadQuizMakeup(selectedQuiz);
        if (cancelled) return;
        setQuizScores(prev => {
          const next = { ...prev };
          activeStudents.forEach(s => {
            next[s.id] = { ...(next[s.id] || {}) };
            if (part[s.id] && part[s.id][selectedQuiz]) next[s.id][selectedQuiz] = part[s.id][selectedQuiz];
            else if (next[s.id]) delete next[s.id][selectedQuiz];
          });
          return next;
        });
        setMakeup(mk || {});
        setMakeupSel([]);
      } catch (e) { console.warn(e); }
      if (!cancelled) setQzLoading(false);
    })();
    return () => { cancelled = true; };
  }, [selectedQuiz, activeStudents.map(s => s.id).join(",")]);

  const map = quizMaps[selectedQuiz];
  const qList = map?.questions || [];

  const studentRec = (sid) => {
    const r = quizScores[sid]?.[selectedQuiz] || {};
    // strip meta keys for display
    return r;
  };

  const focusNext = (fromQid) => {
    const idx = qList.findIndex(q => q.id === fromQid);
    if (idx < 0 || idx >= qList.length - 1) return;
    const nextId = qList[idx + 1].id;
    setTimeout(() => {
      const el = inputRefs.current[nextId] || document.querySelector('[data-qz-qid="'+nextId+'"]');
      if (el) { el.focus(); if (el.select) el.select(); }
    }, 40);
  };

  const scheduleSave = (sid, quizId, record) => {
    setSaveStatus("saving");
    if (timer.current) clearTimeout(timer.current);
    timer.current = setTimeout(async () => {
      try {
        await saveQuizScore(sid, quizId, record);
        setSaveStatus("saved");
        setTimeout(() => setSaveStatus(s => s === "saved" ? "idle" : s), 1500);
      } catch (e) { setSaveStatus("idle"); alert(e.message); }
    }, 600);
  };

  const setQVal = (qid, raw, q) => {
    if (!selectedStudentId || !selectedQuiz) return;
    let stored = raw;
    if (raw === "" || raw === null || raw === undefined) stored = "";
    else if (q.type === "MC") stored = String(raw).toUpperCase().replace(/[^A-D]/g, "").slice(0, 1);
    else stored = (raw === "" || isNaN(parseFloat(raw))) ? raw : parseFloat(raw);

    setQuizScores(prev => {
      const prevRec = { ...(prev[selectedStudentId]?.[selectedQuiz] || {}) };
      const nextRec = { ...prevRec, [qid]: stored };
      const next = {
        ...prev,
        [selectedStudentId]: {
          ...(prev[selectedStudentId] || {}),
          [selectedQuiz]: nextRec
        }
      };
      scheduleSave(selectedStudentId, selectedQuiz, nextRec);
      return next;
    });
    if (stored !== "" && stored !== null) focusNext(qid);
  };

  const calcStudentTotal = (sid) => {
    if (!map) return null;
    const rec = quizScores[sid]?.[selectedQuiz];
    if (!rec || typeof rec !== "object") return null;
    let total = 0, max = 0, any = false;
    qList.forEach(q => {
      max += (q.max || 0);
      const raw = rec[q.id];
      if (raw === undefined || raw === null || String(raw).trim() === "") return;
      any = true;
      const sc = quizQuestionScore(q, raw);
      if (sc != null) total += sc;
    });
    return any ? { total, max } : null;
  };

  const clearStudent = async () => {
    if (!selectedStudentId || !selectedQuiz) return;
    if (!confirm("清除此學生此小測全部成績？")) return;
    try {
      await deleteQuizScore(selectedStudentId, selectedQuiz);
      setQuizScores(prev => {
        const next = { ...prev };
        if (next[selectedStudentId]) {
          const copy = { ...next[selectedStudentId] };
          delete copy[selectedQuiz];
          next[selectedStudentId] = copy;
        }
        return next;
      });
    } catch (e) { alert(e.message); }
  };

  const FAIL_RATIO = 0.5;

  const isAbsent = (sid) => {
    const rec = quizScores[sid]?.[selectedQuiz];
    if (!rec || typeof rec !== "object") return true;
    return !qList.some(q => {
      const v = rec[q.id];
      return v !== undefined && v !== null && String(v).trim() !== "";
    });
  };

  const isFail = (sid) => {
    if (isAbsent(sid)) return false;
    const ana = calcStudentTotal(sid);
    if (!ana || !ana.max) return false;
    return ana.total / ana.max < FAIL_RATIO;
  };

  // 建議補測名單：無測 + 不合格（可與手動 makeup 合併顯示）
  const suggestedMakeup = useMemo(() => {
    const list = [];
    activeStudents.forEach(s => {
      if (isAbsent(s.id)) list.push({ student: s, category: "ABSENT" });
      else if (isFail(s.id)) list.push({ student: s, category: "FAIL" });
    });
    return list;
  }, [activeStudents, quizScores, selectedQuiz, qList]);

  const ensureMakeupEntry = (sid, category) => {
    setMakeup(prev => {
      if (prev[sid]) return prev;
      return { ...prev, [sid]: { category, status: "PENDING", remark: "" } };
    });
  };

  const persistMakeup = async (nextMap) => {
    setMakeupSaving(true);
    try {
      await saveQuizMakeup(selectedQuiz, nextMap);
      setMakeup(nextMap);
    } catch (e) { alert(e.message); }
    setMakeupSaving(false);
  };

  const updateMakeupField = (sid, patch) => {
    const next = { ...makeup, [sid]: { category: "ABSENT", status: "PENDING", remark: "", ...(makeup[sid] || {}), ...patch } };
    setMakeup(next);
    // debounce write
    if (window.__mkTimer) clearTimeout(window.__mkTimer);
    window.__mkTimer = setTimeout(() => persistMakeup(next), 500);
  };

  const addSuggestedToMakeup = () => {
    const next = { ...makeup };
    suggestedMakeup.forEach(({ student: s, category }) => {
      if (!next[s.id]) next[s.id] = { category, status: "PENDING", remark: "" };
      else next[s.id] = { ...next[s.id], category: next[s.id].category || category };
    });
    persistMakeup(next);
  };

  const buildMakeupPrompt = () => {
    const ids = makeupSel.length ? makeupSel : Object.keys(makeup);
    const lines = ids.map(sid => {
      const s = activeStudents.find(x => x.id === sid);
      const m = makeup[sid] || {};
      const ana = calcStudentTotal(sid);
      const cat = m.category === "FAIL" ? "不合格" : "無測／缺席";
      const score = ana ? `${ana.total}/${ana.max}` : "無成績";
      return `- ${s ? `${s.class}-${s.num} ${s.name}` : sid}（${cat}，成績 ${score}；備註：${m.remark || "無"}）`;
    }).join("\n") || "- （未選學生）";

    // 針對每位補測同學的個人失分題（含 topicId）
    const personalWeakBlocks = ids.map(sid => {
      const s = activeStudents.find(x => x.id === sid);
      const name = s ? `${s.class}-${s.num} ${s.name}` : sid;
      const rec = quizScores[sid]?.[selectedQuiz] || {};
      const weakQs = [];
      qList.forEach(q => {
        const raw = rec[q.id];
        if (raw === undefined || raw === null || String(raw).trim() === "") {
          weakQs.push(formatWeakItem(q, "未作答／缺分"));
          return;
        }
        const sc = quizQuestionScore(q, raw);
        const max = q.max || 1;
        if (sc == null) return;
        if (sc < max * 0.5) {
          weakQs.push(formatWeakItem(q, `得分 ${sc}/${max}`));
        }
      });
      // 若無個人數據（完全無測），用全班最弱題作參考並註明
      if (!weakQs.length) {
        const fallback = (classStats && classStats.processed)
          ? classStats.processed.filter(q => q.pct < 60 && q.attempts > 0).slice(0, 6)
          : [];
        if (fallback.length) {
          fallback.forEach(q => weakQs.push(formatWeakItem(q, `全班弱項參考 ${Math.round(q.pct)}%（該生無測）`)));
        } else {
          weakQs.push("- （暫無弱項數據，請按小測範圍與課程大綱出題）");
        }
      }
      return `### ${name}\n${weakQs.join("\n")}`;
    }).join("\n\n") || "- （未選學生）";

    const allTopicIds = [];
    ids.forEach(sid => {
      const rec = quizScores[sid]?.[selectedQuiz] || {};
      qList.forEach(q => {
        const raw = rec[q.id];
        const sc = (raw === undefined || raw === null || String(raw).trim() === "") ? 0 : quizQuestionScore(q, raw);
        const max = q.max || 1;
        if (raw === undefined || raw === null || String(raw).trim() === "" || (sc != null && sc < max * 0.5)) {
          if (q.topicId) allTopicIds.push(q.topicId);
        }
      });
    });
    if (!allTopicIds.length && classStats) {
      classStats.processed.filter(q => q.pct < 60).forEach(q => { if (q.topicId) allTopicIds.push(q.topicId); });
    }
    const syllabus = getSyllabusTableText(allTopicIds);

    return `【身份】你是香港 DSE 化學科老師。

【任務】為以下「補測」學生設計一份【互動式小測驗】，必須在 AI 的 **Canvas（畫布）模式** 中生成，讓學生可在對話中逐題作答、即時回饋。

【小測範圍】${map?.title || selectedQuiz}

【補測學生】
${lines}

【學生個人弱點】（每項必須含 topicId；請針對這些弱點出題）
${personalWeakBlocks}

【課程大綱參考】（相關 Topic ID 與學習要求）
${syllabus}

【基本設定】
- 語言：繁體中文
- 難度：${mkLevel}
- 多項選擇題 (MC)：${mkMc} 題（預設 10）
- 長題目 (LQ)：${mkLq} 題
- ★ 必須強調：以「互動式小測驗」形式、在 **Canvas** 中呈現（逐題顯示、學生作答後再給對錯與簡短解說）

【要求】
1. 題目必須針對上方「學生個人弱點」的 topicId 與考點，由淺入深。
2. 每題標明對應 topicId。
3. MC 附 4 選項；答錯時指出迷思。
4. 不要一次公開全部答案；先出題，待學生回答再評。
5. 開頭用一句話說明這是補測練習，語氣鼓勵。`;
  };

  // class analysis for selected quiz
  const classStats = useMemo(() => {
    if (!map || !activeStudents.length) return null;
    let classTotal = 0, classMax = 0, attempted = 0;
    const qStats = {};
    qList.forEach(q => { qStats[q.id] = { id: q.id, type: q.type, max: q.max, total: 0, attempts: 0, desc: q.topicDesc || q.desc || "", topicId: q.topicId || "", level: q.level }; });
    activeStudents.forEach(st => {
      const rec = quizScores[st.id]?.[selectedQuiz];
      if (!rec || typeof rec !== "object") return;
      const keys = Object.keys(rec).filter(k => !["updatedAt","_id"].includes(k));
      if (!keys.length) return;
      attempted++;
      qList.forEach(q => {
        const raw = rec[q.id];
        if (raw === undefined || raw === null || String(raw).trim() === "") return;
        const val = quizQuestionScore(q, raw);
        if (val == null) return;
        classTotal += val;
        classMax += q.max || 0;
        qStats[q.id].total += val;
        qStats[q.id].attempts++;
      });
    });
    if (!attempted) return null;
    const processed = Object.values(qStats).map(q => ({
      ...q,
      pct: q.attempts > 0 ? (q.total / ((q.max || 1) * q.attempts)) * 100 : 0
    })).sort((a, b) => a.pct - b.pct);
    return { classTotal, classMax, attempted, processed, avgPct: classMax > 0 ? (classTotal / classMax) * 100 : 0 };
  }, [map, activeStudents, quizScores, selectedQuiz, qList]);

  const [aiSelected, setAiSelected] = useState([]);
  const [aiMc, setAiMc] = useState(10);
  const [aiLq, setAiLq] = useState(2);
  const [aiLevel, setAiLevel] = useState("中");
  const [aiExtra, setAiExtra] = useState({ practice: true, review: true, explainImg: false, ppt: false, notes: false });

  useEffect(() => {
    if (!classStats) { setAiSelected([]); return; }
    setAiSelected(classStats.processed.filter(q => q.pct < 60 && q.attempts > 0).map(q => q.id));
  }, [selectedQuiz, classStats && classStats.processed.map(q=>q.id+":"+Math.round(q.pct)).join("|")]);

  const buildQuizPrompt = () => {
    if (!classStats) return "尚無數據";
    const list = (aiSelected.length ? classStats.processed.filter(q => aiSelected.includes(q.id)) : classStats.processed.filter(q => q.pct < 60 && q.attempts > 0));
    const weakQ = list.map(q => formatWeakItem(q, `全班得分率 ${Math.round(q.pct)}%，老師預設：${q.level || "中"}`)).join("\n") || "- （無）";
    const topicIds = list.map(q => q.topicId).filter(Boolean);
    const syllabus = getSyllabusTableText(topicIds);
    const tasks = [];
    if (aiExtra.practice) tasks.push(`A. 針對性練習：出 ${aiMc} 題 MC 與 ${aiLq} 題 LQ，難度「${aiLevel}」。MC 附常見錯項；LQ 附分步評分。每題標明 topicId。貼近 HKDSE。`);
    if (aiExtra.review) tasks.push(`B. 約 15 分鐘試後檢討大綱：弱項概念日常例子、常見迷思、3 條堂上 Concept Checking Questions（對應 topicId）。`);
    if (aiExtra.explainImg) tasks.push(`C. 解說圖片：每條弱項 1 張簡報用概念圖文字描述（構圖、標註、公式），註明 topicId。`);
    if (aiExtra.ppt) tasks.push(`D. PPT 大綱：8–12 頁（標題、要點、建議圖示、口述提示），標明 topicId。`);
    if (aiExtra.notes) tasks.push(`E. 溫習筆記：定義 → 公式 → 易錯點 → 一例題，對應 topicId。`);
    if (!tasks.length) tasks.push(`A. 針對性練習：${aiMc} MC + ${aiLq} LQ。`);
    return `【身份】你是香港 DSE 化學科老師，學生約 Band 3。

【任務】全班剛完成小測「${map?.title || selectedQuiz}」（全班平均得分率 ${classStats.avgPct.toFixed(1)}%，${classStats.attempted} 人已入分）。

【弱項／選中題目】（每項含 topicId）
${weakQ}

【課程大綱參考】（相關 Topic ID）
${syllabus}

【產出要求】
${tasks.map((x,i)=>`${i+1}. ${x}`).join("\n")}

【其他】繁體中文；題目須對應 topicId；直接給內容，不要多餘開場白。`;
  };

  const copyQuizPrompt = () => {
    navigator.clipboard.writeText(buildQuizPrompt())
      .then(() => alert("已複製 AI Prompt！"))
      .catch(() => alert("複製失敗"));
  };

  if (!quizIds.length) {
    return <div className="p-8 text-slate-400">尚未有小測藍圖。請先匯入 Sheet 資料（含 quizMaps）。</div>;
  }
  if (!map) {
    return <div className="p-8 text-slate-400">找不到小測資料</div>;
  }

  const rec = selectedStudentId ? studentRec(selectedStudentId) : {};

  return (
    <div className="space-y-4">
      <div className="grid lg:grid-cols-5 gap-4">
        <div className="lg:col-span-2 bg-white rounded-2xl border p-4 space-y-3">
          <select className="w-full border rounded-lg px-2 py-2 text-sm font-bold" value={selectedQuiz}
            onChange={e => { setSelectedQuiz(e.target.value); setSelectedStudentId(""); }}>
            {quizIds.map(id => <option key={id} value={id}>{id} — {quizMaps[id].title || id}</option>)}
          </select>
          {qzLoading && <div className="text-[11px] text-slate-400">載入此小測成績中…</div>}
          <div className="max-h-[60vh] overflow-auto space-y-1">
            {activeStudents.map(s => {
              const ana = calcStudentTotal(s.id);
              const fail = ana && ana.max > 0 && ana.total / ana.max < 0.5;
              return (
                <button key={s.id} onClick={() => setSelectedStudentId(s.id)}
                  className={`w-full text-left px-3 py-2 rounded-xl border text-sm flex justify-between ${selectedStudentId===s.id?"border-blue-400 bg-blue-50":"border-slate-100 hover:bg-slate-50"}`}>
                  <span><b>{s.class}-{s.num}</b> {s.name}</span>
                  {ana && <span className={`text-xs font-bold ${fail?"text-rose-600":"text-emerald-600"}`}>{ana.total}/{ana.max}</span>}
                </button>
              );
            })}
          </div>
        </div>
        <div className="lg:col-span-3 bg-white rounded-2xl border p-4">
          {!selectedStudentId ? (
            <p className="text-slate-400 p-8 text-center">選擇學生輸入小測成績</p>
          ) : (
            <div className="space-y-3">
              <div className="flex flex-wrap justify-between items-center gap-2">
                <div className="font-bold">{activeStudents.find(x=>x.id===selectedStudentId)?.name} · {selectedQuiz}</div>
                <div className="flex items-center gap-2">
                  <span className="text-xs text-slate-400">{saveStatus==="saving"?"儲存中…":saveStatus==="saved"?"已存":""}</span>
                  <button className="text-xs font-bold text-rose-600" onClick={clearStudent}>清除此卷</button>
                </div>
              </div>
              <div className="space-y-2 max-h-[55vh] overflow-auto">
                {qList.map(q => {
                  const raw = rec[q.id];
                  const has = raw !== undefined && raw !== null && String(raw).trim() !== "";
                  let scoreColor = "border-slate-200 bg-white";
                  if (has) {
                    if (q.type === "MC") {
                      const ok = q.ans && q.ans.toString().split(",").map(a=>a.trim().toUpperCase()).includes(String(raw).trim().toUpperCase());
                      scoreColor = ok ? "border-emerald-400 bg-emerald-50 text-emerald-800" : "border-rose-400 bg-rose-50 text-rose-700";
                    } else {
                      const n = parseFloat(raw);
                      if (!isNaN(n) && n <= 0) scoreColor = "border-rose-400 bg-rose-50 text-rose-700";
                      else if (!isNaN(n) && n >= (q.max||0)) scoreColor = "border-emerald-400 bg-emerald-50 text-emerald-800";
                      else scoreColor = "border-amber-400 bg-amber-50 text-amber-800";
                    }
                  }
                  return (
                    <div key={q.id} className="border rounded-xl p-2 flex gap-2 items-center">
                      <div className="w-20 shrink-0">
                        <div className="text-xs font-bold mono">{q.id}</div>
                        <div className="text-[10px] text-slate-400">{q.type}</div>
                      </div>
                      <div className="flex-1 text-xs text-slate-600 truncate" title={q.topicDesc||q.desc}>{q.topicId} {q.topicDesc||q.desc}</div>
                      <div className="flex items-center gap-1">
                        {q.type === "MC" ? (
                          <input data-qz-qid={q.id} ref={el=>{if(el)inputRefs.current[q.id]=el;}}
                            className={`w-14 border-2 rounded px-1 py-1 text-center font-bold uppercase ${scoreColor}`}
                            maxLength={1} value={raw ?? ""}
                            onChange={e=>setQVal(q.id, e.target.value, q)}
                            onKeyDown={e=>{ if(e.key==="Enter"||e.key==="Tab"){ e.preventDefault(); focusNext(q.id);} }}
                          />
                        ) : (
                          <input data-qz-qid={q.id} ref={el=>{if(el)inputRefs.current[q.id]=el;}} type="number"
                            className={`w-16 border-2 rounded px-1 py-1 text-center font-bold ${scoreColor}`}
                            value={raw ?? ""}
                            onChange={e=>setQVal(q.id, e.target.value, q)}
                            onKeyDown={e=>{ if(e.key==="Enter"||e.key==="Tab"){ e.preventDefault(); focusNext(q.id);} }}
                          />
                        )}
                        {q.type !== "MC" && <span className="text-[11px] font-bold text-slate-400">/{q.max}</span>}
                        {q.type==="MC" && q.ans && <span className="text-[10px] text-slate-500 font-bold">{q.ans}</span>}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      </div>

      {/* 補測管理 */}
      <div className="bg-white rounded-2xl border p-5 space-y-4">
        <div className="flex flex-wrap items-center justify-between gap-2">
          <div>
            <h3 className="font-bold text-lg">補測管理 · {selectedQuiz}</h3>
            <p className="text-xs text-slate-500">兩類：無測過、不合格（&lt;50%）。Prompt 會用<strong>個人失分題 + topicId + 課程大綱</strong>。</p>
          </div>
          <button className="text-sm font-black px-5 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white shadow-md border-2 border-amber-600" onClick={addSuggestedToMakeup}>
              ＋ 加入建議名單（無測 + 不合格）
            </button>
        </div>
        <div className="grid md:grid-cols-2 gap-3 text-sm">
          <div className="border rounded-xl p-3 bg-slate-50">
            <div className="font-bold text-slate-600 text-xs mb-2">無測過（{suggestedMakeup.filter(x=>x.category==="ABSENT").length}）</div>
            <div className="max-h-28 overflow-auto space-y-1">
              {suggestedMakeup.filter(x=>x.category==="ABSENT").map(({student:s}) => (
                <div key={s.id} className="flex justify-between text-xs">
                  <span>{s.class}-{s.num} {s.name}</span>
                  <button className="text-indigo-600 font-bold" onClick={()=>ensureMakeupEntry(s.id,"ABSENT")}>加入</button>
                </div>
              ))}
            </div>
          </div>
          <div className="border rounded-xl p-3 bg-rose-50/50">
            <div className="font-bold text-rose-700 text-xs mb-2">不合格（{suggestedMakeup.filter(x=>x.category==="FAIL").length}）</div>
            <div className="max-h-28 overflow-auto space-y-1">
              {suggestedMakeup.filter(x=>x.category==="FAIL").map(({student:s}) => (
                <div key={s.id} className="flex justify-between text-xs">
                  <span>{s.class}-{s.num} {s.name}</span>
                  <button className="text-indigo-600 font-bold" onClick={()=>ensureMakeupEntry(s.id,"FAIL")}>加入</button>
                </div>
              ))}
            </div>
          </div>
        </div>
        <div className="overflow-auto max-h-64 border rounded-xl">
          <table className="min-w-full text-xs">
            <thead className="bg-slate-50 sticky top-0">
              <tr>
                <th className="px-2 py-2 text-left">選</th>
                <th className="px-2 py-2 text-left">學生</th>
                <th className="px-2 py-2 text-center">類別</th>
                <th className="px-2 py-2 text-center">狀態</th>
                <th className="px-2 py-2 text-left">備註</th>
                <th className="px-2 py-2 text-center">操作</th>
              </tr>
            </thead>
            <tbody>
              {Object.keys(makeup).length === 0 && (
                <tr><td colSpan={6} className="px-2 py-6 text-center text-slate-400">尚未加入補測學生</td></tr>
              )}
              {Object.keys(makeup).map(sid => {
                const s = activeStudents.find(x => x.id === sid);
                const m = makeup[sid] || {};
                return (
                  <tr key={sid} className="border-t">
                    <td className="px-2 py-1">
                      <input type="checkbox" checked={makeupSel.includes(sid)}
                        onChange={() => setMakeupSel(prev => prev.includes(sid) ? prev.filter(x=>x!==sid) : [...prev, sid])} />
                    </td>
                    <td className="px-2 py-1 font-semibold">{s ? `${s.class}-${s.num} ${s.name}` : sid}</td>
                    <td className="px-2 py-1 text-center">
                      <select className="border rounded text-[11px] font-bold" value={m.category || "ABSENT"}
                        onChange={e => updateMakeupField(sid, { category: e.target.value })}>
                        <option value="ABSENT">無測過</option>
                        <option value="FAIL">不合格</option>
                      </select>
                    </td>
                    <td className="px-2 py-1 text-center">
                      <select className={`border rounded text-[11px] font-bold ${m.status==="DONE"?"bg-emerald-50 text-emerald-700":"bg-amber-50 text-amber-800"}`}
                        value={m.status || "PENDING"}
                        onChange={e => updateMakeupField(sid, { status: e.target.value })}>
                        <option value="PENDING">未完成</option>
                        <option value="DONE">已完成</option>
                      </select>
                    </td>
                    <td className="px-2 py-1">
                      <input className="w-full border rounded px-2 py-1 text-[11px]" placeholder="例：只完成 Q1–2，放學再來"
                        value={m.remark || ""}
                        onChange={e => updateMakeupField(sid, { remark: e.target.value })} />
                    </td>
                    <td className="px-2 py-1 text-center">
                      <button className="text-rose-600 font-bold" onClick={() => {
                        const next = { ...makeup }; delete next[sid];
                        persistMakeup(next);
                        setMakeupSel(prev => prev.filter(x => x !== sid));
                      }}>移除</button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
        <div className="rounded-2xl border-2 border-violet-300 bg-violet-50 p-4 space-y-3">
          <div className="font-black text-violet-900 text-base">補測 AI Prompt</div>
          <p className="text-xs text-violet-800">會附上<strong>每位學生個人弱點（含 topicId）</strong>與<strong>課程大綱</strong>；Canvas 互動式小測驗。</p>
          <div className="grid sm:grid-cols-3 gap-3">
            <label className="text-sm font-bold text-slate-700">難度
              <select className="mt-1 w-full border-2 border-violet-200 rounded-lg px-3 py-2 text-sm" value={mkLevel} onChange={e=>setMkLevel(e.target.value)}>
                <option value="淺">淺</option><option value="中">中</option><option value="深">深</option>
              </select>
            </label>
            <label className="text-sm font-bold text-slate-700">MC（預設 10）
              <input type="number" min={0} className="mt-1 w-full border-2 border-violet-200 rounded-lg px-3 py-2 text-sm" value={mkMc} onChange={e=>setMkMc(parseInt(e.target.value)||0)} />
            </label>
            <label className="text-sm font-bold text-slate-700">LQ
              <input type="number" min={0} className="mt-1 w-full border-2 border-violet-200 rounded-lg px-3 py-2 text-sm" value={mkLq} onChange={e=>setMkLq(parseInt(e.target.value)||0)} />
            </label>
          </div>
          <button className="w-full sm:w-auto bg-violet-600 hover:bg-violet-700 text-white font-black px-6 py-3 rounded-xl text-base shadow"
            onClick={() => navigator.clipboard.writeText(buildMakeupPrompt()).then(()=>alert("已複製補測 Prompt")).catch(()=>alert("複製失敗"))}>
            複製補測 AI Prompt（{makeupSel.length || Object.keys(makeup).length} 人）
          </button>
        </div>
      </div>

      {/* 整班弱點分析 */}
      <div className="bg-white rounded-2xl border p-5 space-y-5">
        <h3 className="font-bold text-lg">整班弱點分析 · {selectedQuiz} {map?.title}</h3>
        {!classStats ? (
          <p className="text-slate-400 text-sm">尚無足夠成績作分析</p>
        ) : (
          <>
            <div className="grid sm:grid-cols-3 gap-3">
              <div className="rounded-2xl border bg-slate-50 p-4">
                <div className="text-xs font-bold text-slate-500">全班平均得分</div>
                <div className="text-2xl font-black mt-1 tabular-nums">
                  {(classStats.classTotal / Math.max(classStats.attempted,1)).toFixed(1)}
                  <span className="text-base font-bold text-slate-400"> / {(classStats.classMax / Math.max(classStats.attempted,1)).toFixed(1)}</span>
                </div>
              </div>
              <div className="rounded-2xl border bg-indigo-50 border-indigo-100 p-4">
                <div className="text-xs font-bold text-indigo-600">整體得分率</div>
                <div className={`text-3xl font-black mt-1 ${classStats.avgPct<40?"text-rose-600":classStats.avgPct<60?"text-amber-600":"text-emerald-600"}`}>
                  {classStats.avgPct.toFixed(1)}%
                </div>
              </div>
              <div className="rounded-2xl border p-4 bg-violet-50 border-violet-100">
                <div className="text-xs font-bold text-violet-700">P-Value 難度分佈</div>
                <div className="text-sm mt-2 space-y-1 font-semibold">
                  <div className="text-emerald-700">淺 ≥70%：{classStats.processed.filter(q=>q.attempts>0&&q.pct>=70).length} 題</div>
                  <div className="text-amber-700">中 40–69%：{classStats.processed.filter(q=>q.attempts>0&&q.pct>=40&&q.pct<70).length} 題</div>
                  <div className="text-rose-700">深 &lt;40%：{classStats.processed.filter(q=>q.attempts>0&&q.pct<40).length} 題</div>
                </div>
              </div>
            </div>
            <div className="grid md:grid-cols-3 gap-3">
              {[
                { title: "淺 (P-Value ≥ 70%)", cls: "bg-emerald-50 border-emerald-200 text-emerald-800", filter: q => q.attempts>0 && q.pct >= 70 },
                { title: "中 (40% ≤ P-Value < 70%)", cls: "bg-amber-50 border-amber-200 text-amber-900", filter: q => q.attempts>0 && q.pct >= 40 && q.pct < 70 },
                { title: "深 (P-Value < 40%)", cls: "bg-rose-50 border-rose-200 text-rose-800", filter: q => q.attempts>0 && q.pct < 40 },
              ].map((card, i) => {
                const list = classStats.processed.filter(card.filter);
                return (
                  <div key={i} className={`rounded-2xl border p-4 ${card.cls}`}>
                    <div className="font-bold text-sm">{card.title}</div>
                    <div className="text-3xl font-black my-2">{list.length} <span className="text-base">題</span></div>
                    <div className="text-xs font-semibold break-words">{list.map(q=>q.id).join(", ") || "—"}</div>
                  </div>
                );
              })}
            </div>
            <div className="overflow-auto max-h-80 border rounded-xl">
              <table className="min-w-full text-xs">
                <thead className="bg-blue-50 sticky top-0">
                  <tr>
                    <th className="px-2 py-2 text-left">選</th>
                    <th className="px-2 py-2 text-left">題號</th>
                    <th className="px-2 py-2 text-left">考核概念</th>
                    <th className="px-2 py-2 text-center">topicId</th>
                    <th className="px-2 py-2 text-center">預設難度</th>
                    <th className="px-2 py-2 text-center">得分率</th>
                    <th className="px-2 py-2 text-center">體感</th>
                    <th className="px-2 py-2 text-left">診斷</th>
                  </tr>
                </thead>
                <tbody>
                  {classStats.processed.slice().sort((a,b)=>String(a.id).localeCompare(String(b.id), undefined, {numeric:true})).map(q => {
                    const teacherLv = q.level || "中";
                    const actualLv = !q.attempts ? "—" : (q.pct >= 70 ? "淺" : q.pct >= 40 ? "中" : "深");
                    const rank = { "淺": 1, "中": 2, "深": 3 };
                    let diag = "—", diagCls = "text-slate-400";
                    if (q.attempts) {
                      if (rank[actualLv] === rank[teacherLv]) { diag = "✓ 符合預期"; diagCls = "text-emerald-600 font-bold"; }
                      else if (rank[actualLv] > rank[teacherLv]) { diag = "⚠ 殺手題"; diagCls = "text-rose-600 font-bold"; }
                      else { diag = "⚠ 送分題"; diagCls = "text-amber-600 font-bold"; }
                    }
                    const pctCls = !q.attempts ? "text-slate-400" : q.pct < 40 ? "text-rose-600 font-bold" : q.pct < 70 ? "text-amber-600 font-bold" : "text-emerald-600 font-bold";
                    return (
                      <tr key={q.id} className="border-t">
                        <td className="px-2 py-1.5">

              </div>
              <div>
                <div className="text-sm font-bold text-slate-700 mb-2">產出類型（可多選）</div>
                <div className="flex flex-wrap gap-3">

                    ["review","試後檢討大綱"],

                    ["notes","筆記"],

                    <label key={k} className={`flex items-center gap-2 px-3 py-2 rounded-xl border-2 text-sm font-bold cursor-pointer ${aiExtra[k]?"border-violet-500 bg-white text-violet-800":"border-slate-200 bg-slate-50 text-slate-600"}`}>
                      <input type="checkbox" className="w-4 h-4" checked={!!aiExtra[k]} onChange={e=>setAiExtra(x=>({...x,[k]:e.target.checked}))} /> {lab}

              <button className="w-full sm:w-auto bg-violet-600 hover:bg-violet-700 text-white font-black px-8 py-3 rounded-xl text-base shadow" onClick={copyQuizPrompt}>
                複製 AI Prompt（已選 {aiSelected.length} 題）
              </button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}


function QuizSettingsView({ students, quizMaps, setQuizMaps, currentCohort }) {
  const cohorts = useMemo(() => Array.from(new Set(students.map(s => s.cohort).filter(Boolean))).sort(), [students]);
  const [selectedCohort, setSelectedCohort] = useState(currentCohort && currentCohort !== "所有學生" ? currentCohort : (cohorts[0] || ""));
  const [quizId, setQuizId] = useState("");
  const [quizTitle, setQuizTitle] = useState("");
  const [pasteData, setPasteData] = useState("");
  const [editingOriginalId, setEditingOriginalId] = useState(null);
  const [assignCohort, setAssignCohort] = useState("");
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    if (currentCohort && currentCohort !== "所有學生") setSelectedCohort(currentCohort);
  }, [currentCohort]);

  const listIds = useMemo(() => Object.keys(quizMaps || {}).sort(), [quizMaps]);

  const parseLines = (text) => {
    return text.trim().split("\n").map(line => {
      const clean = line.trim(); if (!clean) return null;
      let cols = clean.split("\t").map(c => c.trim());
      if (cols.length < 6) {
        const multi = clean.split(/\s{2,}/).map(c => c.trim()).filter(Boolean);
        if (multi.length >= 6) cols = multi;
      }
      let maxScore = parseFloat(cols[2]); if (isNaN(maxScore) || maxScore <= 0) maxScore = 1;
      const type = (cols[1] || "MC").toUpperCase();
      return {
        id: (cols[0] || "").trim(),
        type,
        max: maxScore,
        level: (cols[3] || "中").trim(),
        topicId: (cols[4] || "").trim(),
        topicDesc: (cols[5] || "").trim(),
        ans: (cols[6] || "").trim().toUpperCase()
      };
    }).filter(q => q && q.id && !String(q.id).includes("題目") && !String(q.id).includes("編號"));
  };

  const loadEdit = (id) => {
    const m = quizMaps[id];
    if (!m) return;
    setEditingOriginalId(id);
    setQuizId(id);
    setQuizTitle(m.title || "");
    setAssignCohort(m.cohort || "");
    let text = "";
    (m.questions || []).forEach(q => {
      text += `${q.id}\t${q.type}\t${q.max}\t${q.level || "中"}\t${q.topicId || ""}\t${q.topicDesc || ""}\t${q.ans || ""}\n`;
    });
    setPasteData(text);
  };

  const handleSave = async () => {
    if (!quizId.trim() || !quizTitle.trim()) return alert("請填寫小測編號與標題");
    const questions = parseLines(pasteData);
    if (!questions.length) return alert("無法解析題目（需要：題號 題型 滿分 難度 課題編號 描述 [答案]）");
    let cohortVal = assignCohort;
    if (cohortVal === "所有學生") cohortVal = "";
    setBusy(true);
    try {
      const newId = quizId.trim();
      const oldId = editingOriginalId;
      const data = { title: quizTitle.trim(), questions, cohort: cohortVal || "" };
      await saveQuizMap(newId, data);
      const next = { ...quizMaps, [newId]: { ...data, _id: newId } };
      if (oldId && oldId !== newId) {
        await deleteQuizMap(oldId);
        delete next[oldId];
        const stuSnap = await db.collection("students").get();
        for (const d of stuSnap.docs) {
          const ref = db.collection("scores").doc(d.id).collection("quizzes").doc(oldId);
          const snap = await ref.get();
          if (snap.exists) {
            await db.collection("scores").doc(d.id).collection("quizzes").doc(newId).set(snap.data(), { merge: true });
            await ref.delete();
          }
        }
      }
      setQuizMaps(next);
      setEditingOriginalId(newId);
      alert("已儲存小測藍圖" + (data.cohort ? `（群組：${data.cohort}）` : "（所有群組通用）"));
    } catch (e) { alert(e.message); }
    setBusy(false);
  };

  const handleDelete = async (id) => {
    if (!confirm(`確定刪除小測藍圖「${id}」？`)) return;
    setBusy(true);
    try {
      await deleteQuizMap(id);
      const next = { ...quizMaps };
      delete next[id];
      setQuizMaps(next);
      if (editingOriginalId === id) {
        setEditingOriginalId(null); setQuizId(""); setQuizTitle(""); setPasteData(""); setAssignCohort("");
      }
    } catch (e) { alert(e.message); }
    setBusy(false);
  };

  const saveCohortOnly = async (id, cohort) => {
    const m = quizMaps[id];
    if (!m) return;
    const c = cohort === "所有學生" ? "" : cohort;
    try {
      await saveQuizMap(id, { ...m, cohort: c });
      setQuizMaps(prev => ({ ...prev, [id]: { ...m, cohort: c } }));
    } catch (e) { alert(e.message); }
  };

  const buildQuizCsvPrompt = () => {
    const syllabus = getSyllabusTableText();
    return `【身份】你是香港 DSE 化學科老師／出題助手。

【任務】我會上傳一份小測（PDF／Word／圖片）。請為每一小題產出 Tab 分隔列，方便貼入系統。

【課程大綱參考】（topicId 必須從下列課題編號選用）
${syllabus}

【規則】
1. 題號：MC1、MC2…／LQ1a、LQ1bi…
2. 題型：MC 或 LQ
3. 滿分：MC 通常 1；LQ 按分
4. 難度：淺／中／深
5. topicId：必須用上方大綱編號；topicDesc：20–30 字
6. 答案：MC 填 A/B/C/D；LQ 可留空

【輸出】只輸出資料行（可含表頭一行），Tab 分隔：
題號	題型	滿分	難度	topicId	topicDesc	答案`;
  };

  return (
    <div className="space-y-4">
      <div className="grid lg:grid-cols-5 gap-4">
        <div className="lg:col-span-2 bg-white rounded-2xl border p-4 space-y-3">
          <h2 className="font-bold text-lg">小測列表</h2>
          <p className="text-sm text-slate-600">無群組 = 所有群組可見。可在此為舊小測補上群組。</p>
          <div className="max-h-[65vh] overflow-auto space-y-2">
            {listIds.map(id => {
              const m = quizMaps[id];
              return (
                <div key={id} className={`border rounded-xl p-3 ${editingOriginalId===id?"border-indigo-400 bg-indigo-50":"border-slate-200"}`}>
                  <button className="w-full text-left" onClick={() => loadEdit(id)}>
                    <div className="font-bold text-base mono text-indigo-700">{id}</div>
                    <div className="text-sm font-semibold text-slate-800 truncate">{m.title}</div>
                    <div className="text-sm text-slate-500 mt-0.5">{(m.questions||[]).length} 題 · {m.cohort ? `群組 ${m.cohort}` : "所有群組通用"}</div>
                  </button>
                  <div className="mt-2 flex gap-2 items-center">
                    <select className="text-sm border rounded-lg flex-1 py-1.5 px-2 font-semibold" value={m.cohort || "所有學生"}
                      onChange={e => saveCohortOnly(id, e.target.value)}>
                      <option value="所有學生">所有群組</option>
                      {cohorts.map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                    <button className="text-sm text-rose-600 font-bold px-2" onClick={() => handleDelete(id)}>刪除</button>
                  </div>
                </div>
              );
            })}
            {!listIds.length && <p className="text-slate-400 text-sm">尚無小測，請右側新增或匯入。</p>}
          </div>
        </div>
        <div className="lg:col-span-3 bg-white rounded-2xl border p-5 space-y-4">
          <h2 className="font-bold text-lg">{editingOriginalId ? `編輯：${editingOriginalId}` : "新增小測"}</h2>
          <div className="grid sm:grid-cols-2 gap-3">
            <label className="text-sm font-bold text-slate-600">小測編號
              <input className="mt-1 w-full border-2 rounded-lg px-3 py-2 text-sm font-bold" value={quizId} onChange={e=>setQuizId(e.target.value)} />
            </label>
            <label className="text-sm font-bold text-slate-600">標題
              <input className="mt-1 w-full border-2 rounded-lg px-3 py-2 text-sm" value={quizTitle} onChange={e=>setQuizTitle(e.target.value)} />
            </label>
            <label className="text-sm font-bold text-slate-600">所屬群組
              <select className="mt-1 w-full border-2 rounded-lg px-3 py-2 text-sm" value={assignCohort || "所有學生"} onChange={e=>setAssignCohort(e.target.value === "所有學生" ? "" : e.target.value)}>
                <option value="所有學生">所有群組通用</option>
                {cohorts.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </label>
            <div className="text-sm text-slate-500 flex items-end pb-2">新建建議選目前群組「{selectedCohort || "—"}」</div>
          </div>
          <label className="text-sm font-bold text-slate-600 block">題目（Tab：題號 題型 滿分 難度 topicId 描述 [答案]）
            <textarea className="mt-1 w-full border-2 rounded-xl p-3 text-sm mono h-52" value={pasteData} onChange={e=>setPasteData(e.target.value)}

          </label>
          <div className="flex flex-wrap gap-2">
            <button disabled={busy} className="bg-indigo-600 text-white font-bold px-5 py-2.5 rounded-xl text-sm disabled:opacity-50" onClick={handleSave}>
              {busy ? "儲存中…" : "儲存到 Firebase"}
            </button>
            <button className="border-2 font-bold px-5 py-2.5 rounded-xl text-sm" onClick={() => {
              setEditingOriginalId(null); setQuizId(""); setQuizTitle(""); setPasteData("");

          </div>
        </div>
      </div>
      <div className="rounded-2xl border-2 border-violet-300 bg-violet-50 p-5 space-y-3">

        <p className="text-sm text-violet-800">上傳小測卷後，用此 Prompt 生成含 <b>topicId</b> 的 Tab 表格（已附課程大綱）。</p>
        <button className="bg-violet-600 hover:bg-violet-700 text-white font-black px-6 py-3 rounded-xl text-base"
          onClick={() => navigator.clipboard.writeText(buildQuizCsvPrompt()).then(()=>alert("已複製")).catch(()=>alert("失敗"))}>
